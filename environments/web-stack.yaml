version: 1
name: web-stack
description: >-
  Three-tier web stack: load balancer, two application servers, a primary
  database and a cache. Five nodes, the local verification cap - fleet scale
  testing runs on a separate machine.

# This seed plus this file and the referenced generator spec fully determine the
# emitted stream. Archive all three and a past demo replays identically.
seed: 8675309

update_every: 1
generator: ../specs/linux-system.yaml
# Shared across environments rather than copied per environment. The installer
# rewrites both paths to match the installed layout.
scenarios: ../scenarios

# GUIDs are authored, never generated per run. The GUID is the node's identity
# in Netdata: change it and history is orphaned; change only the hostname and
# the node is renamed in place with its history, trained ML models and alert
# log intact. The re-skin workflow depends entirely on that distinction, so
# these values must survive edits to everything else in this file.
#
# Hostnames and labels are the re-skin surface: retarget this environment at a
# different prospect by rewriting them and leaving every GUID alone.
nodes:

  - hostname: sim-lb-01
    guid: 4a1f9d20-5e83-4c17-b6a2-0d94e7fc3518
    role: lb
    utc_offset_secs: 0
    attrs:
      cores: 4
      ram_total_kb: 4194304
      swap_total_kb: 4194304
    instances:
      disk:
        - { name: sda, weight: 1.0 }
      mount:
        - { name: "/",     weight: 1.0,  attrs: { disk_total_kb: 52428800,  inodes_total: 3276800 } }
        - { name: "/boot", weight: 0.02, attrs: { disk_total_kb: 1048576,   inodes_total: 65536 } }
      net:
        - { name: eth0, weight: 1.0 }
    labels:
      _os_name: Debian GNU/Linux
      _os_version: "12"
      _kernel_version: 6.1.0-28-amd64
      _architecture: x86_64
      _system_cores: "4"
      _system_ram_total: "4194304"
      _virtualization: kvm
      _virt_detection: systemd-detect-virt
      _container: none
      _container_detection: none
      _cloud_provider_type: aws
      _cloud_instance_type: c5.xlarge
      _cloud_instance_region: us-east-1
      _install_type: infra-sim
      infra_sim_role: lb
      infra_sim_tier: edge
      infra_sim_env: production

  - hostname: sim-web-01
