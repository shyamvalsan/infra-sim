version: 1
name: otel-fleet
description: >-
  An OpenTelemetry Collector deployment in the shape people actually run: agent
  collectors alongside the application on each app host, forwarding to a
  gateway pair that does the batching and export. Five nodes, the local
  verification cap.

  This is the collector as a monitored service. Netdata's OTLP ingestion path
  cannot create virtual nodes - a probe (SOW-0002) confirmed that resources
  carrying distinct host.name attributes all land on the ingesting host as chart
  labels - so a collector fleet is modelled on the plugins.d path like any other
  service, which keeps per-node dashboards, per-node ML and the re-skin story.

  The demo it supports: the gateway queue backing up, retries climbing, and
  points being refused upstream - the failure where the thing that would have
  told you is the thing that broke.

seed: 31415926535
update_every: 1
generator: ../specs/linux-system.yaml
specs: ../specs
scenarios: ../scenarios

# GUIDs are authored and stable. Re-skin by rewriting hostnames and labels and
# leaving every GUID alone; the node keeps its history, trained ML models and
# alert log.
