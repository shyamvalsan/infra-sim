version: 1
name: robotics-edge
description: >-
  Distributed robotics fleet: edge gateways at four sites plus a regional
  aggregator. Small ARM devices on flaky links, which is the shape that makes
  this vertical distinct - low resource ceilings, high node count, and
  connectivity as the dominant failure mode.

  Five nodes here to respect the local verification cap; the real value of this
  template is at hundreds of gateways, which is a scale-test on another machine.

