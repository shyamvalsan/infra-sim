version: 1
name: azure-vmss
description: 'Azure Virtual Machine Scale Set as reported through Netdata''s azure_monitor collector,
  generated from its service profile (Microsoft.Compute/virtualMachineScaleSets) so the contexts, units,
  families and dimension names match a real deployment. Charts are per-resource instances, as the collector
  emits them: resources are labels on one node, never separate nodes. Signals move independently rather
  than being causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  vmss_cpu_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  vmss_cpu_credits_consumed:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
