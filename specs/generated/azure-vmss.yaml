contexts:
- id: azure_monitor.vmss.cpu
  title: Azure VMSS CPU Utilization
  units: percentage
  family: CPU
  chart_type: line
  priority: 90010
  instances:
    group: azure_vmss
    chart_prefix: vmss_cpu
    family: CPU
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: vmss_cpu_average
- id: azure_monitor.vmss.cpu_credits
  title: Azure VMSS CPU Credits
  units: credits
  family: CPU
  chart_type: line
  priority: 90020
