version: 1
name: icecast
description: Icecast metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Icecast node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  icecast_listeners_listeners:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: icecast.listeners
  title: Icecast Listeners
  units: listeners
  family: listeners
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    source: sim-source-1
  dimensions:
  - id: listeners
    signal: icecast_listeners_listeners
