    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  nfs_server_proc4_a_dimension_per_proc4_call:
    base: 130.0
    min: 0.0
    max: 1000000.0
