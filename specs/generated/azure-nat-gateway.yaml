version: 1
name: azure-nat-gateway
description: 'Azure NAT Gateway as reported through Netdata''s azure_monitor collector, generated from
  its service profile (Microsoft.Network/natGateways) so the contexts, units, families and dimension names
  match a real deployment. Charts are per-resource instances, as the collector emits them: resources are
  labels on one node, never separate nodes. Signals move independently rather than being causally coupled
  - see scripts/sync-profile-collectors.py.'
signals:
  nat_gateway_datapath_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  nat_gateway_byte_throughput_total:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  nat_gateway_packet_throughput_total:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    noise:
      kind: gauss
      sigma: 0.18
  nat_gateway_dropped_packets_total:
    base: 0.0
    min: 0.0
    max: 20000000.0
    noise:
      kind: gauss
      sigma: 0.18
  nat_gateway_snat_connections_total:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
  nat_gateway_total_connections_total:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.nat_gateway.datapath_availability
  title: Azure NAT Gateway Datapath Availability
  units: percentage
  family: Availability
  chart_type: line
  priority: 90010
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_datapath_availability
    family: Availability
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: nat_gateway_datapath_availability_average
- id: azure_monitor.nat_gateway.byte_throughput
  title: Azure NAT Gateway Byte Throughput
  units: bytes/s
  family: Throughput
  chart_type: line
  priority: 90020
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_byte_throughput
    family: Throughput
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: nat_gateway_byte_throughput_total
- id: azure_monitor.nat_gateway.packet_throughput
  title: Azure NAT Gateway Packet Throughput
  units: packets/s
  family: Throughput
  chart_type: line
  priority: 90030
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_packet_throughput
    family: Throughput
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: nat_gateway_packet_throughput_total
- id: azure_monitor.nat_gateway.dropped_packets
  title: Azure NAT Gateway Dropped Packets
  units: packets/s
  family: Errors
  chart_type: line
  priority: 90040
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_dropped_packets
    family: Errors
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: nat_gateway_dropped_packets_total
- id: azure_monitor.nat_gateway.snat_connections
  title: Azure NAT Gateway SNAT Connections
  units: connections
  family: Connections
  chart_type: line
  priority: 90050
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_snat_connections
    family: Connections
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: nat_gateway_snat_connections_total
- id: azure_monitor.nat_gateway.total_connections
  title: Azure NAT Gateway Total SNAT Connections
  units: connections
  family: Connections
  chart_type: line
  priority: 90060
  instances:
    group: azure_nat_gateway
    chart_prefix: nat_gateway_total_connections
    family: Connections
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: nat_gateway_total_connections_total
