version: 1
name: azure-sql-managed-instance
description: 'Azure SQL Managed Instance as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.Sql/managedInstances) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
signals:
  sql_managed_instance_cpu_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_cpu_maximum:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_io_throughput_read:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_io_throughput_written:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_io_requests_average:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_storage_reserved:
    base: 620.0
    min: 0.0
    max: 900000.0
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_storage_used:
    base: 620.0
    min: 0.0
    max: 900000.0
    noise:
      kind: gauss
      sigma: 0.18
  sql_managed_instance_virtual_core_count_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.sql_managed_instance.cpu
  title: Azure SQL Managed Instance CPU Utilization
  units: percentage
  family: Utilization
  chart_type: line
  priority: 90010
  instances:
    group: azure_sql_managed_instance
    chart_prefix: sql_managed_instance_cpu
    family: Utilization
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: sql_managed_instance_cpu_average
  - id: maximum
    signal: sql_managed_instance_cpu_maximum
- id: azure_monitor.sql_managed_instance.io_throughput
  title: Azure SQL Managed Instance I/O Throughput
  units: bytes/s
  family: IO
  chart_type: line
  priority: 90020
  instances:
    group: azure_sql_managed_instance
    chart_prefix: sql_managed_instance_io_throughput
    family: IO
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: read
    signal: sql_managed_instance_io_throughput_read
  - id: written
    signal: sql_managed_instance_io_throughput_written
- id: azure_monitor.sql_managed_instance.io_requests
  title: Azure SQL Managed Instance I/O Requests
  units: requests/s
  family: IO
  chart_type: line
  priority: 90030
  instances:
    group: azure_sql_managed_instance
    chart_prefix: sql_managed_instance_io_requests
    family: IO
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: sql_managed_instance_io_requests_average
- id: azure_monitor.sql_managed_instance.storage
  title: Azure SQL Managed Instance Storage
  units: MiB
  family: Capacity
  chart_type: line
  priority: 90040
  instances:
    group: azure_sql_managed_instance
    chart_prefix: sql_managed_instance_storage
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: reserved
    signal: sql_managed_instance_storage_reserved
  - id: used
    signal: sql_managed_instance_storage_used
- id: azure_monitor.sql_managed_instance.virtual_core_count
  title: Azure SQL Managed Instance Virtual Core Count
  units: cores
  family: Capacity
  chart_type: line
  priority: 90050
  instances:
    group: azure_sql_managed_instance
    chart_prefix: sql_managed_instance_virtual_core_count
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: sql_managed_instance_virtual_core_count_average
