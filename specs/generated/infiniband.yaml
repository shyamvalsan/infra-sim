contexts:
- id: ib.bytes
  title: Bandwidth usage
  units: kilobits/s
  family: bytes
  chart_type: area
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: Received
    rate_signal: infiniband_bytes_received
  - id: Sent
    rate_signal: infiniband_bytes_sent
- id: ib.packets
  title: Packets Statistics
  units: packets/s
  family: packets
  chart_type: area
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: Received
    rate_signal: infiniband_packets_received
  - id: Sent
    rate_signal: infiniband_packets_sent
  - id: Mcast_rcvd
    rate_signal: infiniband_packets_mcast_rcvd
  - id: Mcast_sent
    rate_signal: infiniband_packets_mcast_sent
  - id: Ucast_rcvd
    rate_signal: infiniband_packets_ucast_rcvd
  - id: Ucast_sent
    rate_signal: infiniband_packets_ucast_sent
- id: ib.errors
