      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  btrfs_disk_sys_used:
    base: 620.0
    min: 0.0
    max: 900000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  btrfs_data_free:
    base: 620.0
    min: 0.0
    max: 900000.0
    seasonality:
      daily_amplitude: 0.45
