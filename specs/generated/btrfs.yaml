version: 1
name: btrfs
description: BTRFS metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real BTRFS node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  btrfs_disk_unallocated:
    base: 620.0
    min: 0.0
    max: 900000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  btrfs_disk_data_free:
    base: 620.0
    min: 0.0
    max: 900000.0
    seasonality:
      daily_amplitude: 0.45
