version: 1
name: monit
description: Monit metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Monit node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  monit_service_check_status_ok:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  monit_service_check_status_error:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  monit_service_check_status_initializing:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  monit_service_check_status_not_monitored:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
contexts:
- id: monit.service_check_status
  title: Service Check Status
  units: status
  family: service
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    server_hostname: sim-server_hostname-1
    service_check_name: sim-service_check_name-1
    service_check_type: sim-service_check_type-1
  dimensions:
  - id: ok
    signal: monit_service_check_status_ok
  - id: error
    signal: monit_service_check_status_error
  - id: initializing
    signal: monit_service_check_status_initializing
  - id: not_monitored
    signal: monit_service_check_status_not_monitored
