version: 1
name: net-inet6-icmp6-stats
description: net.inet6.icmp6.stats metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real net.inet6.icmp6.stats node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
