    chart_prefix: aks_apiserver_cpu
    family: API Server
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: aks_apiserver_cpu_average
  - id: maximum
    signal: aks_apiserver_cpu_maximum
