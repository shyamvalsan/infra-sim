contexts:
- id: adcs.cert_requests
  title: Certificate requests processed
  units: requests/s
  family: cert
  chart_type: line
  priority: 60001
  shape: counters
  labels:
    cert: sim-cert-1
  dimensions:
  - id: requests
    rate_signal: active_directory_certificate_service_cert_requests_requests
- id: adcs.cert_request_processing_time
  title: Certificate last request processing time
  units: seconds
  family: cert
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    cert: sim-cert-1
  dimensions:
