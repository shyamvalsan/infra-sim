version: 1
name: active-directory-certificate-service
description: Active Directory Certificate Service metrics, generated from Netdata's own collector metadata
  so the contexts, units and dimension names match what a real Active Directory Certificate Service node
  reports. Signals are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  active_directory_certificate_service_cert_requests_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  active_directory_certificate_service_cert_request_processing_time_processing_times:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  active_directory_certificate_service_cert_retrievals_retrievals:
