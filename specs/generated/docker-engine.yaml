contexts:
- id: docker_engine.engine_daemon_container_actions
  title: Container Actions
  units: actions/s
  family: engine
  chart_type: stacked
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: changes
    rate_signal: docker_engine_engine_daemon_container_actions_changes
  - id: commit
    rate_signal: docker_engine_engine_daemon_container_actions_commit
  - id: create
    rate_signal: docker_engine_engine_daemon_container_actions_create
  - id: delete
    rate_signal: docker_engine_engine_daemon_container_actions_delete
  - id: start
    rate_signal: docker_engine_engine_daemon_container_actions_start
- id: docker_engine.engine_daemon_container_states_containers
  title: Containers In Various States
  units: containers
  family: engine
  chart_type: stacked
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: running
    signal: docker_engine_engine_daemon_container_states_containers_running
  - id: paused
    signal: docker_engine_engine_daemon_container_states_containers_paused
  - id: stopped
    signal: docker_engine_engine_daemon_container_states_containers_stopped
- id: docker_engine.builder_builds_failed_total
  title: Builder Builds Fails By Reason
  units: fails/s
  family: builder
  chart_type: stacked
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: build_canceled
    rate_signal: docker_engine_builder_builds_failed_total_build_canceled
  - id: build_target_not_reachable_error
    rate_signal: docker_engine_builder_builds_failed_total_build_target_not_reachable_error
  - id: command_not_supported_error
    rate_signal: docker_engine_builder_builds_failed_total_command_not_supported_error
  - id: dockerfile_empty_error
    rate_signal: docker_engine_builder_builds_failed_total_dockerfile_empty_error
  - id: dockerfile_syntax_error
    rate_signal: docker_engine_builder_builds_failed_total_dockerfile_syntax_error
  - id: error_processing_commands_error
    rate_signal: docker_engine_builder_builds_failed_total_error_processing_commands_error
  - id: missing_onbuild_arguments_error
    rate_signal: docker_engine_builder_builds_failed_total_missing_onbuild_arguments_error
  - id: unknown_instruction_error
    rate_signal: docker_engine_builder_builds_failed_total_unknown_instruction_error
- id: docker_engine.engine_daemon_health_checks_failed_total
  title: Health Checks
  units: events/s
  family: engine
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: fails
    rate_signal: docker_engine_engine_daemon_health_checks_failed_total_fails
- id: docker_engine.swarm_manager_leader
  title: Swarm Manager Leader
  units: bool
  family: swarm
  chart_type: line
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: is_leader
    signal: docker_engine_swarm_manager_leader_is_leader
- id: docker_engine.swarm_manager_object_store
  title: Swarm Manager Object Store
  units: objects
  family: swarm
  chart_type: stacked
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: nodes
    signal: docker_engine_swarm_manager_object_store_nodes
  - id: services
    signal: docker_engine_swarm_manager_object_store_services
  - id: tasks
    signal: docker_engine_swarm_manager_object_store_tasks
  - id: networks
