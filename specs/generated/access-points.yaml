version: 1
name: access-points
description: Access Points metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Access Points node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  access_points_clients_clients:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_net_received:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_net_sent:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_packets_received:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_packets_sent:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_issues_retries:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_issues_failures:
    base: 0.0
    min: 0.0
    max: 1000000.0
  access_points_signal_average_signal:
    base: -62.0
    min: -120.0
    max: 30.0
    noise:
      kind: walk
      sigma: 0.04
      reversion: 0.1
  access_points_bitrate_receive:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  access_points_bitrate_transmit:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: ap.clients
  title: Connected clients
  units: clients
  family: clients
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: clients
    signal: access_points_clients_clients
- id: ap.net
  title: Bandwidth
  units: kilobits/s
  family: net
  chart_type: area
  priority: 60002
  shape: counters
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: received
    rate_signal: access_points_net_received
  - id: sent
    rate_signal: access_points_net_sent
- id: ap.packets
  title: Packets
  units: packets/s
  family: packets
  chart_type: line
  priority: 60003
  shape: counters
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: received
    rate_signal: access_points_packets_received
  - id: sent
    rate_signal: access_points_packets_sent
- id: ap.issues
  title: Transmit Issues
  units: issues/s
  family: issues
  chart_type: line
  priority: 60004
  shape: counters
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: retries
    rate_signal: access_points_issues_retries
  - id: failures
    rate_signal: access_points_issues_failures
- id: ap.signal
  title: Average Signal
  units: dBm
  family: signal
  chart_type: line
  priority: 60005
  shape: independent
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: average signal
    signal: access_points_signal_average_signal
- id: ap.bitrate
  title: Bitrate
  units: Mbps
  family: bitrate
  chart_type: line
  priority: 60006
  shape: independent
  labels:
    device: sim-device-1
    ssid: sim-ssid-1
  dimensions:
  - id: receive
    signal: access_points_bitrate_receive
  - id: transmit
    signal: access_points_bitrate_transmit
