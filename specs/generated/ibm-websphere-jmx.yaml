version: 1
name: ibm-websphere-jmx
description: IBM WebSphere JMX metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real IBM WebSphere JMX node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  ibm_websphere_jmx_app_requests_requests:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
