contexts:
- id: azure_monitor.sql_database.cpu
  title: Azure SQL Database CPU Utilization
  units: percentage
  family: Utilization
  chart_type: line
  priority: 90010
  instances:
    group: azure_sql_database
    chart_prefix: sql_database_cpu
    family: Utilization
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: sql_database_cpu_average
  - id: maximum
    signal: sql_database_cpu_maximum
