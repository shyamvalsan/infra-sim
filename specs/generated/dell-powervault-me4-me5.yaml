version: 1
name: dell-powervault-me4-me5
description: Dell PowerVault ME4/ME5 metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Dell PowerVault ME4/ME5 node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
