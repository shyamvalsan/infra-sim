contexts:
- id: memcached.cache
  title: Cache Size
  units: MiB
  family: cache
  chart_type: stacked
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: available
    signal: memcached_cache_available
  - id: used
    signal: memcached_cache_used
- id: memcached.net
  title: Network
  units: kilobits/s
  family: net
  chart_type: area
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: in
    rate_signal: memcached_net_in
  - id: out
    rate_signal: memcached_net_out
- id: memcached.connections
  title: Connections
  units: connections/s
  family: connections
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: current
    rate_signal: memcached_connections_current
  - id: rejected
    rate_signal: memcached_connections_rejected
  - id: total
    rate_signal: memcached_connections_total
- id: memcached.items
  title: Items
  units: items
  family: items
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: current
    signal: memcached_items_current
  - id: total
    signal: memcached_items_total
- id: memcached.evicted_reclaimed
  title: Evicted and Reclaimed Items
  units: items
  family: evicted
  chart_type: line
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: reclaimed
    signal: memcached_evicted_reclaimed_reclaimed
  - id: evicted
    signal: memcached_evicted_reclaimed_evicted
- id: memcached.get
  title: Get Requests
  units: requests
  family: get
  chart_type: stacked
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: hints
    signal: memcached_get_hints
  - id: misses
    signal: memcached_get_misses
- id: memcached.get_rate
  title: Get Request Rate
  units: requests/s
  family: get
  chart_type: line
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: rate
    rate_signal: memcached_get_rate_rate
- id: memcached.set_rate
  title: Set Request Rate
  units: requests/s
  family: set
  chart_type: line
  priority: 60008
  shape: counters
  labels: {}
  dimensions:
  - id: rate
    rate_signal: memcached_set_rate_rate
- id: memcached.delete
  title: Delete Requests
  units: requests
  family: delete
  chart_type: stacked
  priority: 60009
  shape: independent
  labels: {}
  dimensions:
  - id: hits
    signal: memcached_delete_hits
  - id: misses
    signal: memcached_delete_misses
- id: memcached.cas
  title: Check and Set Requests
  units: requests
  family: cas
  chart_type: stacked
  priority: 60010
  shape: independent
  labels: {}
  dimensions:
  - id: hits
    signal: memcached_cas_hits
  - id: misses
    signal: memcached_cas_misses
  - id: bad value
    signal: memcached_cas_bad_value
- id: memcached.increment
  title: Increment Requests
  units: requests
  family: increment
  chart_type: stacked
  priority: 60011
  shape: independent
  labels: {}
  dimensions:
  - id: hits
    signal: memcached_increment_hits
  - id: misses
    signal: memcached_increment_misses
- id: memcached.decrement
  title: Decrement Requests
  units: requests
  family: decrement
  chart_type: stacked
  priority: 60012
  shape: independent
  labels: {}
  dimensions:
  - id: hits
    signal: memcached_decrement_hits
  - id: misses
    signal: memcached_decrement_misses
- id: memcached.touch
  title: Touch Requests
  units: requests
  family: touch
  chart_type: stacked
  priority: 60013
  shape: independent
  labels: {}
  dimensions:
  - id: hits
    signal: memcached_touch_hits
  - id: misses
    signal: memcached_touch_misses
- id: memcached.touch_rate
  title: Touch Request Rate
  units: requests/s
  family: touch
  chart_type: line
  priority: 60014
  shape: counters
  labels: {}
  dimensions:
  - id: rate
    rate_signal: memcached_touch_rate_rate
