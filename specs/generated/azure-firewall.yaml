version: 1
name: azure-firewall
description: 'Azure Firewall as reported through Netdata''s azure_monitor collector, generated from its
  service profile (Microsoft.Network/azureFirewalls) so the contexts, units, families and dimension names
  match a real deployment. Charts are per-resource instances, as the collector emits them: resources are
  labels on one node, never separate nodes. Signals move independently rather than being causally coupled
  - see scripts/sync-profile-collectors.py.'
signals:
  firewall_health_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  firewall_latency_average:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  firewall_throughput_average:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  firewall_data_processed_total:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  firewall_rule_hits_application:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  firewall_rule_hits_network:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  firewall_snat_port_utilization_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  firewall_capacity_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.firewall.health
  title: Azure Firewall Health State
  units: percentage
  family: Health
  chart_type: line
  priority: 90010
  instances:
    group: azure_firewall
    chart_prefix: firewall_health
    family: Health
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: firewall_health_average
- id: azure_monitor.firewall.latency
  title: Azure Firewall Latency Probe
  units: milliseconds
  family: Performance
  chart_type: line
  priority: 90020
  instances:
    group: azure_firewall
    chart_prefix: firewall_latency
    family: Performance
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: firewall_latency_average
- id: azure_monitor.firewall.throughput
  title: Azure Firewall Throughput
  units: bits/s
  family: Traffic
  chart_type: line
  priority: 90030
  instances:
    group: azure_firewall
    chart_prefix: firewall_throughput
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: firewall_throughput_average
- id: azure_monitor.firewall.data_processed
  title: Azure Firewall Data Processed
  units: bytes/s
  family: Traffic
  chart_type: line
  priority: 90040
  instances:
    group: azure_firewall
    chart_prefix: firewall_data_processed
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: firewall_data_processed_total
- id: azure_monitor.firewall.rule_hits
  title: Azure Firewall Rule Hits
  units: hits/s
  family: Rules
  chart_type: line
  priority: 90050
  instances:
    group: azure_firewall
    chart_prefix: firewall_rule_hits
    family: Rules
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: application
    signal: firewall_rule_hits_application
  - id: network
    signal: firewall_rule_hits_network
- id: azure_monitor.firewall.snat_port_utilization
  title: Azure Firewall SNAT Port Utilization
  units: percentage
  family: SNAT
  chart_type: line
  priority: 90060
  instances:
    group: azure_firewall
    chart_prefix: firewall_snat_port_utilization
    family: SNAT
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: firewall_snat_port_utilization_average
- id: azure_monitor.firewall.capacity
  title: Azure Firewall Observed Capacity Units
  units: units
  family: Capacity
  chart_type: line
  priority: 90070
  instances:
    group: azure_firewall
    chart_prefix: firewall_capacity
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: firewall_capacity_average
