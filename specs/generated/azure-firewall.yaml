version: 1
name: azure-firewall
description: Azure Firewall metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Azure Firewall node reports. Signals are independent and
  plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_firewall_firewall_health_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_latency_average:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_throughput_average:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_data_processed_total:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_rule_hits_application:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_rule_hits_network:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_snat_port_utilization_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_firewall_firewall_capacity_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: azure_monitor.firewall.health
  title: Azure Firewall Health State
  units: percentage
  family: firewall.health
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_firewall_firewall_health_average
- id: azure_monitor.firewall.latency
  title: Azure Firewall Latency Probe
  units: milliseconds
  family: firewall.latency
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_firewall_firewall_latency_average
- id: azure_monitor.firewall.throughput
  title: Azure Firewall Throughput
  units: bits/s
  family: firewall.throughput
  chart_type: line
  priority: 60003
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    rate_signal: azure_firewall_firewall_throughput_average
- id: azure_monitor.firewall.data_processed
  title: Azure Firewall Data Processed
  units: bytes/s
  family: firewall.data
  chart_type: line
  priority: 60004
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: total
    rate_signal: azure_firewall_firewall_data_processed_total
- id: azure_monitor.firewall.rule_hits
  title: Azure Firewall Rule Hits
  units: hits/s
  family: firewall.rule
  chart_type: line
  priority: 60005
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: application
    rate_signal: azure_firewall_firewall_rule_hits_application
  - id: network
    rate_signal: azure_firewall_firewall_rule_hits_network
- id: azure_monitor.firewall.snat_port_utilization
  title: Azure Firewall SNAT Port Utilization
  units: percentage
  family: firewall.snat
  chart_type: line
  priority: 60006
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_firewall_firewall_snat_port_utilization_average
- id: azure_monitor.firewall.capacity
  title: Azure Firewall Observed Capacity Units
  units: units
  family: firewall.capacity
  chart_type: line
  priority: 60007
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_firewall_firewall_capacity_average
