version: 1
name: proxysql
description: ProxySQL metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real ProxySQL node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
