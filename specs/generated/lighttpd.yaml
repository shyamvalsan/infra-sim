version: 1
name: lighttpd
description: Lighttpd metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Lighttpd node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  lighttpd_requests_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_net_sent:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_workers_idle:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_workers_busy:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_waiting:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_open:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_close:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_hard_error:
    base: 0.0
    min: 0.0
    max: 200000.0
  lighttpd_scoreboard_keepalive:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_read:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_read_post:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_write:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_handle_request:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_request_start:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_scoreboard_request_end:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lighttpd_uptime_uptime:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: lighttpd.requests
  title: Requests
  units: requests/s
  family: requests
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: lighttpd_requests_requests
- id: lighttpd.net
  title: Bandwidth
  units: kilobits/s
  family: net
  chart_type: area
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: sent
    rate_signal: lighttpd_net_sent
- id: lighttpd.workers
  title: Servers
  units: servers
  family: workers
  chart_type: stacked
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: idle
    signal: lighttpd_workers_idle
  - id: busy
    signal: lighttpd_workers_busy
- id: lighttpd.scoreboard
  title: ScoreBoard
  units: connections
  family: scoreboard
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: waiting
    signal: lighttpd_scoreboard_waiting
  - id: open
    signal: lighttpd_scoreboard_open
  - id: close
    signal: lighttpd_scoreboard_close
  - id: hard_error
    signal: lighttpd_scoreboard_hard_error
  - id: keepalive
    signal: lighttpd_scoreboard_keepalive
  - id: read
    signal: lighttpd_scoreboard_read
  - id: read_post
    signal: lighttpd_scoreboard_read_post
  - id: write
    signal: lighttpd_scoreboard_write
  - id: handle_request
    signal: lighttpd_scoreboard_handle_request
  - id: request_start
    signal: lighttpd_scoreboard_request_start
  - id: request_end
    signal: lighttpd_scoreboard_request_end
- id: lighttpd.uptime
  title: Uptime
  units: seconds
  family: uptime
  chart_type: line
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: uptime
    signal: lighttpd_uptime_uptime
