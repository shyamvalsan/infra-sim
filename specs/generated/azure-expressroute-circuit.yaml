      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_expressroute_circuit_express_route_circuit_throughput_out:
    base: 130.0
    min: 0.0
    max: 1000000.0
