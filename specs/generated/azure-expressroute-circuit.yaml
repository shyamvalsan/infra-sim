version: 1
name: azure-expressroute-circuit
description: Azure ExpressRoute Circuit metrics, generated from Netdata's own collector metadata so the
  contexts, units and dimension names match what a real Azure ExpressRoute Circuit node reports. Signals
  are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_expressroute_circuit_express_route_circuit_arp_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_expressroute_circuit_express_route_circuit_bgp_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
