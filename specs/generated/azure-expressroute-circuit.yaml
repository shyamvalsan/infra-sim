contexts:
- id: azure_monitor.express_route_circuit.arp_availability
  title: Azure ExpressRoute Circuit ARP Availability
  units: percentage
  family: express
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
