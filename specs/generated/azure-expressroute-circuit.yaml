      kind: gauss
      sigma: 0.16
  azure_expressroute_circuit_express_route_circuit_fastpath_routes_maximum:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_expressroute_circuit_express_route_circuit_global_reach_throughput_in:
    base: 130.0
    min: 0.0
    max: 1000000.0
