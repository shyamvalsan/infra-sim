version: 1
name: netfilter
description: Netfilter metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Netfilter node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  netfilter_netlink_new_new:
    base: 45.0
    min: 0.0
    max: 500000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  netfilter_netlink_new_ignore:
