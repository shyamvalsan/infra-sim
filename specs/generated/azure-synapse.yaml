version: 1
name: azure-synapse
description: 'Azure Synapse Analytics Workspace as reported through Netdata''s azure_monitor collector,
  generated from its service profile (Microsoft.Synapse/workspaces) so the contexts, units, families and
  dimension names match a real deployment. Charts are per-resource instances, as the collector emits them:
  resources are labels on one node, never separate nodes. Signals move independently rather than being
  causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  synapse_builtin_sql_pool_data_processed_processed:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  synapse_builtin_sql_pool_login_attempts_login_attempts:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  synapse_builtin_sql_pool_requests_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  synapse_activity_runs_ended:
