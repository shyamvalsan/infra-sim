contexts:
- id: azure_monitor.synapse.builtin_sql_pool_data_processed
  title: Azure Synapse Built-in SQL Pool Data Processed
  units: bytes/s
  family: Built-in SQL Pool
  chart_type: line
  priority: 90010
  instances:
    group: azure_synapse
    chart_prefix: synapse_builtin_sql_pool_data_processed
    family: Built-in SQL Pool
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: processed
    signal: synapse_builtin_sql_pool_data_processed_processed
- id: azure_monitor.synapse.builtin_sql_pool_login_attempts
