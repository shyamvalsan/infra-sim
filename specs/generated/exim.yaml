version: 1
name: exim
description: Exim metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Exim node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  exim_qemails_emails:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: exim.qemails
  title: Exim Queue Emails
  units: emails
  family: qemails
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: emails
    signal: exim_qemails_emails
