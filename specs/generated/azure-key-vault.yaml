version: 1
name: azure-key-vault
description: Azure Key Vault metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Azure Key Vault node reports. Signals are independent and
  plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_key_vault_key_vault_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_key_vault_key_vault_api_latency_average:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_key_vault_key_vault_saturation_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_key_vault_key_vault_api_activity_hits:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_key_vault_key_vault_api_activity_results:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: azure_monitor.key_vault.availability
  title: Azure Key Vault Availability
  units: percentage
  family: key
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_key_vault_key_vault_availability_average
- id: azure_monitor.key_vault.api_latency
  title: Azure Key Vault API Latency
  units: milliseconds
  family: key
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_key_vault_key_vault_api_latency_average
- id: azure_monitor.key_vault.saturation
  title: Azure Key Vault Saturation
  units: percentage
  family: key
  chart_type: line
  priority: 60003
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_key_vault_key_vault_saturation_average
- id: azure_monitor.key_vault.api_activity
  title: Azure Key Vault API Activity
  units: operations/s
  family: key
  chart_type: line
  priority: 60004
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: hits
    rate_signal: azure_key_vault_key_vault_api_activity_hits
  - id: results
    rate_signal: azure_key_vault_key_vault_api_activity_results
