version: 1
name: azure-key-vault
description: 'Azure Key Vault as reported through Netdata''s azure_monitor collector, generated from its
  service profile (Microsoft.KeyVault/vaults) so the contexts, units, families and dimension names match
  a real deployment. Charts are per-resource instances, as the collector emits them: resources are labels
  on one node, never separate nodes. Signals move independently rather than being causally coupled - see
  scripts/sync-profile-collectors.py.'
signals:
  key_vault_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  key_vault_api_latency_average:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  key_vault_saturation_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  key_vault_api_activity_hits:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  key_vault_api_activity_results:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.key_vault.availability
  title: Azure Key Vault Availability
  units: percentage
  family: Availability
  chart_type: line
  priority: 90010
  instances:
    group: azure_key_vault
    chart_prefix: key_vault_availability
    family: Availability
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: key_vault_availability_average
- id: azure_monitor.key_vault.api_latency
  title: Azure Key Vault API Latency
  units: milliseconds
  family: Performance
  chart_type: line
  priority: 90020
  instances:
    group: azure_key_vault
    chart_prefix: key_vault_api_latency
    family: Performance
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: key_vault_api_latency_average
- id: azure_monitor.key_vault.saturation
  title: Azure Key Vault Saturation
  units: percentage
  family: Capacity
  chart_type: line
  priority: 90030
  instances:
    group: azure_key_vault
    chart_prefix: key_vault_saturation
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: key_vault_saturation_average
- id: azure_monitor.key_vault.api_activity
  title: Azure Key Vault API Activity
  units: operations/s
  family: Operations
  chart_type: line
  priority: 90040
  instances:
    group: azure_key_vault
    chart_prefix: key_vault_api_activity
    family: Operations
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: hits
    signal: key_vault_api_activity_hits
  - id: results
    signal: key_vault_api_activity_results
