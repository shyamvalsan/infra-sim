version: 1
name: aws-billing-linked-account-service
description: 'AWS Billing Estimated Charges by Linked Account and Service as reported through Netdata''s
  cloudwatch collector, generated from its service profile (AWS/Billing) so the contexts, units, families
  and dimension names match a real deployment. Charts are per-resource instances, as the collector emits
  them: resources are labels on one node, never separate nodes. Signals move independently rather than
  being causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  billing_linked_account_service_estimated_charges_estimated_charges:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: cloudwatch.billing_linked_account_service.estimated_charges
  title: Latest AWS Estimated Charges by Account/Service (Worldwide MTD)
  units: USD
  family: AWS Billing Estimated Charges by Linked Account and Service
  chart_type: line
  priority: 90010
  instances:
    group: aws_billing_linked_account_service
    chart_prefix: billing_linked_account_service_estimated_charges
    family: AWS Billing Estimated Charges by Linked Account and Service
    labels:
      linked_account_id: '{instance}'
  shape: independent
  dimensions:
  - id: estimated_charges
    signal: billing_linked_account_service_estimated_charges_estimated_charges
