version: 1
name: azure-api-management
description: 'Azure API Management as reported through Netdata''s azure_monitor collector, generated from
  its service profile (Microsoft.ApiManagement/service) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
signals:
  api_management_capacity_capacity:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  api_management_gateway_cpu_cpu:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  api_management_gateway_memory_memory:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  api_management_requests_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_request_duration_overall:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_request_duration_backend:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_total:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_successful:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_failed:
    base: 0.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_dropped:
    base: 0.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_rejected:
    base: 0.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_throttled:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_events_timed_out:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_eventhub_bytes_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_websocket_connections_connection_attempts:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_websocket_messages_messages:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  api_management_network_connectivity_connectivity:
    base: 1.0
    min: 0.0
    max: 1.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.api_management.capacity
  title: Azure API Management Capacity Utilization
  units: percentage
  family: Capacity
  chart_type: line
  priority: 90010
  instances:
    group: azure_api_management
    chart_prefix: api_management_capacity
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: capacity
    signal: api_management_capacity_capacity
- id: azure_monitor.api_management.gateway_cpu
  title: Azure API Management Gateway CPU
  units: percentage
  family: Capacity
  chart_type: line
  priority: 90020
  instances:
    group: azure_api_management
    chart_prefix: api_management_gateway_cpu
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: cpu
    signal: api_management_gateway_cpu_cpu
- id: azure_monitor.api_management.gateway_memory
  title: Azure API Management Gateway Memory
  units: percentage
  family: Capacity
  chart_type: line
  priority: 90030
  instances:
    group: azure_api_management
    chart_prefix: api_management_gateway_memory
    family: Capacity
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: memory
    signal: api_management_gateway_memory_memory
- id: azure_monitor.api_management.requests
  title: Azure API Management Gateway Requests
  units: requests/s
  family: Requests
  chart_type: line
  priority: 90040
  instances:
    group: azure_api_management
    chart_prefix: api_management_requests
    family: Requests
    labels:
