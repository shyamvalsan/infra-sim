- id: azure_monitor.api_management.request_duration
  title: Azure API Management Request Duration
  units: milliseconds
  family: Requests
  chart_type: line
  priority: 90050
  instances:
    group: azure_api_management
    chart_prefix: api_management_request_duration
    family: Requests
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: overall
    signal: api_management_request_duration_overall
  - id: backend
    signal: api_management_request_duration_backend
- id: azure_monitor.api_management.eventhub_events
  title: Azure API Management EventHub Events
  units: events/s
  family: EventHub
  chart_type: line
  priority: 90060
  instances:
    group: azure_api_management
    chart_prefix: api_management_eventhub_events
    family: EventHub
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: api_management_eventhub_events_total
  - id: successful
    signal: api_management_eventhub_events_successful
  - id: failed
    signal: api_management_eventhub_events_failed
  - id: dropped
    signal: api_management_eventhub_events_dropped
  - id: rejected
    signal: api_management_eventhub_events_rejected
  - id: throttled
    signal: api_management_eventhub_events_throttled
  - id: timed_out
    signal: api_management_eventhub_events_timed_out
- id: azure_monitor.api_management.eventhub_bytes
  title: Azure API Management EventHub Bytes Sent
  units: bytes/s
  family: EventHub
  chart_type: line
  priority: 90070
  instances:
