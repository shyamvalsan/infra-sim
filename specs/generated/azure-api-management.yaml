- id: azure_monitor.api_management.websocket_messages
  title: Azure API Management WebSocket Messages
  units: messages/s
  family: WebSocket
  chart_type: line
  priority: 90090
  instances:
    group: azure_api_management
    chart_prefix: api_management_websocket_messages
    family: WebSocket
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: messages
