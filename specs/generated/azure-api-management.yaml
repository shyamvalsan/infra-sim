version: 1
name: azure-api-management
description: Azure API Management metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Azure API Management node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
