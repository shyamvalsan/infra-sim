version: 1
name: aws-elasticache
description: 'Amazon ElastiCache as reported through Netdata''s cloudwatch collector, generated from its
  service profile (AWS/ElastiCache) so the contexts, units, families and dimension names match a real
  deployment. Charts are per-resource instances, as the collector emits them: resources are labels on
  one node, never separate nodes. Signals move independently rather than being causally coupled - see
  scripts/sync-profile-collectors.py.'
signals:
  elasticache_cpu_host:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_cpu_engine:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_memory_freeable:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_memory_used_for_cache:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_memory_usage_used:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_connections_current:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_new_connections_new:
    base: 45.0
    min: 0.0
    max: 500000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_hitrate_hits:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_hitrate_misses:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_evictions_evictions:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_network_in:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  elasticache_network_out:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: cloudwatch.elasticache.cpu
  title: ElastiCache CPU Utilization
  units: percentage
  family: CPU
  chart_type: line
  priority: 90010
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_cpu
    family: CPU
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: host
    signal: elasticache_cpu_host
  - id: engine
    signal: elasticache_cpu_engine
- id: cloudwatch.elasticache.memory
  title: ElastiCache Memory
  units: bytes
  family: Memory
  chart_type: line
  priority: 90020
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_memory
    family: Memory
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: freeable
    signal: elasticache_memory_freeable
  - id: used_for_cache
    signal: elasticache_memory_used_for_cache
- id: cloudwatch.elasticache.memory_usage
  title: ElastiCache Database Memory Usage
  units: percentage
  family: Memory
  chart_type: line
  priority: 90030
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_memory_usage
    family: Memory
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: used
    signal: elasticache_memory_usage_used
- id: cloudwatch.elasticache.connections
  title: ElastiCache Current Connections
  units: connections
  family: Connections
  chart_type: line
  priority: 90040
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_connections
    family: Connections
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: current
    signal: elasticache_connections_current
- id: cloudwatch.elasticache.new_connections
  title: ElastiCache New Connections
  units: connections/s
  family: Connections
  chart_type: line
  priority: 90050
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_new_connections
    family: Connections
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: new
    signal: elasticache_new_connections_new
- id: cloudwatch.elasticache.hitrate
  title: ElastiCache Cache Hits and Misses
  units: events/s
  family: Keyspace
  chart_type: line
  priority: 90060
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_hitrate
    family: Keyspace
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: hits
    signal: elasticache_hitrate_hits
  - id: misses
    signal: elasticache_hitrate_misses
- id: cloudwatch.elasticache.evictions
  title: ElastiCache Evictions
  units: keys/s
  family: Keyspace
  chart_type: line
  priority: 90070
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_evictions
    family: Keyspace
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: evictions
    signal: elasticache_evictions_evictions
- id: cloudwatch.elasticache.network
  title: ElastiCache Network Traffic
  units: bytes/s
  family: Network
  chart_type: line
  priority: 90080
  instances:
    group: aws_elasticache
    chart_prefix: elasticache_network
    family: Network
    labels:
      cache_cluster_id: '{instance}'
  shape: independent
  dimensions:
  - id: in
    signal: elasticache_network_in
  - id: out
    signal: elasticache_network_out
