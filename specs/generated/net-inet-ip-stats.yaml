contexts:
- id: ipv4.packets
  title: IPv4 Packets
  units: packets/s
  family: packets
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: received
    rate_signal: net_inet_ip_stats_packets_received
  - id: sent
    rate_signal: net_inet_ip_stats_packets_sent
  - id: forwarded
    rate_signal: net_inet_ip_stats_packets_forwarded
  - id: delivered
    rate_signal: net_inet_ip_stats_packets_delivered
- id: ipv4.fragsout
  title: IPv4 Fragments Sent
  units: packets/s
  family: fragsout
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: ok
    rate_signal: net_inet_ip_stats_fragsout_ok
  - id: failed
    rate_signal: net_inet_ip_stats_fragsout_failed
  - id: created
    rate_signal: net_inet_ip_stats_fragsout_created
- id: ipv4.fragsin
  title: IPv4 Fragments Reassembly
  units: packets/s
  family: fragsin
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: ok
    rate_signal: net_inet_ip_stats_fragsin_ok
  - id: failed
    rate_signal: net_inet_ip_stats_fragsin_failed
  - id: all
    rate_signal: net_inet_ip_stats_fragsin_all
- id: ipv4.errors
  title: IPv4 Errors
  units: packets/s
  family: errors
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: InDiscards
    rate_signal: net_inet_ip_stats_errors_indiscards
  - id: OutDiscards
    rate_signal: net_inet_ip_stats_errors_outdiscards
  - id: InHdrErrors
    rate_signal: net_inet_ip_stats_errors_inhdrerrors
  - id: OutNoRoutes
    rate_signal: net_inet_ip_stats_errors_outnoroutes
  - id: InAddrErrors
    rate_signal: net_inet_ip_stats_errors_inaddrerrors
  - id: InUnknownProtos
    rate_signal: net_inet_ip_stats_errors_inunknownprotos
