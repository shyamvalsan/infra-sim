version: 1
name: net-inet-ip-stats
description: net.inet.ip.stats metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real net.inet.ip.stats node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  net_inet_ip_stats_packets_received:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  net_inet_ip_stats_packets_sent:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
