version: 1
name: net-inet-tcp-states
description: net.inet.tcp.states metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real net.inet.tcp.states node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  net_inet_tcp_states_tcpsock_connections:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: ipv4.tcpsock
  title: IPv4 TCP Connections
  units: active connections
  family: tcpsock
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: connections
    signal: net_inet_tcp_states_tcpsock_connections
