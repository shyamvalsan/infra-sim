version: 1
name: snmp-trap-listener
description: SNMP trap listener metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real SNMP trap listener node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
