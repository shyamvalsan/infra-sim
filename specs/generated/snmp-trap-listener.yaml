contexts:
- id: snmp.trap.pipeline
  title: SNMP trap receiver pipeline progress by job
  units: events/s
  family: trap.pipeline
  chart_type: line
  priority: 60001
  shape: counters
  labels:
    job_name: sim-job_name-1
  dimensions:
