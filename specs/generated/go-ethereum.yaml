    rate_signal: go_ethereum_eth_db_chaindata_ancient_io_rate_reads
  - id: writes
    rate_signal: go_ethereum_eth_db_chaindata_ancient_io_rate_writes
- id: geth.eth_db_chaindata_ancient_io
