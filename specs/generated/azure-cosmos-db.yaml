contexts:
- id: azure_monitor.cosmos_db.total_requests
  title: Azure Cosmos DB Total Requests
  units: requests/s
  family: Throughput
  chart_type: line
  priority: 90010
  instances:
    group: azure_cosmos_db
    chart_prefix: cosmos_db_total_requests
    family: Throughput
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: count
    signal: cosmos_db_total_requests_count
- id: azure_monitor.cosmos_db.request_units
  title: Azure Cosmos DB Request Units Consumed
