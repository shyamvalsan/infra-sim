version: 1
name: azure-cosmos-db
description: 'Azure Cosmos DB Account as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.DocumentDB/databaseAccounts) so the contexts, units, families and
  dimension names match a real deployment. Charts are per-resource instances, as the collector emits them:
  resources are labels on one node, never separate nodes. Signals move independently rather than being
  causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  cosmos_db_total_requests_count:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  cosmos_db_request_units_total:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  cosmos_db_normalized_ru_consumption_maximum:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  cosmos_db_server_side_latency_direct:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
