version: 1
name: am2320
description: AM2320 metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real AM2320 node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  am2320_temperature_temperature:
    base: 41.0
    min: 0.0
    max: 120.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  am2320_humidity_humidity:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: am2320.temperature
  title: Temperature
  units: celsius
  family: temperature
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: temperature
    signal: am2320_temperature_temperature
- id: am2320.humidity
  title: Relative Humidity
  units: percentage
  family: humidity
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: humidity
    signal: am2320_humidity_humidity
