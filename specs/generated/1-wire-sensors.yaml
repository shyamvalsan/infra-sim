version: 1
name: 1-wire-sensors
description: 1-Wire Sensors metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real 1-Wire Sensors node reports. Signals are independent and
  plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  1_wire_sensors_temperature_temperature:
    base: 41.0
    min: 0.0
    max: 120.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: w1sensor.temperature
  title: 1-Wire Temperature Sensor
  units: Celsius
  family: temperature
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: temperature
    signal: 1_wire_sensors_temperature_temperature
