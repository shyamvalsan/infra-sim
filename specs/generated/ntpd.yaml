version: 1
name: ntpd
description: NTPd metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real NTPd node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  ntpd_sys_offset_offset:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ntpd_sys_jitter_system:
    base: 24.0
    min: 0.0
    max: 600000.0
