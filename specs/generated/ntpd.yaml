contexts:
- id: ntpd.sys_offset
  title: Combined offset of server relative to this host
  units: milliseconds
  family: sys
  chart_type: area
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: offset
    signal: ntpd_sys_offset_offset
- id: ntpd.sys_jitter
  title: Combined system jitter and clock jitter
  units: milliseconds
  family: sys
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: system
    signal: ntpd_sys_jitter_system
  - id: clock
    signal: ntpd_sys_jitter_clock
- id: ntpd.sys_frequency
  title: Frequency offset relative to hardware clock
  units: ppm
  family: sys
  chart_type: area
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: frequency
    signal: ntpd_sys_frequency_frequency
- id: ntpd.sys_wander
  title: Clock frequency wander
  units: ppm
  family: sys
  chart_type: area
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: clock
    signal: ntpd_sys_wander_clock
- id: ntpd.sys_rootdelay
  title: Total roundtrip delay to the primary reference clock
  units: milliseconds
  family: sys
  chart_type: area
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: delay
    signal: ntpd_sys_rootdelay_delay
- id: ntpd.sys_rootdisp
  title: Total root dispersion to the primary reference clock
  units: milliseconds
  family: sys
  chart_type: area
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: dispersion
    signal: ntpd_sys_rootdisp_dispersion
- id: ntpd.sys_stratum
  title: Stratum
  units: stratum
  family: sys
  chart_type: line
  priority: 60007
  shape: independent
  labels: {}
  dimensions:
  - id: stratum
    signal: ntpd_sys_stratum_stratum
- id: ntpd.sys_tc
  title: Time constant and poll exponent
  units: log2
  family: sys
  chart_type: line
  priority: 60008
  shape: independent
  labels: {}
  dimensions:
  - id: current
    signal: ntpd_sys_tc_current
  - id: minimum
    signal: ntpd_sys_tc_minimum
- id: ntpd.sys_precision
  title: Precision
  units: log2
  family: sys
  chart_type: line
  priority: 60009
  shape: independent
  labels: {}
  dimensions:
  - id: precision
    signal: ntpd_sys_precision_precision
- id: ntpd.peer_offset
  title: Peer offset
  units: milliseconds
  family: peer
  chart_type: line
  priority: 60010
  shape: independent
  labels:
    peer_address: sim-peer_address-1
