contexts:
- id: ipv4.tcppackets
  title: IPv4 TCP Packets
  units: packets/s
  family: tcppackets
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: received
    rate_signal: net_inet_tcp_stats_tcppackets_received
  - id: sent
    rate_signal: net_inet_tcp_stats_tcppackets_sent
- id: ipv4.tcperrors
  title: IPv4 TCP Errors
