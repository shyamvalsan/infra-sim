contexts:
- id: powersupply.capacity
  title: Battery capacity
  units: percentage
  family: capacity
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    device: sim-device-1
  dimensions:
  - id: capacity
    signal: power_supply_capacity_capacity
- id: powersupply.power
  title: Battery discharge rate
  units: W
  family: power
  chart_type: line
  priority: 60002
