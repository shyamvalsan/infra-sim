version: 1
name: power-supply
description: Power Supply metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Power Supply node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  power_supply_capacity_capacity:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  power_supply_power_power:
    base: 120.0
    min: 0.0
    max: 1000000.0
