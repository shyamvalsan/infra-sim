contexts:
- id: nginxvts.requests_total
  title: Total requests
  units: requests/s
  family: requests
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: nginx_vts_requests_total_requests
- id: nginxvts.active_connections
  title: Active connections
  units: connections
  family: active
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: nginx_vts_active_connections_active
- id: nginxvts.connections_total
  title: Total connections
  units: connections/s
  family: connections
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: reading
    rate_signal: nginx_vts_connections_total_reading
  - id: writing
    rate_signal: nginx_vts_connections_total_writing
  - id: waiting
    rate_signal: nginx_vts_connections_total_waiting
  - id: accepted
    rate_signal: nginx_vts_connections_total_accepted
  - id: handled
    rate_signal: nginx_vts_connections_total_handled
- id: nginxvts.uptime
  title: Uptime
  units: seconds
  family: uptime
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: uptime
    signal: nginx_vts_uptime_uptime
- id: nginxvts.shm_usage
  title: Shared memory size
  units: bytes
  family: shm
  chart_type: line
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: max
    signal: nginx_vts_shm_usage_max
  - id: used
    signal: nginx_vts_shm_usage_used
- id: nginxvts.shm_used_node
  title: Number of node using shared memory
  units: nodes
  family: shm
  chart_type: line
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: nginx_vts_shm_used_node_used
- id: nginxvts.server_requests_total
  title: Total number of client requests
  units: requests/s
  family: server
  chart_type: line
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: nginx_vts_server_requests_total_requests
- id: nginxvts.server_responses_total
  title: Total number of responses by code class
  units: responses/s
  family: server
  chart_type: line
  priority: 60008
  shape: counters
  labels: {}
  dimensions:
  - id: 1xx
    rate_signal: nginx_vts_server_responses_total_1xx
  - id: 2xx
    rate_signal: nginx_vts_server_responses_total_2xx
  - id: 3xx
    rate_signal: nginx_vts_server_responses_total_3xx
  - id: 4xx
    rate_signal: nginx_vts_server_responses_total_4xx
  - id: 5xx
    rate_signal: nginx_vts_server_responses_total_5xx
- id: nginxvts.server_traffic_total
  title: Total amount of data transferred to and from the server
  units: bytes/s
  family: server
  chart_type: line
  priority: 60009
  shape: counters
  labels: {}
  dimensions:
  - id: in
    rate_signal: nginx_vts_server_traffic_total_in
  - id: out
    rate_signal: nginx_vts_server_traffic_total_out
- id: nginxvts.server_cache_total
  title: Total server cache
  units: events/s
  family: server
  chart_type: line
  priority: 60010
  shape: counters
  labels: {}
  dimensions:
  - id: miss
    rate_signal: nginx_vts_server_cache_total_miss
  - id: bypass
    rate_signal: nginx_vts_server_cache_total_bypass
  - id: expired
    rate_signal: nginx_vts_server_cache_total_expired
  - id: stale
    rate_signal: nginx_vts_server_cache_total_stale
  - id: updating
    rate_signal: nginx_vts_server_cache_total_updating
  - id: revalidated
    rate_signal: nginx_vts_server_cache_total_revalidated
  - id: hit
    rate_signal: nginx_vts_server_cache_total_hit
  - id: scarce
    rate_signal: nginx_vts_server_cache_total_scarce
