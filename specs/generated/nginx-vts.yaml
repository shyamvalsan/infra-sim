version: 1
name: nginx-vts
description: NGINX VTS metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real NGINX VTS node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  nginx_vts_requests_total_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  nginx_vts_active_connections_active:
    base: 180.0
    min: 0.0
    max: 200000.0
