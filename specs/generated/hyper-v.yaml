contexts:
- id: hyperv.vms_health
  title: Virtual machines health status
  units: vms
  family: vms
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: ok
    signal: hyper_v_vms_health_ok
  - id: critical
    signal: hyper_v_vms_health_critical
- id: hyperv.root_partition_io_tlb_flush
  title: Root partition flushes of I/O TLBs
  units: flushes/s
  family: root
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: gpa
    rate_signal: hyper_v_root_partition_io_tlb_flush_gpa
- id: hyperv.root_partition_virtual_tlb_flush_entries
  title: Root partition flushes of the entire virtual TLB
  units: flushes/s
  family: root
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: flushes
    rate_signal: hyper_v_root_partition_virtual_tlb_flush_entries_flushes
- id: hyperv.root_partition_virtual_tlb_pages
  title: Root partition pages used by the virtual TLB
  units: pages
  family: root
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: hyper_v_root_partition_virtual_tlb_pages_used
- id: hyperv.root_partition_address_space
  title: Root partition address spaces in the virtual TLB
