version: 1
name: openvpn-status-log
description: OpenVPN status log metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real OpenVPN status log node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  openvpn_status_log_active_clients_clients:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openvpn_status_log_total_traffic_in:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openvpn_status_log_total_traffic_out:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openvpn_status_log_user_traffic_in:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openvpn_status_log_user_traffic_out:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openvpn_status_log_user_connection_time_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: openvpn.active_clients
  title: Total Number Of Active Clients
  units: clients
  family: active
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: clients
    signal: openvpn_status_log_active_clients_clients
- id: openvpn.total_traffic
  title: Total Traffic
  units: kilobits/s
  family: total
  chart_type: area
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: in
    rate_signal: openvpn_status_log_total_traffic_in
  - id: out
    rate_signal: openvpn_status_log_total_traffic_out
- id: openvpn.user_traffic
  title: User Traffic
  units: kilobits/s
  family: user
  chart_type: area
  priority: 60003
  shape: counters
  labels:
    username: sim-username-1
  dimensions:
  - id: in
    rate_signal: openvpn_status_log_user_traffic_in
  - id: out
    rate_signal: openvpn_status_log_user_traffic_out
- id: openvpn.user_connection_time
  title: User Connection Time
  units: seconds
  family: user
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    username: sim-username-1
  dimensions:
  - id: time
    signal: openvpn_status_log_user_connection_time_time
