version: 1
name: lvm-logical-volumes
description: LVM logical volumes metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real LVM logical volumes node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  lvm_logical_volumes_lv_data_space_utilization_utilization:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  lvm_logical_volumes_lv_metadata_space_utilization_utilization:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: lvm.lv_data_space_utilization
  title: Logical volume space allocated for data
  units: '%'
  family: lv
  chart_type: area
  priority: 60001
  shape: independent
  labels:
    lv_name: sim-lv_name-1
    vg_name: sim-vg_name-1
    volume_type: sim-volume_type-1
  dimensions:
  - id: utilization
    signal: lvm_logical_volumes_lv_data_space_utilization_utilization
- id: lvm.lv_metadata_space_utilization
  title: Logical volume space allocated for metadata
  units: '%'
  family: lv
  chart_type: area
  priority: 60002
  shape: independent
  labels:
    lv_name: sim-lv_name-1
    vg_name: sim-vg_name-1
    volume_type: sim-volume_type-1
  dimensions:
  - id: utilization
    signal: lvm_logical_volumes_lv_metadata_space_utilization_utilization
