version: 1
name: azure-stream-analytics
description: 'Azure Stream Analytics Job as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.StreamAnalytics/streamingjobs) so the contexts, units, families
  and dimension names match a real deployment. Charts are per-resource instances, as the collector emits
  them: resources are labels on one node, never separate nodes. Signals move independently rather than
  being causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  stream_analytics_event_flow_in:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_event_flow_out:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_input_data_throughput_received:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_input_sources_received_received:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_event_timing_late:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_event_timing_early:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_event_timing_out_of_order:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_backlogged_events_backlogged:
    base: 90.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_watermark_delay_delay:
    base: 0.9
    min: 0.0
    max: 86400.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_errors_runtime:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_errors_data_conversion:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_errors_deserialization:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_function_requests_total:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_function_requests_failed:
    base: 0.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_function_events_input:
    base: 260.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_resource_utilization_cpu:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  stream_analytics_resource_utilization_su_memory:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.stream_analytics.event_flow
  title: Azure Stream Analytics Event Flow
  units: events/s
  family: Events
  chart_type: line
  priority: 90010
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_event_flow
    family: Events
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: in
    signal: stream_analytics_event_flow_in
  - id: out
    signal: stream_analytics_event_flow_out
- id: azure_monitor.stream_analytics.input_data_throughput
  title: Azure Stream Analytics Input Data Throughput
  units: bytes/s
  family: Events
  chart_type: line
  priority: 90020
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_input_data_throughput
    family: Events
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: received
    signal: stream_analytics_input_data_throughput_received
- id: azure_monitor.stream_analytics.input_sources_received
  title: Azure Stream Analytics Input Sources Received
  units: sources/s
  family: Events
  chart_type: line
  priority: 90030
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_input_sources_received
    family: Events
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: received
    signal: stream_analytics_input_sources_received_received
- id: azure_monitor.stream_analytics.event_timing
  title: Azure Stream Analytics Event Timing Issues
  units: events/s
  family: Events
  chart_type: line
  priority: 90040
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_event_timing
    family: Events
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: late
    signal: stream_analytics_event_timing_late
  - id: early
    signal: stream_analytics_event_timing_early
  - id: out_of_order
    signal: stream_analytics_event_timing_out_of_order
- id: azure_monitor.stream_analytics.backlogged_events
  title: Azure Stream Analytics Backlogged Events
  units: events
  family: Backlog
  chart_type: line
  priority: 90050
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_backlogged_events
    family: Backlog
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: backlogged
    signal: stream_analytics_backlogged_events_backlogged
- id: azure_monitor.stream_analytics.watermark_delay
  title: Azure Stream Analytics Watermark Delay
  units: seconds
  family: Watermark
  chart_type: line
  priority: 90060
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_watermark_delay
    family: Watermark
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: delay
    signal: stream_analytics_watermark_delay_delay
- id: azure_monitor.stream_analytics.errors
  title: Azure Stream Analytics Errors
  units: errors/s
  family: Errors
  chart_type: line
  priority: 90070
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_errors
    family: Errors
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: runtime
    signal: stream_analytics_errors_runtime
  - id: data_conversion
    signal: stream_analytics_errors_data_conversion
  - id: deserialization
    signal: stream_analytics_errors_deserialization
- id: azure_monitor.stream_analytics.function_requests
  title: Azure Stream Analytics Function Requests
  units: requests/s
  family: Functions
  chart_type: line
  priority: 90080
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_function_requests
    family: Functions
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: stream_analytics_function_requests_total
  - id: failed
    signal: stream_analytics_function_requests_failed
- id: azure_monitor.stream_analytics.function_events
  title: Azure Stream Analytics Function Events
  units: events/s
  family: Functions
  chart_type: line
  priority: 90090
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_function_events
    family: Functions
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: input
    signal: stream_analytics_function_events_input
- id: azure_monitor.stream_analytics.resource_utilization
  title: Azure Stream Analytics Resource Utilization
  units: percentage
  family: Resources
  chart_type: line
  priority: 90100
  instances:
    group: azure_stream_analytics
    chart_prefix: stream_analytics_resource_utilization
    family: Resources
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: cpu
    signal: stream_analytics_resource_utilization_cpu
  - id: su_memory
    signal: stream_analytics_resource_utilization_su_memory
