version: 1
name: ipv6-socket-statistics
description: IPv6 Socket Statistics metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real IPv6 Socket Statistics node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  ipv6_socket_statistics_sockstat6_tcp_sockets_inuse:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ipv6_socket_statistics_sockstat6_udp_sockets_inuse:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ipv6_socket_statistics_sockstat6_udplite_sockets_inuse:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ipv6_socket_statistics_sockstat6_raw_sockets_inuse:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ipv6_socket_statistics_sockstat6_frag_sockets_inuse:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: ipv6.sockstat6_tcp_sockets
  title: IPv6 TCP Sockets
  units: sockets
  family: sockstat6
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: inuse
    signal: ipv6_socket_statistics_sockstat6_tcp_sockets_inuse
- id: ipv6.sockstat6_udp_sockets
  title: IPv6 UDP Sockets
  units: sockets
  family: sockstat6
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: inuse
    signal: ipv6_socket_statistics_sockstat6_udp_sockets_inuse
- id: ipv6.sockstat6_udplite_sockets
  title: IPv6 UDPLITE Sockets
  units: sockets
  family: sockstat6
  chart_type: line
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: inuse
    signal: ipv6_socket_statistics_sockstat6_udplite_sockets_inuse
- id: ipv6.sockstat6_raw_sockets
  title: IPv6 RAW Sockets
  units: sockets
  family: sockstat6
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: inuse
    signal: ipv6_socket_statistics_sockstat6_raw_sockets_inuse
- id: ipv6.sockstat6_frag_sockets
  title: IPv6 FRAG Sockets
  units: fragments
  family: sockstat6
  chart_type: line
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: inuse
    signal: ipv6_socket_statistics_sockstat6_frag_sockets_inuse
