version: 1
name: tcp-udp-endpoints
description: TCP/UDP Endpoints metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real TCP/UDP Endpoints node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  tcp_udp_endpoints_status_success:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  tcp_udp_endpoints_status_failed:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  tcp_udp_endpoints_status_timeout:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  tcp_udp_endpoints_state_duration_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  tcp_udp_endpoints_latency_time:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  tcp_udp_endpoints_udp_port_status_open_filtered:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  tcp_udp_endpoints_udp_port_status_closed:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  tcp_udp_endpoints_udp_port_status_duration_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: portcheck.status
  title: TCP Check Status
  units: boolean
  family: status
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    host: sim-host-1
    port: sim-port-1
  dimensions:
  - id: success
    signal: tcp_udp_endpoints_status_success
  - id: failed
    signal: tcp_udp_endpoints_status_failed
  - id: timeout
    signal: tcp_udp_endpoints_status_timeout
- id: portcheck.state_duration
  title: Current State Duration
  units: seconds
  family: state
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    host: sim-host-1
    port: sim-port-1
  dimensions:
  - id: time
    signal: tcp_udp_endpoints_state_duration_time
- id: portcheck.latency
  title: TCP Connection Latency
  units: ms
  family: latency
  chart_type: line
  priority: 60003
  shape: independent
  labels:
    host: sim-host-1
    port: sim-port-1
  dimensions:
  - id: time
    signal: tcp_udp_endpoints_latency_time
- id: portcheck.udp_port_status
  title: UDP Port Check Status
  units: status
  family: udp
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    host: sim-host-1
    port: sim-port-1
  dimensions:
  - id: open/filtered
    signal: tcp_udp_endpoints_udp_port_status_open_filtered
  - id: closed
    signal: tcp_udp_endpoints_udp_port_status_closed
- id: portcheck.udp_port_status_duration
  title: UDP Port Current Status Duration
  units: seconds
  family: udp
  chart_type: line
  priority: 60005
  shape: independent
  labels:
    host: sim-host-1
    port: sim-port-1
  dimensions:
  - id: time
    signal: tcp_udp_endpoints_udp_port_status_duration_time
