contexts:
- id: docker.containers_state
  title: Total number of Docker containers in various states
  units: containers
  family: containers
  chart_type: stacked
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: running
    signal: docker_containers_state_running
  - id: paused
    signal: docker_containers_state_paused
  - id: stopped
    signal: docker_containers_state_stopped
- id: docker.containers_health_status
  title: Total number of Docker containers in various health states
  units: containers
  family: containers
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: healthy
    signal: docker_containers_health_status_healthy
  - id: unhealthy
    signal: docker_containers_health_status_unhealthy
  - id: not_running_unhealthy
    signal: docker_containers_health_status_not_running_unhealthy
  - id: starting
    signal: docker_containers_health_status_starting
  - id: no_healthcheck
    signal: docker_containers_health_status_no_healthcheck
- id: docker.images
  title: Total number of Docker images in various states
  units: images
  family: images
  chart_type: stacked
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: docker_images_active
  - id: dangling
    signal: docker_images_dangling
- id: docker.images_size
  title: Total size of all Docker images
  units: bytes
  family: images
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: size
    signal: docker_images_size_size
- id: docker.container_state
  title: Docker container state
  units: state
  family: container
  chart_type: line
  priority: 60005
  shape: independent
  labels:
    container_name: sim-container_name-1
    image: sim-image-1
  dimensions:
  - id: running
    signal: docker_container_state_running
  - id: paused
    signal: docker_container_state_paused
  - id: exited
    signal: docker_container_state_exited
  - id: created
    signal: docker_container_state_created
  - id: restarting
    signal: docker_container_state_restarting
  - id: removing
    signal: docker_container_state_removing
  - id: dead
    signal: docker_container_state_dead
- id: docker.container_health_status
  title: Docker container health status
  units: status
  family: container
  chart_type: line
  priority: 60006
  shape: independent
  labels:
    container_name: sim-container_name-1
    image: sim-image-1
  dimensions:
  - id: healthy
    signal: docker_container_health_status_healthy
  - id: unhealthy
    signal: docker_container_health_status_unhealthy
  - id: not_running_unhealthy
    signal: docker_container_health_status_not_running_unhealthy
  - id: starting
    signal: docker_container_health_status_starting
  - id: no_healthcheck
    signal: docker_container_health_status_no_healthcheck
- id: docker.container_writeable_layer_size
  title: Docker container writable layer size
  units: size
  family: container
  chart_type: line
  priority: 60007
  shape: independent
  labels:
    container_name: sim-container_name-1
    image: sim-image-1
  dimensions:
  - id: writeable_layer
    signal: docker_container_writeable_layer_size_writeable_layer
