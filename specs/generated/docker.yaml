version: 1
name: docker
description: Docker metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Docker node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  docker_containers_state_running:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  docker_containers_state_paused:
    base: 120.0
    min: 0.0
    max: 1000000.0
