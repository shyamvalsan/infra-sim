contexts:
- id: boinc.tasks
  title: Overall Tasks
  units: tasks
  family: tasks
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: total
    signal: boinc_tasks_total
  - id: active
    signal: boinc_tasks_active
- id: boinc.tasks_per_state
  title: Tasks per State
  units: tasks
  family: tasks
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: new
    signal: boinc_tasks_per_state_new
  - id: downloading
    signal: boinc_tasks_per_state_downloading
  - id: downloaded
    signal: boinc_tasks_per_state_downloaded
  - id: compute_error
    signal: boinc_tasks_per_state_compute_error
  - id: uploading
    signal: boinc_tasks_per_state_uploading
  - id: uploaded
    signal: boinc_tasks_per_state_uploaded
  - id: aborted
    signal: boinc_tasks_per_state_aborted
  - id: upload_failed
    signal: boinc_tasks_per_state_upload_failed
- id: boinc.active_tasks_per_state
  title: Active Tasks per State
  units: tasks
  family: active
  chart_type: line
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: uninitialized
    signal: boinc_active_tasks_per_state_uninitialized
  - id: executing
    signal: boinc_active_tasks_per_state_executing
  - id: abort_pending
    signal: boinc_active_tasks_per_state_abort_pending
  - id: quit_pending
    signal: boinc_active_tasks_per_state_quit_pending
  - id: suspended
    signal: boinc_active_tasks_per_state_suspended
  - id: copy_pending
    signal: boinc_active_tasks_per_state_copy_pending
- id: boinc.active_tasks_per_scheduler_state
  title: Active Tasks per Scheduler State
  units: tasks
  family: active
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: uninitialized
    signal: boinc_active_tasks_per_scheduler_state_uninitialized
  - id: preempted
    signal: boinc_active_tasks_per_scheduler_state_preempted
  - id: scheduled
    signal: boinc_active_tasks_per_scheduler_state_scheduled
