      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  boinc_tasks_per_state_compute_error:
    base: 0.0
    min: 0.0
    max: 1000000.0
  boinc_tasks_per_state_uploading:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  boinc_tasks_per_state_uploaded:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  boinc_tasks_per_state_aborted:
    base: 0.0
    min: 0.0
    max: 1000000.0
  boinc_tasks_per_state_upload_failed:
    base: 0.0
    min: 0.0
    max: 1000000.0
  boinc_active_tasks_per_state_uninitialized:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  boinc_active_tasks_per_state_executing:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  boinc_active_tasks_per_state_abort_pending:
    base: 0.0
    min: 0.0
    max: 1000000.0
  boinc_active_tasks_per_state_quit_pending:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
