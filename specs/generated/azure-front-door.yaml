version: 1
name: azure-front-door
description: 'Azure Front Door as reported through Netdata''s azure_monitor collector, generated from
  its service profile (Microsoft.Cdn/profiles) so the contexts, units, families and dimension names match
  a real deployment. Charts are per-resource instances, as the collector emits them: resources are labels
  on one node, never separate nodes. Signals move independently rather than being causally coupled - see
  scripts/sync-profile-collectors.py.'
signals:
  front_door_latency_total:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_latency_origin:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_origin_health_health:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  front_door_byte_hit_ratio_hit_ratio:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  front_door_error_rate_4xx:
    base: 0.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  front_door_error_rate_5xx:
    base: 0.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  front_door_requests_client:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_requests_origin:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_data_transfer_request:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_data_transfer_response:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_origin_shield_requests_to_shield:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_origin_shield_requests_to_origin:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_origin_shield_requests_rate_limited:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_origin_shield_data_transfer_request:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_waf_requests_total:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_waf_challenges_captcha:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_waf_challenges_js_challenge:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_websocket_connections_requested:
    base: 45.0
    min: 0.0
    max: 500000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_websocket_connections_active:
    base: 45.0
    min: 0.0
    max: 500000.0
    noise:
      kind: gauss
      sigma: 0.18
  front_door_websocket_duration_average:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.front_door.latency
  title: Azure Front Door Latency
  units: milliseconds
  family: Latency
  chart_type: line
  priority: 90010
  instances:
    group: azure_front_door
    chart_prefix: front_door_latency
    family: Latency
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: front_door_latency_total
  - id: origin
    signal: front_door_latency_origin
- id: azure_monitor.front_door.origin_health
  title: Azure Front Door Origin Health
  units: percentage
  family: Origin Health
  chart_type: line
  priority: 90020
  instances:
    group: azure_front_door
    chart_prefix: front_door_origin_health
    family: Origin Health
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: health
    signal: front_door_origin_health_health
- id: azure_monitor.front_door.byte_hit_ratio
  title: Azure Front Door Byte Hit Ratio
  units: percentage
  family: Cache
  chart_type: line
  priority: 90030
  instances:
    group: azure_front_door
    chart_prefix: front_door_byte_hit_ratio
    family: Cache
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: hit_ratio
    signal: front_door_byte_hit_ratio_hit_ratio
- id: azure_monitor.front_door.error_rate
  title: Azure Front Door Error Rate
  units: percentage
  family: Errors
  chart_type: line
  priority: 90040
  instances:
    group: azure_front_door
    chart_prefix: front_door_error_rate
    family: Errors
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: 4xx
    signal: front_door_error_rate_4xx
  - id: 5xx
    signal: front_door_error_rate_5xx
- id: azure_monitor.front_door.requests
  title: Azure Front Door Requests
  units: requests/s
  family: Traffic
  chart_type: line
  priority: 90050
  instances:
    group: azure_front_door
    chart_prefix: front_door_requests
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: client
    signal: front_door_requests_client
  - id: origin
    signal: front_door_requests_origin
- id: azure_monitor.front_door.data_transfer
  title: Azure Front Door Data Transfer
  units: bytes/s
  family: Traffic
  chart_type: line
  priority: 90060
  instances:
    group: azure_front_door
    chart_prefix: front_door_data_transfer
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: request
    signal: front_door_data_transfer_request
  - id: response
    signal: front_door_data_transfer_response
- id: azure_monitor.front_door.origin_shield_requests
  title: Azure Front Door Origin Shield Requests
  units: requests/s
  family: Origin Shield
  chart_type: line
  priority: 90070
  instances:
    group: azure_front_door
    chart_prefix: front_door_origin_shield_requests
    family: Origin Shield
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: to_shield
    signal: front_door_origin_shield_requests_to_shield
  - id: to_origin
    signal: front_door_origin_shield_requests_to_origin
  - id: rate_limited
    signal: front_door_origin_shield_requests_rate_limited
- id: azure_monitor.front_door.origin_shield_data_transfer
  title: Azure Front Door Origin Shield Data Transfer
  units: bytes/s
  family: Origin Shield
  chart_type: line
  priority: 90080
  instances:
    group: azure_front_door
    chart_prefix: front_door_origin_shield_data_transfer
    family: Origin Shield
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: request
    signal: front_door_origin_shield_data_transfer_request
- id: azure_monitor.front_door.waf_requests
  title: Azure Front Door WAF Requests
  units: requests/s
  family: WAF
  chart_type: line
  priority: 90090
  instances:
    group: azure_front_door
    chart_prefix: front_door_waf_requests
    family: WAF
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: total
    signal: front_door_waf_requests_total
- id: azure_monitor.front_door.waf_challenges
  title: Azure Front Door WAF Challenges
  units: requests/s
  family: WAF
  chart_type: line
  priority: 90100
  instances:
    group: azure_front_door
    chart_prefix: front_door_waf_challenges
    family: WAF
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
