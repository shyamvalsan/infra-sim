version: 1
name: azure-front-door
description: Azure Front Door metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Azure Front Door node reports. Signals are independent and
  plausible rather than causally coupled - see scripts/sync-integrations.py.
