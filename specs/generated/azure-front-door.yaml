    signal: front_door_waf_challenges_js_challenge
- id: azure_monitor.front_door.websocket_connections
  title: Azure Front Door WebSocket Connections
  units: connections/s
  family: WebSocket
  chart_type: line
  priority: 90110
  instances:
    group: azure_front_door
    chart_prefix: front_door_websocket_connections
    family: WebSocket
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: requested
    signal: front_door_websocket_connections_requested
