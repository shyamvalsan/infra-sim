version: 1
name: snmp-devices
description: SNMP devices metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real SNMP devices node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  snmp_devices_license_remaining_time_remaining_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_authorization_remaining_time_remaining_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_certificate_remaining_time_remaining_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_grace_remaining_time_remaining_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_usage_percent_usage_percent:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_state_healthy:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_state_informational:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_state_degraded:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_state_broken:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  snmp_devices_license_state_ignored:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: snmp.license.remaining_time
  title: Earliest remaining time to expiry across monitored licenses and subscriptions on the device.
  units: seconds
  family: license.remaining
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: remaining_time
    signal: snmp_devices_license_remaining_time_remaining_time
- id: snmp.license.authorization_remaining_time
  title: Earliest remaining time for licensing authorization timers on the device.
  units: seconds
  family: license.authorization
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: remaining_time
    signal: snmp_devices_license_authorization_remaining_time_remaining_time
- id: snmp.license.certificate_remaining_time
  title: Earliest remaining time for licensing certificate timers on the device.
  units: seconds
  family: license.certificate
  chart_type: line
  priority: 60003
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: remaining_time
    signal: snmp_devices_license_certificate_remaining_time_remaining_time
- id: snmp.license.grace_remaining_time
  title: Earliest remaining time for licensing grace or evaluation timers on the device.
  units: seconds
  family: license.grace
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: remaining_time
    signal: snmp_devices_license_grace_remaining_time_remaining_time
- id: snmp.license.usage_percent
  title: Highest usage pressure across finite licensing pools on the device.
  units: percentage
  family: license.usage
  chart_type: area
  priority: 60005
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: usage_percent
    signal: snmp_devices_license_usage_percent_usage_percent
- id: snmp.license.state
  title: 'Count of licensing rows on the device by normalized state bucket: healthy, informational, degraded,
    broken, an'
  units: licenses
  family: license.state
  chart_type: stacked
  priority: 60006
  shape: independent
  labels:
    component: sim-component-1
  dimensions:
  - id: healthy
    signal: snmp_devices_license_state_healthy
  - id: informational
    signal: snmp_devices_license_state_informational
  - id: degraded
    signal: snmp_devices_license_state_degraded
  - id: broken
    signal: snmp_devices_license_state_broken
  - id: ignored
    signal: snmp_devices_license_state_ignored
