contexts:
- id: dnsdist.queries
  title: Client queries received
  units: queries/s
  family: queries
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: all
    rate_signal: dnsdist_queries_all
  - id: recursive
    rate_signal: dnsdist_queries_recursive
  - id: empty
    rate_signal: dnsdist_queries_empty
- id: dnsdist.queries_dropped
  title: Client queries dropped
  units: queries/s
  family: queries
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: rule_drop
    rate_signal: dnsdist_queries_dropped_rule_drop
  - id: dynamic_blocked
    rate_signal: dnsdist_queries_dropped_dynamic_blocked
  - id: no_policy
    rate_signal: dnsdist_queries_dropped_no_policy
  - id: non_queries
    rate_signal: dnsdist_queries_dropped_non_queries
- id: dnsdist.packets_dropped
  title: Packets dropped
  units: packets/s
  family: packets
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: acl
    rate_signal: dnsdist_packets_dropped_acl
- id: dnsdist.answers
  title: Answers statistics
  units: answers/s
  family: answers
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: self_answered
    rate_signal: dnsdist_answers_self_answered
  - id: nxdomain
    rate_signal: dnsdist_answers_nxdomain
  - id: refused
    rate_signal: dnsdist_answers_refused
  - id: trunc_failures
    rate_signal: dnsdist_answers_trunc_failures
- id: dnsdist.backend_responses
  title: Backend responses
  units: responses/s
  family: backend
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: responses
    rate_signal: dnsdist_backend_responses_responses
- id: dnsdist.backend_commerrors
  title: Backend communication errors
  units: errors/s
  family: backend
  chart_type: line
  priority: 60006
  shape: counters
  labels: {}
  dimensions:
  - id: send_errors
    rate_signal: dnsdist_backend_commerrors_send_errors
- id: dnsdist.backend_errors
  title: Backend error responses
  units: responses/s
  family: backend
  chart_type: line
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: timeouts
    rate_signal: dnsdist_backend_errors_timeouts
  - id: servfail
    rate_signal: dnsdist_backend_errors_servfail
  - id: non_compliant
    rate_signal: dnsdist_backend_errors_non_compliant
- id: dnsdist.cache
  title: Cache performance
  units: answers/s
  family: cache
  chart_type: line
  priority: 60008
  shape: counters
  labels: {}
  dimensions:
  - id: hits
    rate_signal: dnsdist_cache_hits
  - id: misses
    rate_signal: dnsdist_cache_misses
- id: dnsdist.servercpu
  title: DNSdist server CPU utilization
  units: ms/s
  family: servercpu
  chart_type: stacked
  priority: 60009
  shape: counters
  labels: {}
  dimensions:
  - id: system_state
    rate_signal: dnsdist_servercpu_system_state
  - id: user_state
    rate_signal: dnsdist_servercpu_user_state
- id: dnsdist.servermem
  title: DNSdist server memory utilization
  units: MiB
  family: servermem
  chart_type: area
  priority: 60010
  shape: independent
  labels: {}
  dimensions:
  - id: memory_usage
    signal: dnsdist_servermem_memory_usage
- id: dnsdist.query_latency
  title: Query latency
  units: queries/s
  family: query
  chart_type: stacked
  priority: 60011
  shape: counters
  labels: {}
  dimensions:
  - id: 1ms
    rate_signal: dnsdist_query_latency_1ms
  - id: 10ms
    rate_signal: dnsdist_query_latency_10ms
  - id: 50ms
    rate_signal: dnsdist_query_latency_50ms
  - id: 100ms
    rate_signal: dnsdist_query_latency_100ms
  - id: 1sec
    rate_signal: dnsdist_query_latency_1sec
  - id: slow
    rate_signal: dnsdist_query_latency_slow
- id: dnsdist.query_latency_avg
  title: Average latency for the last N queries
  units: microseconds
  family: query
  chart_type: line
  priority: 60012
  shape: independent
  labels: {}
  dimensions:
  - id: '100'
    signal: dnsdist_query_latency_avg_100
  - id: 1k
    signal: dnsdist_query_latency_avg_1k
  - id: 10k
    signal: dnsdist_query_latency_avg_10k
  - id: 1000k
    signal: dnsdist_query_latency_avg_1000k
