contexts:
- id: pihole.dns_queries_total
  title: Pi-hole DNS Queries Total (Cached, Blocked and Forwarded)
  units: queries/s
  family: dns
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: queries
    rate_signal: pi_hole_dns_queries_total_queries
- id: pihole.dns_queries_blocked_percent
  title: Pi-hole DNS Queries Blocked Percent
  units: percent
  family: dns
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
