contexts:
- id: pika.connections
  title: Connections
  units: connections
  family: connections
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: accepted
    signal: pika_connections_accepted
- id: pika.clients
  title: Clients
  units: clients
  family: clients
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: connected
    signal: pika_clients_connected
- id: pika.memory
  title: Memory usage
  units: bytes
  family: memory
  chart_type: area
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: pika_memory_used
- id: pika.connected_replicas
  title: Connected replicas
  units: replicas
  family: connected
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: connected
    signal: pika_connected_replicas_connected
- id: pika.commands
  title: Processed commands
  units: commands/s
  family: commands
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: processed
    rate_signal: pika_commands_processed
- id: pika.commands_calls
  title: Calls per command
  units: calls/s
  family: commands
  chart_type: stacked
  priority: 60006
  shape: counters
  labels: {}
  dimensions:
