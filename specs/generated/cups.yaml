version: 1
name: cups
description: CUPS metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real CUPS node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  cups_dests_state_idle:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  cups_dests_state_printing:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
