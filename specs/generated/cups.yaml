contexts:
- id: cups.dests_state
  title: Destinations by state
  units: dests
  family: dests
  chart_type: stacked
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: idle
    signal: cups_dests_state_idle
  - id: printing
    signal: cups_dests_state_printing
  - id: stopped
    signal: cups_dests_state_stopped
- id: cups.dests_option
  title: Destinations by option
  units: dests
  family: dests
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: total
    signal: cups_dests_option_total
  - id: acceptingjobs
    signal: cups_dests_option_acceptingjobs
  - id: shared
    signal: cups_dests_option_shared
- id: cups.job_num
  title: Active jobs
  units: jobs
  family: job
  chart_type: stacked
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: pending
    signal: cups_job_num_pending
  - id: held
    signal: cups_job_num_held
  - id: processing
    signal: cups_job_num_processing
- id: cups.job_size
  title: Active jobs size
  units: KB
  family: job
  chart_type: stacked
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: pending
    signal: cups_job_size_pending
  - id: held
    signal: cups_job_size_held
  - id: processing
    signal: cups_job_size_processing
- id: cups.destination_job_num
  title: Active jobs of {destination}
  units: jobs
  family: destination
  chart_type: stacked
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: pending
    signal: cups_destination_job_num_pending
  - id: held
    signal: cups_destination_job_num_held
  - id: processing
    signal: cups_destination_job_num_processing
- id: cups.destination_job_size
  title: Active jobs size of {destination}
  units: KB
  family: destination
  chart_type: stacked
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: pending
    signal: cups_destination_job_size_pending
  - id: held
    signal: cups_destination_job_size_held
  - id: processing
    signal: cups_destination_job_size_processing
