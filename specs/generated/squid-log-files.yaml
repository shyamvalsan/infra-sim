contexts:
- id: squidlog.requests
  title: Total Requests
  units: requests/s
  family: requests
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: squid_log_files_requests_requests
- id: squidlog.excluded_requests
  title: Excluded Requests
  units: requests/s
  family: excluded
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: unmatched
    rate_signal: squid_log_files_excluded_requests_unmatched
- id: squidlog.type_requests
  title: Requests By Type
  units: requests/s
  family: type
  chart_type: stacked
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: success
    rate_signal: squid_log_files_type_requests_success
  - id: bad
    rate_signal: squid_log_files_type_requests_bad
  - id: redirect
    rate_signal: squid_log_files_type_requests_redirect
  - id: error
    rate_signal: squid_log_files_type_requests_error
- id: squidlog.http_status_code_class_responses
  title: Responses By HTTP Status Code Class
  units: responses/s
  family: http
  chart_type: stacked
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: 1xx
    rate_signal: squid_log_files_http_status_code_class_responses_1xx
  - id: 2xx
    rate_signal: squid_log_files_http_status_code_class_responses_2xx
  - id: 3xx
    rate_signal: squid_log_files_http_status_code_class_responses_3xx
  - id: 4xx
    rate_signal: squid_log_files_http_status_code_class_responses_4xx
  - id: 5xx
    rate_signal: squid_log_files_http_status_code_class_responses_5xx
- id: squidlog.http_status_code_responses
  title: Responses By HTTP Status Code
  units: responses/s
  family: http
  chart_type: stacked
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: a dimension per HTTP response code
    rate_signal: squid_log_files_http_status_code_responses_a_dimension_per_http_response_code
- id: squidlog.bandwidth
  title: Bandwidth
  units: kilobits/s
  family: bandwidth
  chart_type: line
  priority: 60006
  shape: counters
  labels: {}
  dimensions:
  - id: sent
    rate_signal: squid_log_files_bandwidth_sent
- id: squidlog.response_time
  title: Response Time
  units: milliseconds
  family: response
  chart_type: line
  priority: 60007
  shape: independent
  labels: {}
  dimensions:
  - id: min
    signal: squid_log_files_response_time_min
  - id: max
    signal: squid_log_files_response_time_max
  - id: avg
    signal: squid_log_files_response_time_avg
- id: squidlog.uniq_clients
  title: Unique Clients
  units: clients
  family: uniq
  chart_type: line
  priority: 60008
  shape: independent
  labels: {}
  dimensions:
