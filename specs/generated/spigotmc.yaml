version: 1
name: spigotmc
description: SpigotMC metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real SpigotMC node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  spigotmc_players_players:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  spigotmc_avg_tps_1min:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  spigotmc_avg_tps_5min:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  spigotmc_avg_tps_15min:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  spigotmc_memory_used:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  spigotmc_memory_alloc:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: spigotmc.players
  title: Active Players
  units: players
  family: players
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: players
    signal: spigotmc_players_players
- id: spigotmc.avg_tps
  title: Average Ticks Per Second
  units: ticks
  family: avg
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: 1min
    signal: spigotmc_avg_tps_1min
  - id: 5min
    signal: spigotmc_avg_tps_5min
  - id: 15min
    signal: spigotmc_avg_tps_15min
- id: spigotmc.memory
  title: Memory Usage
  units: bytes
  family: memory
  chart_type: area
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: spigotmc_memory_used
  - id: alloc
    signal: spigotmc_memory_alloc
