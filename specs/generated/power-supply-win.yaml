version: 1
name: power-supply-win
description: Power Supply (Win) metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Power Supply (Win) node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  power_supply_win_capacity_capacity:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  power_supply_win_voltage_now:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: powersupply.capacity
  title: Battery capacity
  units: percentage
  family: capacity
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    device: sim-device-1
  dimensions:
  - id: capacity
    signal: power_supply_win_capacity_capacity
- id: powersupply.voltage
  title: Power supply voltage
  units: V
  family: voltage
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    device: sim-device-1
  dimensions:
  - id: now
    signal: power_supply_win_voltage_now
