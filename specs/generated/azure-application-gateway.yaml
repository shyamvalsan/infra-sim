contexts:
- id: azure_monitor.application_gateway.throughput
  title: Azure Application Gateway Throughput
  units: bytes/s
  family: Traffic
  chart_type: line
  priority: 90010
  instances:
    group: azure_application_gateway
    chart_prefix: application_gateway_throughput
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: application_gateway_throughput_average
- id: azure_monitor.application_gateway.traffic_volume
  title: Azure Application Gateway Traffic Volume
  units: bytes/s
  family: Traffic
  chart_type: line
  priority: 90020
  instances:
    group: azure_application_gateway
    chart_prefix: application_gateway_traffic_volume
    family: Traffic
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: received
    signal: application_gateway_traffic_volume_received
  - id: sent
    signal: application_gateway_traffic_volume_sent
- id: azure_monitor.application_gateway.requests
  title: Azure Application Gateway Requests
  units: requests/s
  family: Traffic
