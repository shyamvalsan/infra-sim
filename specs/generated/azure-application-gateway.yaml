version: 1
name: azure-application-gateway
description: 'Azure Application Gateway as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.Network/applicationGateways) so the contexts, units, families and
  dimension names match a real deployment. Charts are per-resource instances, as the collector emits them:
  resources are labels on one node, never separate nodes. Signals move independently rather than being
  causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  application_gateway_throughput_average:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  application_gateway_traffic_volume_received:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  application_gateway_traffic_volume_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  application_gateway_requests_total:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  application_gateway_requests_failed:
    base: 0.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  application_gateway_response_status_gateway:
