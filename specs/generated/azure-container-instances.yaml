version: 1
name: azure-container-instances
description: Azure Container Instances metrics, generated from Netdata's own collector metadata so the
  contexts, units and dimension names match what a real Azure Container Instances node reports. Signals
  are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_container_instances_container_instances_cpu_usage_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_instances_container_instances_cpu_usage_maximum:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_instances_container_instances_memory_usage_average:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_instances_container_instances_memory_usage_maximum:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_instances_container_instances_network_received:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_instances_container_instances_network_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: azure_monitor.container_instances.cpu_usage
  title: Azure Container Instances CPU Usage
  units: millicores
  family: container
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_container_instances_container_instances_cpu_usage_average
  - id: maximum
    signal: azure_container_instances_container_instances_cpu_usage_maximum
- id: azure_monitor.container_instances.memory_usage
  title: Azure Container Instances Memory Usage
  units: bytes
  family: container
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_container_instances_container_instances_memory_usage_average
  - id: maximum
    signal: azure_container_instances_container_instances_memory_usage_maximum
- id: azure_monitor.container_instances.network
  title: Azure Container Instances Network Traffic
  units: bytes/s
  family: container
  chart_type: line
  priority: 60003
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: received
    rate_signal: azure_container_instances_container_instances_network_received
  - id: sent
    rate_signal: azure_container_instances_container_instances_network_sent
