version: 1
name: azure-container-instances
description: 'Azure Container Instances as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.ContainerInstance/containerGroups) so the contexts, units, families
  and dimension names match a real deployment. Charts are per-resource instances, as the collector emits
  them: resources are labels on one node, never separate nodes. Signals move independently rather than
  being causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  container_instances_cpu_usage_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_instances_cpu_usage_maximum:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_instances_memory_usage_average:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_instances_memory_usage_maximum:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_instances_network_received:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_instances_network_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.container_instances.cpu_usage
  title: Azure Container Instances CPU Usage
  units: millicores
  family: CPU
  chart_type: line
  priority: 90010
  instances:
    group: azure_container_instances
    chart_prefix: container_instances_cpu_usage
    family: CPU
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: container_instances_cpu_usage_average
  - id: maximum
    signal: container_instances_cpu_usage_maximum
- id: azure_monitor.container_instances.memory_usage
  title: Azure Container Instances Memory Usage
  units: bytes
  family: Memory
  chart_type: line
  priority: 90020
  instances:
    group: azure_container_instances
    chart_prefix: container_instances_memory_usage
    family: Memory
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: container_instances_memory_usage_average
  - id: maximum
    signal: container_instances_memory_usage_maximum
- id: azure_monitor.container_instances.network
  title: Azure Container Instances Network Traffic
  units: bytes/s
  family: Network
  chart_type: line
  priority: 90030
  instances:
    group: azure_container_instances
    chart_prefix: container_instances_network
    family: Network
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: received
    signal: container_instances_network_received
  - id: sent
    signal: container_instances_network_sent
