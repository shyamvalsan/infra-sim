version: 1
name: system-thermal-zone
description: System thermal zone metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real System thermal zone node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  system_thermal_zone_thermalzone_temperature_temperature:
    base: 41.0
    min: 0.0
    max: 120.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: system.thermalzone_temperature
  title: Thermal zone temperature
  units: celsius
  family: thermalzone
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: temperature
    signal: system_thermal_zone_thermalzone_temperature_temperature
