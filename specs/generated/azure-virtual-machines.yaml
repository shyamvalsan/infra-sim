contexts:
- id: azure_monitor.virtual_machines.cpu
  title: Azure Virtual Machine CPU Utilization
  units: percentage
  family: CPU
  chart_type: line
  priority: 90010
  instances:
    group: azure_virtual_machines
    chart_prefix: virtual_machines_cpu
    family: CPU
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: virtual_machines_cpu_average
- id: azure_monitor.virtual_machines.cpu_credits
  title: Azure Virtual Machine CPU Credits
