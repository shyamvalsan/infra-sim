- id: azure_monitor.event_grid.destination_processing_duration
  title: Azure Event Grid Destination Processing Duration
  units: milliseconds
  family: event
  chart_type: line
  priority: 60006
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
