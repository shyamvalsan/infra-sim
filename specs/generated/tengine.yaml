contexts:
- id: tengine.bandwidth_total
  title: Bandwidth
  units: B/s
  family: bandwidth
  chart_type: area
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: in
    rate_signal: tengine_bandwidth_total_in
  - id: out
    rate_signal: tengine_bandwidth_total_out
- id: tengine.connections_total
  title: Connections
  units: connections/s
  family: connections
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: accepted
    rate_signal: tengine_connections_total_accepted
- id: tengine.requests_total
  title: Requests
  units: requests/s
  family: requests
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: processed
    rate_signal: tengine_requests_total_processed
- id: tengine.requests_per_response_code_family_total
  title: Requests Per Response Code Family
  units: requests/s
  family: requests
  chart_type: stacked
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: 2xx
    rate_signal: tengine_requests_per_response_code_family_total_2xx
  - id: 3xx
    rate_signal: tengine_requests_per_response_code_family_total_3xx
  - id: 4xx
    rate_signal: tengine_requests_per_response_code_family_total_4xx
  - id: 5xx
    rate_signal: tengine_requests_per_response_code_family_total_5xx
  - id: other
    rate_signal: tengine_requests_per_response_code_family_total_other
- id: tengine.requests_per_response_code_detailed_total
  title: Requests Per Response Code Detailed
  units: requests/s
  family: requests
  chart_type: stacked
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: '200'
    rate_signal: tengine_requests_per_response_code_detailed_total_200
  - id: '206'
    rate_signal: tengine_requests_per_response_code_detailed_total_206
