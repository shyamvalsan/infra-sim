  - id: '503'
    rate_signal: tengine_requests_per_response_code_detailed_total_503
  - id: '504'
    rate_signal: tengine_requests_per_response_code_detailed_total_504
  - id: '508'
    rate_signal: tengine_requests_per_response_code_detailed_total_508
  - id: other
    rate_signal: tengine_requests_per_response_code_detailed_total_other
- id: tengine.requests_upstream_total
  title: Number Of Requests Calling For Upstream
  units: requests/s
  family: requests
  chart_type: line
  priority: 60006
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: tengine_requests_upstream_total_requests
- id: tengine.tries_upstream_total
  title: Number Of Times Calling For Upstream
  units: calls/s
  family: tries
  chart_type: line
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
