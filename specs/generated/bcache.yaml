version: 1
name: bcache
description: BCache metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real BCache node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  bcache_bcache_cache_alloc_ununsed:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  bcache_bcache_cache_alloc_dirty:
