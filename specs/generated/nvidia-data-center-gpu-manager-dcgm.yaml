version: 1
name: nvidia-data-center-gpu-manager-dcgm
description: Nvidia Data Center GPU Manager (DCGM) metrics, generated from Netdata's own collector metadata
  so the contexts, units and dimension names match what a real Nvidia Data Center GPU Manager (DCGM) node
  reports. Signals are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
