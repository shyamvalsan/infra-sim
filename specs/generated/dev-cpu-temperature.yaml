version: 1
name: dev-cpu-temperature
description: dev.cpu.temperature metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real dev.cpu.temperature node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  dev_cpu_temperature_temperature_a_dimension_per_core:
    base: 41.0
    min: 0.0
    max: 120.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: cpu.temperature
  title: Core temperature
  units: Celsius
  family: temperature
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: a dimension per core
    signal: dev_cpu_temperature_temperature_a_dimension_per_core
