version: 1
name: nats
description: NATS metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real NATS node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  nats_server_traffic_received:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  nats_server_traffic_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
