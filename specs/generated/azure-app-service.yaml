contexts:
- id: azure_monitor.app_service.requests
  title: Azure App Service Requests
  units: requests/s
  family: HTTP
  chart_type: line
  priority: 90010
  instances:
    group: azure_app_service
    chart_prefix: app_service_requests
    family: HTTP
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: requests
    signal: app_service_requests_requests
- id: azure_monitor.app_service.response_time
  title: Azure App Service Response Time
  units: seconds
  family: HTTP
