version: 1
name: azure-event-hubs
description: 'Azure Event Hubs Namespace as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.EventHub/Namespaces) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
signals:
  event_hubs_message_flow_in:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_message_flow_out:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_data_throughput_in:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_data_throughput_out:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_requests_incoming:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_requests_successful:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_errors_server:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_errors_user:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_errors_throttled:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_errors_quota_exceeded:
    base: 0.0
    min: 0.0
    max: 100000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_connections_active:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_connection_events_opened:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_connection_events_closed:
    base: 180.0
    min: 0.0
    max: 200000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_captured_messages_total:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_captured_data_total:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_namespace_size_average:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_capture_backlog_backlog:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_namespace_resources_cpu:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_namespace_resources_memory:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_replication_lag_messages:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  event_hubs_replication_lag_duration_duration:
    base: 0.9
    min: 0.0
    max: 86400.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.event_hubs.message_flow
  title: Azure Event Hubs Message Flow
  units: messages/s
  family: Messages
  chart_type: line
  priority: 90010
  instances:
    group: azure_event_hubs
    chart_prefix: event_hubs_message_flow
    family: Messages
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: in
    signal: event_hubs_message_flow_in
  - id: out
    signal: event_hubs_message_flow_out
- id: azure_monitor.event_hubs.data_throughput
  title: Azure Event Hubs Data Throughput
  units: bytes/s
  family: Messages
  chart_type: line
  priority: 90020
