version: 1
name: network-interfaces
description: Network interfaces metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Network interfaces node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  network_interfaces_compressed_received:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  network_interfaces_compressed_sent:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: net.compressed
  title: Compressed Packets
  units: packets/s
  family: compressed
  chart_type: line
  priority: 60001
  shape: counters
  labels:
    interface_type: sim-interface_type-1
    device: sim-device-1
  dimensions:
  - id: received
    rate_signal: network_interfaces_compressed_received
  - id: sent
    rate_signal: network_interfaces_compressed_sent
