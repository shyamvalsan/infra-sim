version: 1
name: timex
description: Timex metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Timex node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  timex_clock_status_unsync:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  timex_clock_status_clockerr:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
contexts:
- id: system.clock_status
  title: System Clock Status
  units: status
  family: clock
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: unsync
    signal: timex_clock_status_unsync
  - id: clockerr
    signal: timex_clock_status_clockerr
