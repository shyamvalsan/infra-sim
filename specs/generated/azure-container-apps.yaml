version: 1
name: azure-container-apps
description: 'Azure Container Apps as reported through Netdata''s azure_monitor collector, generated from
  its service profile (Microsoft.App/containerApps) so the contexts, units, families and dimension names
  match a real deployment. Charts are per-resource instances, as the collector emits them: resources are
  labels on one node, never separate nodes. Signals move independently rather than being causally coupled
  - see scripts/sync-profile-collectors.py.'
signals:
  container_apps_cpu_usage_average:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_apps_cpu_usage_maximum:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_apps_cpu_percentage_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  container_apps_cpu_percentage_maximum:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
