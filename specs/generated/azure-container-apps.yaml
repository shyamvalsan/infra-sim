contexts:
- id: azure_monitor.container_apps.cpu_usage
  title: Azure Container Apps CPU Usage
  units: nanocores
  family: CPU
  chart_type: line
  priority: 90010
  instances:
    group: azure_container_apps
    chart_prefix: container_apps_cpu_usage
    family: CPU
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: container_apps_cpu_usage_average
  - id: maximum
    signal: container_apps_cpu_usage_maximum
- id: azure_monitor.container_apps.cpu_percentage
