version: 1
name: azure-data-factory
description: 'Azure Data Factory as reported through Netdata''s azure_monitor collector, generated from
  its service profile (Microsoft.DataFactory/factories) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
