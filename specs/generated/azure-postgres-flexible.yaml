- id: azure_monitor.postgres_flexible.cpu
  title: Azure PostgreSQL Flexible Server CPU Utilization
  units: percentage
  family: Utilization
  chart_type: line
  priority: 90010
  instances:
    group: azure_postgres_flexible
    chart_prefix: postgres_flexible_cpu
    family: Utilization
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: postgres_flexible_cpu_average
