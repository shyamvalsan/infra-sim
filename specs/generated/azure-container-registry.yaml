version: 1
name: azure-container-registry
description: 'Azure Container Registry as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.ContainerRegistry/registries) so the contexts, units, families and
  dimension names match a real deployment. Charts are per-resource instances, as the collector emits them:
  resources are labels on one node, never separate nodes. Signals move independently rather than being
  causally coupled - see scripts/sync-profile-collectors.py.'
signals:
  container_registry_storage_used_used:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_pull_count_successful:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_pull_count_total:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_push_count_successful:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_push_count_total:
    base: 130.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_agentpool_cpu_time_cpu_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    noise:
      kind: gauss
      sigma: 0.18
  container_registry_run_duration_duration:
    base: 24.0
    min: 0.0
    max: 600000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.container_registry.storage_used
  title: Azure Container Registry Storage Used
  units: bytes
  family: Storage
  chart_type: line
  priority: 90010
  instances:
    group: azure_container_registry
    chart_prefix: container_registry_storage_used
    family: Storage
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: used
    signal: container_registry_storage_used_used
- id: azure_monitor.container_registry.pull_count
  title: Azure Container Registry Image Pulls
  units: pulls/s
  family: Operations
  chart_type: line
  priority: 90020
  instances:
    group: azure_container_registry
    chart_prefix: container_registry_pull_count
    family: Operations
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: successful
    signal: container_registry_pull_count_successful
  - id: total
    signal: container_registry_pull_count_total
- id: azure_monitor.container_registry.push_count
  title: Azure Container Registry Image Pushes
  units: pushes/s
  family: Operations
  chart_type: line
  priority: 90030
  instances:
    group: azure_container_registry
    chart_prefix: container_registry_push_count
    family: Operations
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: successful
    signal: container_registry_push_count_successful
  - id: total
    signal: container_registry_push_count_total
- id: azure_monitor.container_registry.agentpool_cpu_time
  title: Azure Container Registry AgentPool CPU Time
  units: seconds/s
  family: Tasks
  chart_type: line
  priority: 90040
  instances:
    group: azure_container_registry
    chart_prefix: container_registry_agentpool_cpu_time
    family: Tasks
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: cpu_time
    signal: container_registry_agentpool_cpu_time_cpu_time
- id: azure_monitor.container_registry.run_duration
  title: Azure Container Registry Task Run Duration
  units: milliseconds/s
  family: Tasks
  chart_type: line
  priority: 90050
  instances:
    group: azure_container_registry
    chart_prefix: container_registry_run_duration
    family: Tasks
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: duration
    signal: container_registry_run_duration_duration
