version: 1
name: azure-container-registry
description: Azure Container Registry metrics, generated from Netdata's own collector metadata so the
  contexts, units and dimension names match what a real Azure Container Registry node reports. Signals
  are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_container_registry_container_registry_storage_used_used:
    base: 620000000.0
    min: 0.0
    max: 900000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_pull_count_successful:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_pull_count_total:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_push_count_successful:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_push_count_total:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_agentpool_cpu_time_cpu_time:
    base: 0.9
    min: 0.0
    max: 86400.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_container_registry_container_registry_run_duration_duration:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: azure_monitor.container_registry.storage_used
  title: Azure Container Registry Storage Used
  units: bytes
  family: container
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: used
    signal: azure_container_registry_container_registry_storage_used_used
- id: azure_monitor.container_registry.pull_count
  title: Azure Container Registry Image Pulls
  units: pulls/s
  family: container
  chart_type: line
  priority: 60002
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: successful
    rate_signal: azure_container_registry_container_registry_pull_count_successful
  - id: total
    rate_signal: azure_container_registry_container_registry_pull_count_total
- id: azure_monitor.container_registry.push_count
  title: Azure Container Registry Image Pushes
  units: pushes/s
  family: container
  chart_type: line
  priority: 60003
  shape: counters
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: successful
    rate_signal: azure_container_registry_container_registry_push_count_successful
  - id: total
    rate_signal: azure_container_registry_container_registry_push_count_total
- id: azure_monitor.container_registry.agentpool_cpu_time
  title: Azure Container Registry AgentPool CPU Time
  units: seconds/s
  family: container
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: cpu_time
    signal: azure_container_registry_container_registry_agentpool_cpu_time_cpu_time
- id: azure_monitor.container_registry.run_duration
  title: Azure Container Registry Task Run Duration
  units: milliseconds/s
  family: container
  chart_type: line
  priority: 60005
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: duration
    signal: azure_container_registry_container_registry_run_duration_duration
