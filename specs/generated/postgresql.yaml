contexts:
- id: postgres.connections_utilization
  title: Connections utilization
  units: percentage
  family: connections
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: postgresql_connections_utilization_used
- id: postgres.connections_usage
  title: Connections usage
  units: connections
  family: connections
  chart_type: stacked
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: available
    signal: postgresql_connections_usage_available
  - id: used
    signal: postgresql_connections_usage_used
- id: postgres.connections_state_count
  title: Connections in each state
  units: connections
  family: connections
  chart_type: stacked
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: postgresql_connections_state_count_active
  - id: idle
    signal: postgresql_connections_state_count_idle
  - id: idle_in_transaction
    signal: postgresql_connections_state_count_idle_in_transaction
  - id: idle_in_transaction_aborted
    signal: postgresql_connections_state_count_idle_in_transaction_aborted
  - id: disabled
    signal: postgresql_connections_state_count_disabled
- id: postgres.transactions_duration
  title: Observed transactions time
  units: transactions/s
  family: transactions
  chart_type: stacked
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: a dimension per bucket
    rate_signal: postgresql_transactions_duration_a_dimension_per_bucket
- id: postgres.queries_duration
  title: Observed active queries time
  units: queries/s
  family: queries
  chart_type: stacked
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: a dimension per bucket
    rate_signal: postgresql_queries_duration_a_dimension_per_bucket
- id: postgres.locks_utilization
  title: Acquired locks utilization
  units: percentage
  family: locks
  chart_type: line
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: postgresql_locks_utilization_used
- id: postgres.checkpoints_rate
  title: Checkpoints
  units: checkpoints/s
  family: checkpoints
  chart_type: stacked
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: scheduled
    rate_signal: postgresql_checkpoints_rate_scheduled
  - id: requested
    rate_signal: postgresql_checkpoints_rate_requested
- id: postgres.checkpoints_time
  title: Checkpoint time
  units: milliseconds
  family: checkpoints
  chart_type: stacked
  priority: 60008
  shape: independent
  labels: {}
  dimensions:
  - id: write
    signal: postgresql_checkpoints_time_write
  - id: sync
    signal: postgresql_checkpoints_time_sync
- id: postgres.bgwriter_halts_rate
  title: Background writer scan halts
  units: events/s
  family: bgwriter
  chart_type: line
  priority: 60009
  shape: counters
  labels: {}
  dimensions:
  - id: maxwritten
    rate_signal: postgresql_bgwriter_halts_rate_maxwritten
- id: postgres.buffers_io_rate
  title: Buffers written rate
  units: B/s
  family: buffers
  chart_type: area
  priority: 60010
  shape: counters
  labels: {}
  dimensions:
  - id: checkpoint
    rate_signal: postgresql_buffers_io_rate_checkpoint
  - id: backend
    rate_signal: postgresql_buffers_io_rate_backend
  - id: bgwriter
    rate_signal: postgresql_buffers_io_rate_bgwriter
- id: postgres.buffers_backend_fsync_rate
  title: Backend fsync calls
  units: calls/s
  family: buffers
  chart_type: line
  priority: 60011
  shape: counters
  labels: {}
  dimensions:
  - id: fsync
    rate_signal: postgresql_buffers_backend_fsync_rate_fsync
- id: postgres.buffers_allocated_rate
  title: Buffers allocated
  units: B/s
  family: buffers
  chart_type: line
  priority: 60012
  shape: counters
  labels: {}
  dimensions:
  - id: allocated
    rate_signal: postgresql_buffers_allocated_rate_allocated
- id: postgres.wal_io_rate
  title: Write-Ahead Log writes
  units: B/s
  family: wal
  chart_type: line
  priority: 60013
  shape: counters
  labels: {}
  dimensions:
  - id: write
    rate_signal: postgresql_wal_io_rate_write
- id: postgres.wal_files_count
  title: Write-Ahead Log files
  units: files
  family: wal
  chart_type: stacked
  priority: 60014
  shape: independent
  labels: {}
  dimensions:
  - id: written
    signal: postgresql_wal_files_count_written
  - id: recycled
    signal: postgresql_wal_files_count_recycled
- id: postgres.wal_archiving_files_count
  title: Write-Ahead Log archived files
  units: files/s
  family: wal
  chart_type: stacked
  priority: 60015
  shape: counters
  labels: {}
  dimensions:
  - id: ready
    rate_signal: postgresql_wal_archiving_files_count_ready
  - id: done
    rate_signal: postgresql_wal_archiving_files_count_done
- id: postgres.autovacuum_workers_count
  title: Autovacuum workers
  units: workers
  family: autovacuum
  chart_type: line
  priority: 60016
  shape: independent
  labels: {}
  dimensions:
  - id: analyze
    signal: postgresql_autovacuum_workers_count_analyze
  - id: vacuum_analyze
    signal: postgresql_autovacuum_workers_count_vacuum_analyze
  - id: vacuum
    signal: postgresql_autovacuum_workers_count_vacuum
  - id: vacuum_freeze
    signal: postgresql_autovacuum_workers_count_vacuum_freeze
  - id: brin_summarize
    signal: postgresql_autovacuum_workers_count_brin_summarize
- id: postgres.txid_exhaustion_towards_autovacuum_perc
  title: Percent towards emergency autovacuum
  units: percentage
  family: txid
  chart_type: line
  priority: 60017
  shape: independent
