version: 1
name: ioping
description: IOPing metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real IOPing node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  ioping_latency_latency:
    base: 850.0
    min: 0.0
    max: 60000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: ioping.latency
  title: Read Latency
  units: microseconds
  family: latency
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: latency
    signal: ioping_latency_latency
