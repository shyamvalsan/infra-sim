    base: 45.0
    min: 0.0
    max: 500000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  redis_connections_rejected:
    base: 0.0
    min: 0.0
    max: 500000.0
  redis_clients_connected:
