version: 1
name: azure-load-balancer
description: Azure Load Balancer metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Azure Load Balancer node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_load_balancer_load_balancers_vip_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_dip_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_global_backend_availability_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_byte_throughput_total:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_packet_throughput_total:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_syn_count_total:
    base: 9800.0
    min: 0.0
    max: 20000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_snat_connections_total:
    base: 45.0
    min: 0.0
    max: 500000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_snat_ports_allocated:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_load_balancer_load_balancers_snat_ports_used:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: azure_monitor.load_balancers.vip_availability
  title: Azure Load Balancer Data Path Availability
  units: percentage
  family: load
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    resource_name: sim-resource_name-1
    resource_group: sim-resource_group-1
    region: sim-region-1
    resource_type: sim-resource_type-1
    profile: sim-profile-1
    subscription_id: sim-subscription_id-1
    resource_uid: sim-resource_uid-1
  dimensions:
  - id: average
    signal: azure_load_balancer_load_balancers_vip_availability_average
- id: azure_monitor.load_balancers.dip_availability
  title: Azure Load Balancer Health Probe Status
  units: percentage
  family: load
  chart_type: line
  priority: 60002
