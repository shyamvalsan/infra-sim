contexts:
- id: snmp.device_prof_cpu_usage
  title: The 1,5 and 15 minute load averages
  units: '{load_average}'
  family: System/CPU/Load
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
- id: snmp.device_prof_synology_system_systemStatus
  title: System status
  units: '{status}'
  family: System/Status
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: '2'
    signal: synology_disk_station_synology_system_systemstatus
  - id: '1'
    signal: synology_disk_station_synology_system_systemstatus_1
- id: snmp.device_prof_synology_system_temperature
  title: The temperature of Disk Station
  units: Cel
  family: Hardware/Temperature/Value
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: synology_system_temperature
    signal: synology_disk_station_synology_system_temperature
- id: snmp.device_prof_synology_system_powerStatus
  title: Power status
  units: '{status}'
  family: Hardware/Power/Status
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: normal
    signal: synology_disk_station_synology_system_powerstatus
  - id: failed
    signal: synology_disk_station_synology_system_powerstatus_failed
- id: snmp.device_prof_synology_system_systemFanStatus
  title: Fan status
  units: '{status}'
  family: Hardware/Fan/Status/System
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: normal
    signal: synology_disk_station_synology_system_systemfanstatus
  - id: failed
    signal: synology_disk_station_synology_system_systemfanstatus_failed
- id: snmp.device_prof_synology_system_cpuFanStatus
  title: CPU fan status
  units: '{status}'
  family: Hardware/Fan/Status/CPU
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: normal
    signal: synology_disk_station_synology_system_cpufanstatus
  - id: failed
    signal: synology_disk_station_synology_system_cpufanstatus_failed
