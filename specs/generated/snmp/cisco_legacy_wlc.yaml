    rate_signal: cisco_legacy_wlc_tcphcoutsegs
- id: snmp.device_prof_tcpOutSegs
  title: TCP segments sent
  units: '{packet}/s'
  family: Network/TCP/Segment/Total/Out
  chart_type: line
  priority: 60014
  shape: counters
  dimensions:
