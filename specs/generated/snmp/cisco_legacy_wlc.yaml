contexts:
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
- id: snmp.device_prof_memory_free
  title: Free RAM of the switch
  units: By
  family: System/Memory/RAM/Free
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: memory_free
    signal: cisco_legacy_wlc_memory_free
- id: snmp.device_prof_memory_total
  title: Total RAM of the switch
  units: By
  family: System/Memory/RAM/Total
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: memory_total
    signal: device_memory_total_bytes
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: systemuptime
    signal: cisco_legacy_wlc_systemuptime
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: ifnumber
    signal: cisco_legacy_wlc_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60007
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_tcpCurrEstab
  title: Current TCP connections in ESTABLISHED or CLOSE-WAIT state
  units: '{connection}'
  family: Network/TCP/Connection/Active/Count
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: tcpcurrestab
    signal: cisco_legacy_wlc_tcpcurrestab
- id: snmp.device_prof_tcpActiveOpens
  title: TCP connections transitioning from CLOSED to SYN-SENT
  units: '{transition}/s'
  family: Network/TCP/Connection/Open/Active/Count
  chart_type: line
  priority: 60009
  shape: counters
  dimensions:
  - id: tcpactiveopens
    rate_signal: cisco_legacy_wlc_tcpactiveopens
- id: snmp.device_prof_tcpPassiveOpens
  title: TCP connections transitioning from LISTEN to SYN-RCVD
  units: '{transition}/s'
  family: Network/TCP/Connection/Open/Passive/Count
  chart_type: line
  priority: 60010
  shape: counters
  dimensions:
  - id: tcppassiveopens
    rate_signal: cisco_legacy_wlc_tcppassiveopens
- id: snmp.device_prof_tcpHCInSegs
  title: TCP segments received
  units: '{packet}/s'
  family: Network/TCP/Segment/Total/In
  chart_type: line
  priority: 60011
  shape: counters
  dimensions:
  - id: tcphcinsegs
    rate_signal: cisco_legacy_wlc_tcphcinsegs
- id: snmp.device_prof_tcpInSegs
  title: TCP segments received
  units: '{packet}/s'
  family: Network/TCP/Segment/Total/In
  chart_type: line
  priority: 60012
  shape: counters
  dimensions:
  - id: tcpinsegs
    rate_signal: cisco_legacy_wlc_tcpinsegs
- id: snmp.device_prof_tcpHCOutSegs
  title: TCP segments sent
  units: '{packet}/s'
  family: Network/TCP/Segment/Total/Out
  chart_type: line
