    rate_signal: cisco_legacy_wlc_tcpoutsegs
- id: snmp.device_prof_tcpInErrs
  title: TCP segments received with errors
  units: '{error}/s'
  family: Network/TCP/Segment/Error/In
  chart_type: line
  priority: 60015
  shape: counters
  dimensions:
  - id: tcpinerrs
    rate_signal: cisco_legacy_wlc_tcpinerrs
- id: snmp.device_prof_tcpAttemptFails
  title: Failed TCP connection attempts
  units: '{failure}/s'
  family: Network/TCP/Connection/Failure/Count
  chart_type: line
  priority: 60016
  shape: counters
  dimensions:
  - id: tcpattemptfails
    rate_signal: cisco_legacy_wlc_tcpattemptfails
