    signal: extreme_switching_entphysensoroperstatus
  - id: unavailable
    signal: extreme_switching_entphysensoroperstatus_unavailable
  - id: nonoperational
    signal: extreme_switching_entphysensoroperstatus_nonoperational
  instances:
    group: sensor_index
    chart_prefix: entphysensoroperstatus
    family: Hardware/Sensor/Status
    labels:
      sensor_index: '{instance}'
- id: snmp.device_prof_ifTotalTraffic
  title: Total traffic across all interfaces
  units: bit/s
  family: Network/Total/Traffic
  chart_type: area
  priority: 60020
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsUcast
  title: Total unicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Unicast
  chart_type: line
  priority: 60021
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_ucast_rate
  - id: out
    rate_signal: if_out_ucast_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsMulticast
  title: Total multicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Multicast
  chart_type: line
  priority: 60022
  shape: counters
  dimensions:
