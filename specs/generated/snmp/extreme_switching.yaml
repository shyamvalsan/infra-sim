contexts:
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
- id: snmp.device_prof_memory_total
  title: Total amount of DRAM in Kbytes in the system.
  units: By
  family: System/Memory/Total
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: memory_total
    signal: device_memory_total_bytes
  instances:
    group: mem_index
    chart_prefix: memory_total
    family: System/Memory/Total
    labels:
      mem_index: '{instance}'
- id: snmp.device_prof_memory_free
  title: Total amount of free memory in Kbytes in the system.
  units: By
  family: System/Memory/Free
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: memory_free
    signal: extreme_switching_memory_free
  instances:
    group: mem_index
    chart_prefix: memory_free
    family: System/Memory/Free
    labels:
      mem_index: '{instance}'
- id: snmp.device_prof_extremeOverTemperatureAlarm
  title: Over temperature alarm status
  units: '{status}'
  family: Hardware/Sensor/Temperature/Alarm/Status
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: active
    signal: extreme_switching_extremeovertemperaturealarm
  - id: clear
    signal: extreme_switching_extremeovertemperaturealarm_clear
- id: snmp.device_prof_extremeCurrentTemperature
  title: Current temperature measured inside device enclosure.
  units: Cel
  family: Hardware/Sensor/Temperature/Value
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: extremecurrenttemperature
    signal: extreme_switching_extremecurrenttemperature
- id: snmp.device_prof_extremePrimaryPowerOperational
  title: Primary power operational status
  units: '{status}'
  family: Hardware/Power/Primary/Status
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: ok
    signal: extreme_switching_extremeprimarypoweroperational
  - id: failed
    signal: extreme_switching_extremeprimarypoweroperational_failed
- id: snmp.device_prof_extremeRedundantPowerStatus
  title: Redundant power supply status
  units: '{status}'
  family: Hardware/Power/Redundant/Status
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: not_present
    signal: extreme_switching_extremeredundantpowerstatus
  - id: present_ok
    signal: extreme_switching_extremeredundantpowerstatus_present_ok
  - id: present_not_ok
    signal: extreme_switching_extremeredundantpowerstatus_present_not_ok
- id: snmp.device_prof_extremeRedundantPowerAlarm
  title: Redundant power alarm status
  units: '{status}'
  family: Hardware/Power/Redundant/Alarm/Status
  chart_type: line
  priority: 60007
  shape: independent
  dimensions:
  - id: clear
    signal: extreme_switching_extremeredundantpoweralarm_clear
  - id: active
    signal: extreme_switching_extremeredundantpoweralarm
- id: snmp.device_prof_extremeInputPowerVoltage
  title: The input power voltage at which the system is currently operating.
  units: V
  family: Hardware/Power/Input/Voltage
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: extremeinputpowervoltage
    signal: extreme_switching_extremeinputpowervoltage
- id: snmp.device_prof_extremePowerStatus
  title: Power supply status
  units: '{status}'
  family: Hardware/Power/Status
  chart_type: line
  priority: 60009
  shape: independent
  dimensions:
  - id: not_present
    signal: extreme_switching_extremepowerstatus
  - id: present_ok
    signal: extreme_switching_extremepowerstatus_present_ok
  - id: present_not_ok
    signal: extreme_switching_extremepowerstatus_present_not_ok
- id: snmp.device_prof_extremePowerAlarm
  title: Power alarm status
  units: '{status}'
  family: Hardware/Power/Alarm/Status
  chart_type: line
  priority: 60010
  shape: independent
  dimensions:
  - id: clear
    signal: extreme_switching_extremepoweralarm_clear
  - id: active
    signal: extreme_switching_extremepoweralarm
- id: snmp.device_prof_extremeSystemPowerState
  title: Overall system power state
  units: '{status}'
  family: Hardware/Power/Overall/Status
  chart_type: line
  priority: 60011
  shape: independent
  dimensions:
  - id: computing
    signal: extreme_switching_extremesystempowerstate
  - id: sufficient_but_not_redundant
    signal: extreme_switching_extremesystempowerstate_sufficient_but_not_redundant_power
  - id: redundant_power_available
    signal: extreme_switching_extremesystempowerstate_redundant_power_available
  - id: insufficient_power
    signal: extreme_switching_extremesystempowerstate_insufficient_power
- id: snmp.device_prof_extremeFanOperational
  title: Operational status of a cooling fan
  units: '{status}'
  family: Hardware/Fan/Status
  chart_type: line
  priority: 60012
  shape: independent
  dimensions:
  - id: ok
    signal: extreme_switching_extremefanoperational
  - id: failed
    signal: extreme_switching_extremefanoperational_failed
  instances:
    group: fan_index
    chart_prefix: extremefanoperational
    family: Hardware/Fan/Status
    labels:
      fan_index: '{instance}'
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60013
  shape: independent
  dimensions:
  - id: systemuptime
    signal: extreme_switching_systemuptime
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60014
  shape: independent
  dimensions:
  - id: ifnumber
    signal: extreme_switching_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60015
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60016
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60017
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_entPhySensorValue
  title: Most recent measurement obtained by the agent for this sensor
  units: '1'
  family: Hardware/Sensor/Value
  chart_type: line
  priority: 60018
  shape: independent
  dimensions:
  - id: entphysensorvalue
    signal: extreme_switching_entphysensorvalue
  instances:
    group: sensor_index
    chart_prefix: entphysensorvalue
    family: Hardware/Sensor/Value
    labels:
      sensor_index: '{instance}'
- id: snmp.device_prof_entPhySensorOperStatus
  title: Operational status of the sensor
  units: '{status}'
  family: Hardware/Sensor/Status
  chart_type: line
  priority: 60019
  shape: independent
  dimensions:
