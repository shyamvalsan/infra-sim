version: 1
name: extreme_switching
description: Extreme Switch, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/extreme-switching.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
