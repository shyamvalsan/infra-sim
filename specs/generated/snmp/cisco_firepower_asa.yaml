contexts:
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
  instances:
    group: cpu_index
    chart_prefix: cpu_usage
    family: System/CPU/Usage
    labels:
      cpu_index: '{instance}'
- id: snmp.device_prof_memory_used
  title: Number of bytes from the memory pool that are currently in use by applications on the physical entity
  units: By
  family: System/Memory/Used
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: memory_used
    signal: cisco_firepower_asa_memory_used
- id: snmp.device_prof_memory_free
  title: Number of bytes from the memory pool that are currently unused on the physical entity
  units: By
  family: System/Memory/Free
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: memory_free
    signal: cisco_firepower_asa_memory_free
- id: snmp.device_prof_crasNumDeclinedSessions
  title: Number of session setup attempts which were declined due to authentication or authorization failure
  units: '{session}/s'
  family: Network/VPN/RemoteAccess/Session/Setup/Declined
  chart_type: line
  priority: 60003
  shape: counters
  dimensions:
  - id: crasnumdeclinedsessions
    rate_signal: cisco_firepower_asa_crasnumdeclinedsessions
- id: snmp.device_prof_crasNumSetupFailInsufResources
  title: The number of session setup attempts that failed due to insufficient resources
  units: '{session}/s'
  family: Network/VPN/RemoteAccess/Session/Setup/Failed
  chart_type: line
  priority: 60004
  shape: counters
  dimensions:
  - id: crasnumsetupfailinsufresourc
    rate_signal: cisco_firepower_asa_crasnumsetupfailinsufresources
- id: snmp.device_prof_crasNumSessions
  title: Number of currently active sessions
  units: '{session}'
  family: Network/VPN/RemoteAccess/Session/Active
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: crasnumsessions
    signal: cisco_firepower_asa_crasnumsessions
- id: snmp.device_prof_crasMaxSessionsSupportable
  title: The maximum number of remote access sessions that may be supported on this device
  units: '{session}'
  family: Network/VPN/RemoteAccess/Session/Maximum
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: crasmaxsessionssupportable
    signal: cisco_firepower_asa_crasmaxsessionssupportable
- id: snmp.device_prof_crasNumUsers
  title: The number of users who have active sessions
  units: '{user}'
  family: Network/VPN/RemoteAccess/User/Active
  chart_type: line
  priority: 60007
  shape: independent
  dimensions:
  - id: crasnumusers
    signal: cisco_firepower_asa_crasnumusers
- id: snmp.device_prof_crasMaxUsersSupportable
  title: The maximum number of remote access users for whom Remote Access sessions may be supported on this device
  units: '{user}'
  family: Network/VPN/RemoteAccess/User/Maximum
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: crasmaxuserssupportable
    signal: cisco_firepower_asa_crasmaxuserssupportable
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60009
  shape: independent
  dimensions:
  - id: systemuptime
    signal: cisco_firepower_asa_systemuptime
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60010
  shape: independent
  dimensions:
  - id: ifnumber
    signal: cisco_firepower_asa_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60011
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60012
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60013
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifTotalTraffic
  title: Total traffic across all interfaces
  units: bit/s
  family: Network/Total/Traffic
  chart_type: area
  priority: 60014
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsUcast
  title: Total unicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Unicast
  chart_type: line
  priority: 60015
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_ucast_rate
  - id: out
    rate_signal: if_out_ucast_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsMulticast
  title: Total multicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Multicast
  chart_type: line
  priority: 60016
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_mcast_rate
  - id: out
    rate_signal: cisco_firepower_asa_ifhcoutmulticastpkts
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsBroadcast
  title: Total broadcast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Broadcast
  chart_type: line
  priority: 60017
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_bcast_rate
  - id: out
    rate_signal: cisco_firepower_asa_ifhcoutbroadcastpkts
    multiplier: -1
- id: snmp.device_prof_ifTotalErrors
  title: Total packets with errors across all interfaces
  units: '{error}/s'
  family: Network/Total/Error
  chart_type: line
  priority: 60018
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_errors_rate
  - id: out
    rate_signal: if_out_errors_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalDiscards
  title: Total packets discarded across all interfaces
  units: '{discard}/s'
  family: Network/Total/Discard
  chart_type: line
  priority: 60019
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_discards_rate
  - id: out
    rate_signal: if_out_discards_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalOperStatus
  title: Total count of interfaces by operational status
  units: '{status}'
  family: Network/Total/Interface/Status
  chart_type: line
  priority: 60020
  shape: independent
  dimensions:
  - id: up
    signal: cisco_firepower_asa_iftotaloperstatus
  - id: down
    signal: cisco_firepower_asa_iftotaloperstatus_down
  - id: testing
    signal: cisco_firepower_asa_iftotaloperstatus_testing
  - id: unknown
    signal: cisco_firepower_asa_iftotaloperstatus_unknown
  - id: dormant
    signal: cisco_firepower_asa_iftotaloperstatus_dormant
  - id: notpresent
    signal: cisco_firepower_asa_iftotaloperstatus_notpresent
  - id: lowerlayerdown
    signal: cisco_firepower_asa_iftotaloperstatus_lowerlayerdown
- id: snmp.device_prof_ifTraffic
  title: Traffic
  units: bit/s
  family: Network/Interface/Traffic/Total
  chart_type: area
  priority: 60021
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
  instances:
