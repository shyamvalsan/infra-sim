  - id: indeterminate
    signal: silverpeak_edgeconnect_silverpeak_mgmt_spsactivealarmseverity_indeterminate
  instances:
    group: silverpeak_mgmt_sps_active_alarm_index
    chart_prefix: silverpeak_mgmt_spsactivealarmseverity
    family: System/Alarm/Severity
    labels:
