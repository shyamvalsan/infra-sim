  priority: 60001
  shape: independent
  dimensions:
  - id: info
    signal: silverpeak_edgeconnect_silverpeak_mgmt_spsactivealarmseverity
  - id: warning
    signal: silverpeak_edgeconnect_silverpeak_mgmt_spsactivealarmseverity_warning
