version: 1
name: vmware_esx
description: VMware Server, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/vmware-esx.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
