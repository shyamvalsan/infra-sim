  - id: out
    rate_signal: vmware_esx_ifhcoutbroadcastpkts
    multiplier: -1
- id: snmp.device_prof_ifTotalErrors
  title: Total packets with errors across all interfaces
  units: '{error}/s'
  family: Network/Total/Error
  chart_type: line
  priority: 60016
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_errors_rate
  - id: out
    rate_signal: if_out_errors_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalDiscards
  title: Total packets discarded across all interfaces
  units: '{discard}/s'
  family: Network/Total/Discard
  chart_type: line
  priority: 60017
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_discards_rate
  - id: out
    rate_signal: if_out_discards_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalOperStatus
  title: Total count of interfaces by operational status
  units: '{status}'
  family: Network/Total/Interface/Status
  chart_type: line
  priority: 60018
  shape: independent
  dimensions:
  - id: up
    signal: vmware_esx_iftotaloperstatus
  - id: down
    signal: vmware_esx_iftotaloperstatus_down
  - id: testing
    signal: vmware_esx_iftotaloperstatus_testing
  - id: unknown
    signal: vmware_esx_iftotaloperstatus_unknown
  - id: dormant
    signal: vmware_esx_iftotaloperstatus_dormant
  - id: notpresent
    signal: vmware_esx_iftotaloperstatus_notpresent
  - id: lowerlayerdown
    signal: vmware_esx_iftotaloperstatus_lowerlayerdown
- id: snmp.device_prof_ifTraffic
  title: Traffic
  units: bit/s
  family: Network/Interface/Traffic/Total
  chart_type: area
  priority: 60019
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
  instances:
    group: interface
    chart_prefix: iftraffic
    family: Network/Interface/Traffic/Total
