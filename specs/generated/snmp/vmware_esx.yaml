contexts:
- id: snmp.device_prof_vmwHbaStatus
  title: Current HBA status
  units: '{status}'
  family: Hardware/HBA/Status
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: unknown
    signal: vmware_esx_vmwhbastatus_unknown
  - id: normal
    signal: vmware_esx_vmwhbastatus
  - id: marginal
    signal: vmware_esx_vmwhbastatus_marginal
  - id: critical
    signal: vmware_esx_vmwhbastatus_critical
  - id: failed
    signal: vmware_esx_vmwhbastatus_failed
  instances:
    group: vmw_hba_device_name
    chart_prefix: vmwhbastatus
    family: Hardware/HBA/Status
    labels:
      vmw_hba_device_name: '{instance}'
- id: snmp.device_prof_vmwHardwareStatus
  title: Last reported status of this component
  units: '{status}'
  family: Hardware/Component/Status
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: unknown
    signal: vmware_esx_vmwhardwarestatus_unknown
  - id: normal
    signal: vmware_esx_vmwhardwarestatus
  - id: marginal
    signal: vmware_esx_vmwhardwarestatus_marginal
  - id: critical
    signal: vmware_esx_vmwhardwarestatus_critical
  - id: failed
    signal: vmware_esx_vmwhardwarestatus_failed
  instances:
    group: vmw_subsystem_index
    chart_prefix: vmwhardwarestatus
    family: Hardware/Component/Status
    labels:
      vmw_subsystem_index: '{instance}'
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: systemuptime
    signal: vmware_esx_systemuptime
- id: snmp.device_prof_hrSystemNumUsers
  title: The number of user sessions for which this host is storing state information. A session is a collection of processes
    requiring a single act of user authentication and possibly subject to collective job control.
  units: '{session}'
  family: System/Activity/UserSession/Active
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: hrsystemnumusers
    signal: vmware_esx_hrsystemnumusers
- id: snmp.device_prof_hrSystemProcesses
  title: The number of process contexts currently loaded or running on this system.
  units: '{process}'
  family: System/Activity/Process/Active
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: hrsystemprocesses
    signal: vmware_esx_hrsystemprocesses
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
  instances:
    group: cpu_index
    chart_prefix: cpu_usage
    family: System/CPU/Usage
    labels:
      cpu_index: '{instance}'
- id: snmp.device_prof_hrStorageSize
  title: SNMP metric hrStorageSize
  units: By
  family: hrstoragetable
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: hrstoragesize
    signal: vmware_esx_hrstoragesize
  instances:
    group: storage_index
    chart_prefix: hrstoragesize
    family: hrstoragetable
    labels:
      storage_index: '{instance}'
- id: snmp.device_prof_hrStorageUsed
  title: SNMP metric hrStorageUsed
  units: By
  family: hrstoragetable
  chart_type: line
  priority: 60007
  shape: independent
  dimensions:
  - id: hrstorageused
    signal: vmware_esx_hrstorageused
  instances:
    group: storage_index
    chart_prefix: hrstorageused
    family: hrstoragetable
    labels:
      storage_index: '{instance}'
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: ifnumber
    signal: vmware_esx_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60009
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60010
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60011
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifTotalTraffic
  title: Total traffic across all interfaces
  units: bit/s
  family: Network/Total/Traffic
  chart_type: area
  priority: 60012
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsUcast
  title: Total unicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Unicast
  chart_type: line
  priority: 60013
  shape: counters
  dimensions:
