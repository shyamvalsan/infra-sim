version: 1
name: kyocera_printer
description: Kyocera Printer, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/kyocera-printer.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
signals:
  kyocera_printer_kcprtalertstatecode:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  kyocera_printer_kcprtmemorydevicetotalsize:
    base: 4294967296.0
    min: 4294967296.0
    max: 4294967296.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_kcprtmemorydeviceusedsize:
    base: 4294967296.0
    min: 4294967296.0
    max: 4294967296.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_kcprtmemorydevicestatus:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_kcprtmemorydevicestatus_readyreadonly:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_kcprtmemorydevicestatus_notaccessible:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_kcprtmemorydevicestatus_lowbattery:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  kyocera_printer_systemuptime:
    base: 86400.0
    min: 0.0
    max: 315360000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: snmp.device_prof_kcprtAlertStateCode
  title: Alert state code
  units: '{code}'
  family: System/Alert/Code
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: kcprtalertstatecode
    signal: kyocera_printer_kcprtalertstatecode
  instances:
    group: kcprt_alert_state_display_index
    chart_prefix: kcprtalertstatecode
    family: System/Alert/Code
    labels:
      kcprt_alert_state_display_index: '{instance}'
- id: snmp.device_prof_kcprtMemoryDeviceTotalSize
  title: Total size of the memory device
  units: By
  family: System/Memory/Total
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: kcprtmemorydevicetotalsize
    signal: kyocera_printer_kcprtmemorydevicetotalsize
  instances:
    group: kcprt_memory_device_index
    chart_prefix: kcprtmemorydevicetotalsize
    family: System/Memory/Total
    labels:
      kcprt_memory_device_index: '{instance}'
- id: snmp.device_prof_kcprtMemoryDeviceUsedSize
  title: Used size of the memory device
  units: By
  family: System/Memory/Used
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: kcprtmemorydeviceusedsize
    signal: kyocera_printer_kcprtmemorydeviceusedsize
  instances:
    group: kcprt_memory_device_index
    chart_prefix: kcprtmemorydeviceusedsize
    family: System/Memory/Used
    labels:
      kcprt_memory_device_index: '{instance}'
- id: snmp.device_prof_kcprtMemoryDeviceStatus
  title: Current status of this device
  units: '{status}'
  family: System/Memory/Status
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: readyreadwrite
    signal: kyocera_printer_kcprtmemorydevicestatus
  - id: readyreadonly
    signal: kyocera_printer_kcprtmemorydevicestatus_readyreadonly
  - id: notaccessible
    signal: kyocera_printer_kcprtmemorydevicestatus_notaccessible
  - id: lowbattery
    signal: kyocera_printer_kcprtmemorydevicestatus_lowbattery
  instances:
    group: kcprt_memory_device_index
    chart_prefix: kcprtmemorydevicestatus
    family: System/Memory/Status
    labels:
      kcprt_memory_device_index: '{instance}'
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: systemuptime
    signal: kyocera_printer_systemuptime
