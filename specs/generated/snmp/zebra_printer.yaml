version: 1
name: zebra_printer
description: Zebra Printer, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/zebra-printer.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
