contexts:
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
- id: snmp.device_prof_memory_usage
  title: Memory usage percentage
  units: '%'
  family: System/Memory/Usage
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: memory_usage
    signal: device_memory_usage
- id: snmp.device_prof_wlsxSysExtPacketLossPercent
  title: Packet loss percentage
  units: '%'
  family: Network/Packet/Loss
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: wlsxsysextpacketlosspercent
    signal: aruba_wireless_controller_wlsxsysextpacketlosspercent
- id: snmp.device_prof_sysXStorageSize
  title: Size of the storage filesystem in MB
  units: MBy
  family: System/Storage/Total
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: sysxstoragesize
    signal: aruba_wireless_controller_sysxstoragesize
  instances:
    group: sys_x_storage_type
    chart_prefix: sysxstoragesize
    family: System/Storage/Total
    labels:
      sys_x_storage_type: '{instance}'
- id: snmp.device_prof_sysXStorageUsed
  title: Size of the storage filesystem in MB
  units: MBy
  family: System/Storage/Used
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: sysxstorageused
    signal: aruba_wireless_controller_sysxstorageused
  instances:
    group: sys_x_storage_type
    chart_prefix: sysxstorageused
    family: System/Storage/Used
    labels:
      sys_x_storage_type: '{instance}'
- id: snmp.device_prof_apChannelNoise
  title: Noise on the channel
  units: dB
  family: Network/Wireless/AccessPoint/Channel/Noise
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: apchannelnoise
    signal: aruba_wireless_controller_apchannelnoise
  instances:
    group: ap_essid
    chart_prefix: apchannelnoise
    family: Network/Wireless/AccessPoint/Channel/Noise
    labels:
      ap_essid: '{instance}'
- id: snmp.device_prof_apSignalToNoiseRatio
  title: Signal to noise ratio for the BSSID
  units: dB
  family: Network/Wireless/AccessPoint/Signal/SNR
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: apsignaltonoiseratio
    signal: aruba_wireless_controller_apsignaltonoiseratio
  instances:
    group: ap_essid
    chart_prefix: apsignaltonoiseratio
    family: Network/Wireless/AccessPoint/Signal/SNR
    labels:
      ap_essid: '{instance}'
- id: snmp.device_prof_apChannelFrameRetryRate
  title: Number of retry packets as a percentage of the total packets transmitted and received on this channel
