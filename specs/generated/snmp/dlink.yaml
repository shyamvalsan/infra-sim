version: 1
name: dlink
description: D-Link Network device, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/dlink.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
signals:
  dlink_systemuptime:
    base: 86400.0
    min: 0.0
    max: 315360000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dlink_ifnumber:
    base: 26.0
    min: 26.0
    max: 26.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_admin_status:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_admin_status_down:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_admin_status_testing:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_down:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_testing:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_unknown:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_dormant:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_notpresent:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_oper_status_lowerlayerdown:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  if_speed:
    from_attr: if_speed_mbps
    base: 1000.0
    min: 0.0
    max: 400000.0
  if_in_octets_rate:
    base: 24800000.0
    min: 0.0
    max: 10000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_out_octets_rate:
    base: 24800000.0
    min: 0.0
    max: 10000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_in_ucast_rate:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_out_ucast_rate:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_in_mcast_rate:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dlink_ifhcoutmulticastpkts:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_in_bcast_rate:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dlink_ifhcoutbroadcastpkts:
    base: 2800.0
    min: 0.0
    max: 15000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  if_in_errors_rate:
    base: 0.0
    min: 0.0
    max: 500000.0
  if_out_errors_rate:
    base: 0.0
    min: 0.0
    max: 500000.0
  if_in_discards_rate:
    base: 0.0
    min: 0.0
    max: 500000.0
  if_out_discards_rate:
    base: 0.0
    min: 0.0
    max: 500000.0
  dlink_iftotaloperstatus:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_down:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_testing:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_unknown:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_dormant:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_notpresent:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
  dlink_iftotaloperstatus_lowerlayerdown:
    base: 0.0
    min: 0.0
    max: 0.0
    min_is_floor: true
    max_is_ceiling: true
    ignore_weight: true
contexts:
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: systemuptime
    signal: dlink_systemuptime
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: ifnumber
    signal: dlink_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60004
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifTotalTraffic
  title: Total traffic across all interfaces
  units: bit/s
  family: Network/Total/Traffic
  chart_type: area
  priority: 60005
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsUcast
  title: Total unicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Unicast
  chart_type: line
  priority: 60006
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_ucast_rate
  - id: out
    rate_signal: if_out_ucast_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsMulticast
  title: Total multicast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Multicast
  chart_type: line
  priority: 60007
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_mcast_rate
  - id: out
    rate_signal: dlink_ifhcoutmulticastpkts
    multiplier: -1
- id: snmp.device_prof_ifTotalPacketsBroadcast
  title: Total broadcast packets across all interfaces
  units: '{packet}/s'
  family: Network/Total/Packet/Broadcast
  chart_type: line
  priority: 60008
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_bcast_rate
  - id: out
    rate_signal: dlink_ifhcoutbroadcastpkts
    multiplier: -1
- id: snmp.device_prof_ifTotalErrors
  title: Total packets with errors across all interfaces
  units: '{error}/s'
  family: Network/Total/Error
  chart_type: line
  priority: 60009
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_errors_rate
  - id: out
    rate_signal: if_out_errors_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalDiscards
  title: Total packets discarded across all interfaces
  units: '{discard}/s'
  family: Network/Total/Discard
  chart_type: line
  priority: 60010
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_discards_rate
  - id: out
    rate_signal: if_out_discards_rate
    multiplier: -1
- id: snmp.device_prof_ifTotalOperStatus
  title: Total count of interfaces by operational status
  units: '{status}'
  family: Network/Total/Interface/Status
  chart_type: line
  priority: 60011
  shape: independent
  dimensions:
  - id: up
    signal: dlink_iftotaloperstatus
  - id: down
    signal: dlink_iftotaloperstatus_down
  - id: testing
    signal: dlink_iftotaloperstatus_testing
  - id: unknown
    signal: dlink_iftotaloperstatus_unknown
  - id: dormant
    signal: dlink_iftotaloperstatus_dormant
  - id: notpresent
    signal: dlink_iftotaloperstatus_notpresent
  - id: lowerlayerdown
    signal: dlink_iftotaloperstatus_lowerlayerdown
- id: snmp.device_prof_ifTraffic
  title: Traffic
  units: bit/s
  family: Network/Interface/Traffic/Total
  chart_type: area
  priority: 60012
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_octets_rate
  - id: out
    rate_signal: if_out_octets_rate
    multiplier: -1
  instances:
    group: interface
    chart_prefix: iftraffic
    family: Network/Interface/Traffic/Total
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifPacketsUcast
  title: Unicast packets
  units: '{packet}/s'
  family: Network/Interface/Packet/Unicast
  chart_type: line
  priority: 60013
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_ucast_rate
  - id: out
    rate_signal: if_out_ucast_rate
    multiplier: -1
  instances:
    group: interface
    chart_prefix: ifpacketsucast
    family: Network/Interface/Packet/Unicast
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifPacketsMulticast
  title: Multicast packets
  units: '{packet}/s'
  family: Network/Interface/Packet/Multicast
  chart_type: line
  priority: 60014
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_mcast_rate
  - id: out
    rate_signal: dlink_ifhcoutmulticastpkts
    multiplier: -1
  instances:
    group: interface
    chart_prefix: ifpacketsmulticast
    family: Network/Interface/Packet/Multicast
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifPacketsBroadcast
  title: Broadcast packets
  units: '{packet}/s'
  family: Network/Interface/Packet/Broadcast
  chart_type: line
  priority: 60015
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_bcast_rate
  - id: out
    rate_signal: dlink_ifhcoutbroadcastpkts
    multiplier: -1
  instances:
    group: interface
    chart_prefix: ifpacketsbroadcast
    family: Network/Interface/Packet/Broadcast
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifErrors
  title: Packets with errors
  units: '{error}/s'
  family: Network/Interface/Error/Total
  chart_type: line
  priority: 60016
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_errors_rate
  - id: out
    rate_signal: if_out_errors_rate
    multiplier: -1
  instances:
    group: interface
    chart_prefix: iferrors
    family: Network/Interface/Error/Total
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifDiscards
  title: Packets discarded
  units: '{discard}/s'
  family: Network/Interface/Discard
  chart_type: line
  priority: 60017
  shape: counters
  dimensions:
  - id: in
    rate_signal: if_in_discards_rate
  - id: out
    rate_signal: if_out_discards_rate
    multiplier: -1
  instances:
    group: interface
    chart_prefix: ifdiscards
    family: Network/Interface/Discard
    labels:
      interface: '{instance}'
