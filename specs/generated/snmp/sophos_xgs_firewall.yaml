version: 1
name: sophos_xgs_firewall
description: Sophos Firewall, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/sophos-xgs-firewall.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
