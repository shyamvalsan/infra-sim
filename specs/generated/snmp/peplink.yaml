version: 1
name: peplink
description: Peplink Router, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/peplink.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
signals:
  device_cpu_usage:
    base: 35.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  device_memory_total_bytes:
    base: 4294967296.0
    min: 4294967296.0
    max: 4294967296.0
    min_is_floor: true
    max_is_ceiling: true
