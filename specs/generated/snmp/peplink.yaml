contexts:
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
- id: snmp.device_prof_memory_total
  title: Total memory
  units: By
  family: System/Memory/Total
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: memory_total
    signal: device_memory_total_bytes
- id: snmp.device_prof_memory_usage
  title: Memory usage
  units: '%'
  family: System/Memory/Usage
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: memory_usage
    signal: device_memory_usage
- id: snmp.device_prof_peplink_deviceTemperatureCelsius
  title: Device temperature celsius
  units: Cel
  family: Hardware/Temperature/Value
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: peplink_devicetemperaturecel
    signal: peplink_peplink_devicetemperaturecelsius
- id: snmp.device_prof_peplink_deviceTemperatureFahrenheit
  title: Device temperature fahrenheit
  units: degF
  family: Hardware/Temperature/Value
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: peplink_devicetemperaturefah
    signal: peplink_peplink_devicetemperaturefahrenheit
- id: snmp.device_prof_peplink_devicePSUPercentage
  title: Device psu percentage
  units: '%'
  family: Hardware/Power/Usage
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: peplink_devicepsupercentage
    signal: peplink_peplink_devicepsupercentage
  instances:
    group: device_psu_id
    chart_prefix: peplink_devicepsupercentage
    family: Hardware/Power/Usage
    labels:
      device_psu_id: '{instance}'
- id: snmp.device_prof_devicePSUStatus
  title: Device psu status
  units: '{status}'
  family: Hardware/Power/Status
  chart_type: line
  priority: 60006
  shape: independent
  dimensions:
  - id: error
    signal: peplink_devicepsustatus_error
  - id: 'true'
    signal: peplink_devicepsustatus
  instances:
    group: device_psu_id
    chart_prefix: devicepsustatus
    family: Hardware/Power/Status
    labels:
      device_psu_id: '{instance}'
- id: snmp.device_prof_peplink_deviceFanSpeed
  title: Device fan speed
  units: '{revolution}/min'
  family: Hardware/Fan/Speed
  chart_type: line
  priority: 60007
  shape: independent
  dimensions:
  - id: peplink_devicefanspeed
    signal: peplink_peplink_devicefanspeed
  instances:
    group: device_fan_id
    chart_prefix: peplink_devicefanspeed
    family: Hardware/Fan/Speed
    labels:
      device_fan_id: '{instance}'
- id: snmp.device_prof_deviceFanStatus
  title: Device fan status
  units: '{status}'
  family: Hardware/Fan/Status
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: error
    signal: peplink_devicefanstatus_error
  - id: 'true'
    signal: peplink_devicefanstatus
  instances:
    group: device_fan_id
    chart_prefix: devicefanstatus
    family: Hardware/Fan/Status
    labels:
      device_fan_id: '{instance}'
- id: snmp.device_prof_devicePowerSourceStatus
  title: Power source status
  units: '{status}'
  family: Hardware/Power/Source/Status
  chart_type: line
  priority: 60009
  shape: independent
  dimensions:
  - id: nocabledetected
    signal: peplink_devicepowersourcestatus_nocabledetected
  - id: connected
    signal: peplink_devicepowersourcestatus
  instances:
    group: device_power_source_id
    chart_prefix: devicepowersourcestatus
    family: Hardware/Power/Source/Status
    labels:
      device_power_source_id: '{instance}'
- id: snmp.device_prof_peplink_linkThroughputIn
  title: Number of inbound packets discarded to free buffer space
  units: '{packet}/s'
  family: Network/Link/Throughput/Total/In
  chart_type: line
  priority: 60010
  shape: counters
  dimensions:
  - id: peplink_linkthroughputin
    rate_signal: peplink_peplink_linkthroughputin
  instances:
    group: link_conn_num
    chart_prefix: peplink_linkthroughputin
    family: Network/Link/Throughput/Total/In
    labels:
      link_conn_num: '{instance}'
- id: snmp.device_prof_peplink_linkThroughputOut
  title: Number of outbound packets discarded to free buffer space
  units: '{packet}/s'
  family: Network/Link/Throughput/Total/Out
  chart_type: line
  priority: 60011
  shape: counters
  dimensions:
  - id: peplink_linkthroughputout
    rate_signal: peplink_peplink_linkthroughputout
  instances:
    group: link_conn_num
    chart_prefix: peplink_linkthroughputout
    family: Network/Link/Throughput/Total/Out
    labels:
      link_conn_num: '{instance}'
- id: snmp.device_prof_peplink_linkDataTransferred
  title: Number of bytes transferred through
  units: By/s
  family: Network/Link/Data/Total
  chart_type: line
  priority: 60012
  shape: counters
  dimensions:
  - id: peplink_linkdatatransferred
    rate_signal: peplink_peplink_linkdatatransferred
  instances:
    group: link_conn_num
    chart_prefix: peplink_linkdatatransferred
    family: Network/Link/Data/Total
    labels:
      link_conn_num: '{instance}'
- id: snmp.device_prof_peplink_wanUsageThroughputIn
  title: Number of inbound packets discarded to free buffer space
  units: '{packet}/s'
  family: Network/WAN/Throughput/Total/In
  chart_type: line
  priority: 60013
  shape: counters
  dimensions:
  - id: peplink_wanusagethroughputin
    rate_signal: peplink_peplink_wanusagethroughputin
  instances:
    group: wan_usage_index
    chart_prefix: peplink_wanusagethroughputin
    family: Network/WAN/Throughput/Total/In
    labels:
      wan_usage_index: '{instance}'
- id: snmp.device_prof_peplink_wanUsageThroughputOut
  title: Number of outbound packets discarded to free buffer space
  units: '{packet}/s'
  family: Network/WAN/Throughput/Total/Out
  chart_type: line
  priority: 60014
  shape: counters
  dimensions:
  - id: peplink_wanusagethroughputou
    rate_signal: peplink_peplink_wanusagethroughputout
  instances:
    group: wan_usage_index
    chart_prefix: peplink_wanusagethroughputout
    family: Network/WAN/Throughput/Total/Out
    labels:
      wan_usage_index: '{instance}'
- id: snmp.device_prof_peplink_wanUsageDataTransferred
  title: Number of bytes transferred through
  units: By/s
  family: Network/WAN/Data/Total
  chart_type: line
  priority: 60015
  shape: counters
  dimensions:
  - id: peplink_wanusagedatatransfer
    rate_signal: peplink_peplink_wanusagedatatransferred
  instances:
    group: wan_usage_index
    chart_prefix: peplink_wanusagedatatransferred
    family: Network/WAN/Data/Total
    labels:
      wan_usage_index: '{instance}'
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60016
  shape: independent
  dimensions:
  - id: systemuptime
    signal: peplink_systemuptime
- id: snmp.device_prof_hrSystemNumUsers
  title: The number of user sessions for which this host is storing state information. A session is a collection of processes
    requiring a single act of user authentication and possibly subject to collective job control.
  units: '{session}'
  family: System/Activity/UserSession/Active
  chart_type: line
  priority: 60017
  shape: independent
  dimensions:
  - id: hrsystemnumusers
    signal: peplink_hrsystemnumusers
- id: snmp.device_prof_hrSystemProcesses
  title: The number of process contexts currently loaded or running on this system.
  units: '{process}'
  family: System/Activity/Process/Active
  chart_type: line
  priority: 60018
  shape: independent
  dimensions:
  - id: hrsystemprocesses
    signal: peplink_hrsystemprocesses
- id: snmp.device_prof_hrStorageSize
  title: SNMP metric hrStorageSize
  units: By
  family: hrstoragetable
  chart_type: line
  priority: 60019
  shape: independent
  dimensions:
  - id: hrstoragesize
    signal: peplink_hrstoragesize
  instances:
    group: storage_index
    chart_prefix: hrstoragesize
    family: hrstoragetable
    labels:
      storage_index: '{instance}'
- id: snmp.device_prof_hrStorageUsed
  title: SNMP metric hrStorageUsed
  units: By
  family: hrstoragetable
  chart_type: line
  priority: 60020
  shape: independent
  dimensions:
  - id: hrstorageused
    signal: peplink_hrstorageused
  instances:
    group: storage_index
    chart_prefix: hrstorageused
    family: hrstoragetable
    labels:
      storage_index: '{instance}'
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
