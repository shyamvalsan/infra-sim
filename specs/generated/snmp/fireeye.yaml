    signal: fireeye_iftotaloperstatus
  - id: down
    signal: fireeye_iftotaloperstatus_down
  - id: testing
    signal: fireeye_iftotaloperstatus_testing
  - id: unknown
    signal: fireeye_iftotaloperstatus_unknown
  - id: dormant
    signal: fireeye_iftotaloperstatus_dormant
  - id: notpresent
    signal: fireeye_iftotaloperstatus_notpresent
  - id: lowerlayerdown
    signal: fireeye_iftotaloperstatus_lowerlayerdown
