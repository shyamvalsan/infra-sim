version: 1
name: fireeye
description: Fireeye Network device, as Netdata's SNMP collector reports it. Generated from go.d/snmp.profiles/default/fireeye.yaml
  with its `extends` chain resolved. Contexts, units, families and metric names are the device's own; values are a plausible
  fiction.
