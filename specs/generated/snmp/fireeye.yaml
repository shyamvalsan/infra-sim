    signal: fireeye_hrsystemprocesses
- id: snmp.device_prof_cpu_usage
  title: The current CPU utilization
  units: '%'
  family: System/CPU/Usage
  chart_type: line
  priority: 60027
  shape: independent
  dimensions:
  - id: cpu_usage
    signal: device_cpu_usage
  instances:
    group: cpu_index
    chart_prefix: cpu_usage
    family: System/CPU/Usage
    labels:
      cpu_index: '{instance}'
