contexts:
- id: snmp.device_prof_feProductLicenseActive
  title: Whether the product license is active
  units: '{status}'
  family: System/License/Status
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_feproductlicenseactive
  - id: '1'
    signal: fireeye_feproductlicenseactive_1
- id: snmp.device_prof_feIsTemperatureNormal
  title: Whether or not the temperature is normal
  units: '{status}'
  family: Hardware/Temperature/Status
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_feistemperaturenormal
  - id: '1'
    signal: fireeye_feistemperaturenormal_1
- id: snmp.device_prof_feRaidIsHealthy
  title: Whether or not RAID is healthy overall
  units: '{status}'
  family: Hardware/RAID/Status
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_feraidishealthy
  - id: '1'
    signal: fireeye_feraidishealthy_1
- id: snmp.device_prof_fePhysicalDiskIsHealthy
  title: Whether a physical disk is healthy
  units: '{status}'
  family: Hardware/Disk/Status
  chart_type: line
  priority: 60003
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_fephysicaldiskishealthy
  - id: '1'
    signal: fireeye_fephysicaldiskishealthy_1
  instances:
    group: fe_physical_disk_name
    chart_prefix: fephysicaldiskishealthy
    family: Hardware/Disk/Status
    labels:
      fe_physical_disk_name: '{instance}'
- id: snmp.device_prof_fePowerSupplyOverallIsHealthy
  title: Whether or not power supply is healthy overall
  units: '{status}'
  family: Hardware/Power/Status
  chart_type: line
  priority: 60004
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_fepowersupplyoverallishealthy
  - id: '1'
    signal: fireeye_fepowersupplyoverallishealthy_1
- id: snmp.device_prof_feFanOverallIsHealthy
  title: Whether or not fan is healthy overall
  units: '{status}'
  family: Hardware/Fan/Status
  chart_type: line
  priority: 60005
  shape: independent
  dimensions:
  - id: '2'
    signal: fireeye_fefanoverallishealthy
  - id: '1'
    signal: fireeye_fefanoverallishealthy_1
- id: snmp.device_prof_feTotalEmailCount
  title: Count of all emails coming into postfix including those without URL or attachment
  units: '{email}/s'
  family: Security/Email/Total
  chart_type: line
  priority: 60006
  shape: counters
  dimensions:
  - id: fetotalemailcount
    rate_signal: fireeye_fetotalemailcount
- id: snmp.device_prof_feInfectedEmailCount
  title: Count of all emails determined to be malicious
  units: '{email}/s'
  family: Security/Email/Malicious
  chart_type: line
  priority: 60007
  shape: counters
  dimensions:
  - id: feinfectedemailcount
    rate_signal: fireeye_feinfectedemailcount
- id: snmp.device_prof_feAnalyzedEmailCount
  title: Cumulative count of all emails analyzed
  units: '{email}/s'
  family: Security/Email/Analyzed
  chart_type: line
  priority: 60008
  shape: counters
  dimensions:
  - id: feanalyzedemailcount
    rate_signal: fireeye_feanalyzedemailcount
- id: snmp.device_prof_feTotalUrlCount
  title: Count of all URLs received whether processed or not
  units: '{url}/s'
  family: Security/URL/Total
  chart_type: line
  priority: 60009
  shape: counters
  dimensions:
  - id: fetotalurlcount
    rate_signal: fireeye_fetotalurlcount
- id: snmp.device_prof_feInfectedUrlCount
  title: Count of all URLs determined to be malicious
  units: '{url}/s'
  family: Security/URL/Malicious
  chart_type: line
  priority: 60010
  shape: counters
  dimensions:
  - id: feinfectedurlcount
    rate_signal: fireeye_feinfectedurlcount
- id: snmp.device_prof_feAnalyzedUrlCount
  title: Cumulative count of all URLs analyzed
  units: '{url}/s'
  family: Security/URL/Analyzed
  chart_type: line
  priority: 60011
  shape: counters
  dimensions:
  - id: feanalyzedurlcount
    rate_signal: fireeye_feanalyzedurlcount
- id: snmp.device_prof_feTotalAttachmentCount
  title: Count of all attachments received whether processed or not
  units: '{attachment}/s'
  family: Security/Attachment/Total
  chart_type: line
  priority: 60012
  shape: counters
  dimensions:
  - id: fetotalattachmentcount
    rate_signal: fireeye_fetotalattachmentcount
- id: snmp.device_prof_feInfectedAttachmentCount
  title: Count of all attachments determined to be malicious
  units: '{attachment}/s'
  family: Security/Attachment/Malicious
  chart_type: line
  priority: 60013
  shape: counters
  dimensions:
  - id: feinfectedattachmentcount
    rate_signal: fireeye_feinfectedattachmentcount
- id: snmp.device_prof_feAnalyzedAttachmentCount
  title: Cumulative count of all attachments analyzed for maliciousness
  units: '{attachment}/s'
  family: Security/Attachment/Analyzed
  chart_type: line
  priority: 60014
  shape: counters
  dimensions:
  - id: feanalyzedattachmentcount
    rate_signal: fireeye_feanalyzedattachmentcount
- id: snmp.device_prof_feeQuarantineUsage
  title: Consumed capacity as percentage of max capacity
  units: '%'
  family: Security/Quarantine/Usage
  chart_type: line
  priority: 60015
  shape: independent
  dimensions:
  - id: feequarantineusage
    signal: fireeye_feequarantineusage
- id: snmp.device_prof_feDeferredEmailCount
  title: Count of deferred emails representing current snapshot value
  units: '{email}'
  family: Security/Email/Queue/Deferred
  chart_type: line
  priority: 60016
  shape: independent
  dimensions:
  - id: fedeferredemailcount
    signal: fireeye_fedeferredemailcount
- id: snmp.device_prof_feHoldQueueEmailCount
  title: Count of emails in the hold queue representing current snapshot value
  units: '{email}'
  family: Security/Email/Queue/Hold
  chart_type: line
  priority: 60017
  shape: independent
  dimensions:
  - id: feholdqueueemailcount
    signal: fireeye_feholdqueueemailcount
- id: snmp.device_prof_feTotalObjectAnalyzedCount
  title: Count of all objects analyzed including all children of any samples
  units: '{object}/s'
  family: Security/Object/Analyzed
  chart_type: line
  priority: 60018
  shape: counters
  dimensions:
  - id: fetotalobjectanalyzedcount
    rate_signal: fireeye_fetotalobjectanalyzedcount
- id: snmp.device_prof_feTotalMaliciousObjectCount
  title: Count of all malicious samples detected
  units: '{object}/s'
  family: Security/Object/Malicious
  chart_type: line
  priority: 60019
  shape: counters
  dimensions:
  - id: fetotalmaliciousobjectcount
    rate_signal: fireeye_fetotalmaliciousobjectcount
- id: snmp.device_prof_systemUptime
  title: Time since the system was last rebooted or powered on.
  units: s
  family: System/Uptime
  chart_type: line
  priority: 60020
  shape: independent
  dimensions:
  - id: systemuptime
    signal: fireeye_systemuptime
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60021
  shape: independent
  dimensions:
  - id: ifnumber
    signal: fireeye_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60022
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60023
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60024
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_hrSystemNumUsers
  title: The number of user sessions for which this host is storing state information. A session is a collection of processes
    requiring a single act of user authentication and possibly subject to collective job control.
  units: '{session}'
  family: System/Activity/UserSession/Active
  chart_type: line
  priority: 60025
  shape: independent
  dimensions:
  - id: hrsystemnumusers
    signal: fireeye_hrsystemnumusers
- id: snmp.device_prof_hrSystemProcesses
  title: The number of process contexts currently loaded or running on this system.
  units: '{process}'
  family: System/Activity/Process/Active
  chart_type: line
  priority: 60026
  shape: independent
  dimensions:
