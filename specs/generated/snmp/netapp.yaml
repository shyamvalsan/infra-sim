contexts:
- id: snmp.device_prof_cfInterconnectStatus
  title: The current status of the interconnect
  units: '{status}'
  family: System/ClusterFailover/Interconnect/Status
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: cfinterconnectstatus
    signal: netapp_cfinterconnectstatus
- id: snmp.device_prof_miscCacheAge
  title: Age in minutes of the oldest read-only blocks in the buffer cache
  units: min
  family: Storage/Cache/Buffer/Age
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: misccacheage
    signal: netapp_misccacheage
- id: snmp.device_prof_ncHttpActiveCliConns
  title: Number of currently active TCP/IP connections to HTTP clients
  units: '{connection}'
  family: Network/HTTP/Connection/Active
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: nchttpactivecliconns
    signal: netapp_nchttpactivecliconns
- id: snmp.device_prof_extcache64Hits
  title: Number of wafl buffers read from the external cache
  units: '{buffer}/s'
  family: Storage/Cache/External/Hit
  chart_type: line
  priority: 60003
  shape: counters
  dimensions:
  - id: extcache64hits
    rate_signal: netapp_extcache64hits
- id: snmp.device_prof_svTotalTransMBs
  title: Transfer size
  units: By/s
  family: Storage/SnapVault/Transfer/Throughput
  chart_type: line
  priority: 60004
  shape: counters
  dimensions:
  - id: svtotaltransmbs
    rate_signal: netapp_svtotaltransmbs
  instances:
    group: sv_index
    chart_prefix: svtotaltransmbs
    family: Storage/SnapVault/Transfer/Throughput
    labels:
      sv_index: '{instance}'
- id: snmp.device_prof_svTotalSuccesses
  title: Successful transfers
  units: '{transfer}/s'
  family: Storage/SnapVault/Transfer/Success
  chart_type: line
  priority: 60005
  shape: counters
  dimensions:
  - id: svtotalsuccesses
    rate_signal: netapp_svtotalsuccesses
  instances:
    group: sv_index
    chart_prefix: svtotalsuccesses
    family: Storage/SnapVault/Transfer/Success
    labels:
      sv_index: '{instance}'
- id: snmp.device_prof_svTotalFailures
  title: Failed or aborted transfers
  units: '{transfer}/s'
  family: Storage/SnapVault/Transfer/Failure
  chart_type: line
  priority: 60006
  shape: counters
  dimensions:
  - id: svtotalfailures
    rate_signal: netapp_svtotalfailures
  instances:
    group: sv_index
    chart_prefix: svtotalfailures
    family: Storage/SnapVault/Transfer/Failure
    labels:
      sv_index: '{instance}'
- id: snmp.device_prof_svLag
  title: Shows how far away the destination is from the source.
  units: cs
  family: Storage/SnapVault/Sync/Lag
  chart_type: line
  priority: 60007
  shape: independent
  dimensions:
  - id: svlag
    signal: netapp_svlag
  instances:
    group: sv_index
    chart_prefix: svlag
    family: Storage/SnapVault/Sync/Lag
    labels:
      sv_index: '{instance}'
- id: snmp.device_prof_svStatus
  title: Current transfer status
  units: '{status}'
  family: Storage/SnapVault/Transfer/Status
  chart_type: line
  priority: 60008
  shape: independent
  dimensions:
  - id: idle
    signal: netapp_svstatus
  - id: paused
    signal: netapp_svstatus_paused
  - id: transferring
    signal: netapp_svstatus_transferring
  - id: pending
    signal: netapp_svstatus_pending
  - id: aborting
    signal: netapp_svstatus_aborting
  - id: quiescing
    signal: netapp_svstatus_quiescing
  - id: resyncing
    signal: netapp_svstatus_resyncing
  instances:
    group: sv_index
    chart_prefix: svstatus
    family: Storage/SnapVault/Transfer/Status
    labels:
      sv_index: '{instance}'
- id: snmp.device_prof_svState
  title: Current state of the SnapVault relationship
  units: '{status}'
