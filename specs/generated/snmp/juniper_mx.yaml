contexts:
- id: snmp.device_prof_ifNumber
  title: Number of network interfaces regardless of their current state present on this system
  units: '{interface}'
  family: Network/Interface/Count
  chart_type: line
  priority: 60000
  shape: independent
  dimensions:
  - id: ifnumber
    signal: juniper_mx_ifnumber
- id: snmp.device_prof_ifAdminStatus
  title: Current administrative state of the interface
  units: '{status}'
  family: Network/Interface/Status/Admin
  chart_type: line
  priority: 60001
  shape: independent
  dimensions:
  - id: up
    signal: if_admin_status
  - id: down
    signal: if_admin_status_down
  - id: testing
    signal: if_admin_status_testing
  instances:
    group: interface
    chart_prefix: ifadminstatus
    family: Network/Interface/Status/Admin
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifOperStatus
  title: Current operational state of the interface
  units: '{status}'
  family: Network/Interface/Status/Operational
  chart_type: line
  priority: 60002
  shape: independent
  dimensions:
  - id: up
    signal: if_oper_status
  - id: down
    signal: if_oper_status_down
  - id: testing
    signal: if_oper_status_testing
  - id: unknown
    signal: if_oper_status_unknown
  - id: dormant
    signal: if_oper_status_dormant
  - id: notpresent
    signal: if_oper_status_notpresent
  - id: lowerlayerdown
    signal: if_oper_status_lowerlayerdown
  instances:
    group: interface
    chart_prefix: ifoperstatus
    family: Network/Interface/Status/Operational
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ifHighSpeed
  title: Estimate of the interface's current bandwidth
  units: bit/s
  family: Network/Interface/Speed
  chart_type: area
  priority: 60003
  shape: counters
  dimensions:
  - id: ifhighspeed
    rate_signal: if_speed
  instances:
    group: interface
    chart_prefix: ifhighspeed
    family: Network/Interface/Speed
    labels:
      interface: '{instance}'
- id: snmp.device_prof_ipSystemStatsHCInOctets
  title: Octets received in input IP datagrams
  units: bit/s
  family: Network/IP/Traffic/Total/In
  chart_type: area
  priority: 60004
  shape: counters
  dimensions:
  - id: ipsystemstatshcinoctets
    rate_signal: juniper_mx_ipsystemstatshcinoctets
  instances:
    group: ipversion
    chart_prefix: ipsystemstatshcinoctets
    family: Network/IP/Traffic/Total/In
    labels:
      ipversion: '{instance}'
- id: snmp.device_prof_ipSystemStatsHCOutOctets
  title: The total number of octets in IP datagrams delivered to the lower layers for transmission
  units: bit/s
  family: Network/IP/Traffic/Total/Out
  chart_type: area
  priority: 60005
  shape: counters
  dimensions:
  - id: ipsystemstatshcoutoctets
    rate_signal: juniper_mx_ipsystemstatshcoutoctets
  instances:
    group: ipversion
    chart_prefix: ipsystemstatshcoutoctets
    family: Network/IP/Traffic/Total/Out
    labels:
      ipversion: '{instance}'
- id: snmp.device_prof_ipSystemStatsHCInMcastOctets
  title: The total number of octets received in IP multicast datagrams
  units: bit/s
  family: Network/IP/Traffic/Multicast/In
  chart_type: area
