version: 1
name: amazon-cloudwatch
description: Amazon CloudWatch metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Amazon CloudWatch node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  amazon_cloudwatch_collector_api_calls_calls:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  amazon_cloudwatch_collector_metric_requests_requests:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  amazon_cloudwatch_collector_queries_queries:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: cloudwatch.collector_api_calls
  title: CloudWatch API calls issued in the interval since the preceding successfully committed collector
    frame.
  units: calls
  family: collector
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    account_id: sim-account_id-1
    region: sim-region-1
    operation: sim-operation-1
  dimensions:
  - id: calls
    signal: amazon_cloudwatch_collector_api_calls_calls
- id: cloudwatch.collector_metric_requests
  title: Calculated billable `GetMetricData` metric requests submitted in the interval since the preceding
    successfully
  units: requests
  family: collector
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    account_id: sim-account_id-1
    region: sim-region-1
  dimensions:
  - id: requests
    signal: amazon_cloudwatch_collector_metric_requests_requests
- id: cloudwatch.collector_queries
  title: Raw `MetricDataQuery` items submitted in the interval since the preceding successfully committed
    collector fra
  units: queries
  family: collector
  chart_type: line
  priority: 60003
  shape: independent
  labels:
    account_id: sim-account_id-1
    region: sim-region-1
    profile: sim-profile-1
  dimensions:
  - id: queries
    signal: amazon_cloudwatch_collector_queries_queries
