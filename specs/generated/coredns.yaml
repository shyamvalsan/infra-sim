version: 1
name: coredns
description: CoreDNS metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real CoreDNS node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
