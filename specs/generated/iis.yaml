contexts:
- id: iis.website_traffic
  title: Website traffic
  units: bytes/s
  family: website
  chart_type: area
  priority: 60001
  shape: counters
  labels:
    website: sim-website-1
  dimensions:
  - id: received
    rate_signal: iis_website_traffic_received
  - id: sent
    rate_signal: iis_website_traffic_sent
- id: iis.website_requests_rate
  title: Website requests rate
  units: requests/s
  family: website
  chart_type: line
  priority: 60002
  shape: counters
  labels:
    website: sim-website-1
  dimensions:
  - id: requests
    rate_signal: iis_website_requests_rate_requests
- id: iis.website_requests_by_type_rate
  title: Website requests rate
  units: requests/s
  family: website
  chart_type: stacked
  priority: 60003
  shape: counters
  labels:
    website: sim-website-1
  dimensions:
  - id: options
    rate_signal: iis_website_requests_by_type_rate_options
  - id: get
    rate_signal: iis_website_requests_by_type_rate_get
  - id: post
    rate_signal: iis_website_requests_by_type_rate_post
  - id: head
    rate_signal: iis_website_requests_by_type_rate_head
  - id: put
    rate_signal: iis_website_requests_by_type_rate_put
  - id: delete
    rate_signal: iis_website_requests_by_type_rate_delete
  - id: trace
    rate_signal: iis_website_requests_by_type_rate_trace
  - id: move
    rate_signal: iis_website_requests_by_type_rate_move
  - id: copy
    rate_signal: iis_website_requests_by_type_rate_copy
  - id: mkcol
    rate_signal: iis_website_requests_by_type_rate_mkcol
  - id: propfind
    rate_signal: iis_website_requests_by_type_rate_propfind
  - id: proppatch
    rate_signal: iis_website_requests_by_type_rate_proppatch
  - id: search
    rate_signal: iis_website_requests_by_type_rate_search
  - id: lock
    rate_signal: iis_website_requests_by_type_rate_lock
  - id: unlock
    rate_signal: iis_website_requests_by_type_rate_unlock
  - id: other
    rate_signal: iis_website_requests_by_type_rate_other
- id: iis.website_active_connections_count
  title: Website active connections
  units: connections
  family: website
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    website: sim-website-1
  dimensions:
  - id: active
    signal: iis_website_active_connections_count_active
- id: iis.website_users_count
  title: Website users with pending requests
  units: users
  family: website
  chart_type: stacked
  priority: 60005
  shape: independent
  labels:
    website: sim-website-1
  dimensions:
  - id: anonymous
    signal: iis_website_users_count_anonymous
  - id: non_anonymous
    signal: iis_website_users_count_non_anonymous
- id: iis.website_connection_attempts_rate
  title: Website connections attempts
  units: attempts/s
  family: website
  chart_type: line
  priority: 60006
  shape: counters
  labels:
    website: sim-website-1
  dimensions:
