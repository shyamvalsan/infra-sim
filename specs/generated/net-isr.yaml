version: 1
name: net-isr
description: net.isr metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real net.isr node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  net_isr_softnet_stat_dispatched:
    base: 260.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  net_isr_softnet_stat_hybrid_dispatched:
    base: 260.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  net_isr_softnet_stat_qdrops:
    base: 0.0
    min: 0.0
    max: 1000000.0
  net_isr_softnet_stat_queued:
    base: 260.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: cpu.softnet_stat
  title: Per CPU netisr statistics
  units: events/s
  family: softnet
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: dispatched
    rate_signal: net_isr_softnet_stat_dispatched
  - id: hybrid_dispatched
    rate_signal: net_isr_softnet_stat_hybrid_dispatched
  - id: qdrops
    rate_signal: net_isr_softnet_stat_qdrops
  - id: queued
    rate_signal: net_isr_softnet_stat_queued
