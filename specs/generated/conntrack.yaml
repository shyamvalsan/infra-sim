contexts:
- id: netfilter.conntrack_new
  title: Connection Tracker New Connections
  units: connections/s
  family: conntrack
  chart_type: line
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: new
    rate_signal: conntrack_conntrack_new_new
  - id: ignore
    rate_signal: conntrack_conntrack_new_ignore
  - id: invalid
    rate_signal: conntrack_conntrack_new_invalid
- id: netfilter.conntrack_changes
  title: Connection Tracker Changes
  units: changes/s
  family: conntrack
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: inserted
    rate_signal: conntrack_conntrack_changes_inserted
  - id: deleted
    rate_signal: conntrack_conntrack_changes_deleted
  - id: delete_list
    rate_signal: conntrack_conntrack_changes_delete_list
- id: netfilter.conntrack_expect
  title: Connection Tracker Expectations
  units: expectations/s
  family: conntrack
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: created
    rate_signal: conntrack_conntrack_expect_created
  - id: deleted
    rate_signal: conntrack_conntrack_expect_deleted
  - id: new
    rate_signal: conntrack_conntrack_expect_new
- id: netfilter.conntrack_search
  title: Connection Tracker Searches
  units: searches/s
  family: conntrack
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: searched
    rate_signal: conntrack_conntrack_search_searched
  - id: restarted
    rate_signal: conntrack_conntrack_search_restarted
  - id: found
    rate_signal: conntrack_conntrack_search_found
- id: netfilter.conntrack_errors
  title: Connection Tracker Errors
  units: events/s
  family: conntrack
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: icmp_error
    rate_signal: conntrack_conntrack_errors_icmp_error
  - id: error_failed
    rate_signal: conntrack_conntrack_errors_error_failed
  - id: drop
    rate_signal: conntrack_conntrack_errors_drop
  - id: early_drop
    rate_signal: conntrack_conntrack_errors_early_drop
