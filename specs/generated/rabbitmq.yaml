- id: rabbitmq.messages_count
  title: Messages
  units: messages
  family: messages
  chart_type: stacked
  priority: 60001
  shape: independent
  labels:
    cluster_id: sim-cluster_id-1
    cluster_name: sim-cluster_name-1
  dimensions:
  - id: ready
    signal: rabbitmq_messages_count_ready
  - id: unacknowledged
    signal: rabbitmq_messages_count_unacknowledged
- id: rabbitmq.messages_rate
  title: Messages
  units: messages/s
  family: messages
  chart_type: line
  priority: 60002
  shape: counters
  labels:
