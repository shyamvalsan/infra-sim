version: 1
name: hardware-information-collected-from-kernel-ring
description: Hardware information collected from kernel ring. metrics, generated from Netdata's own collector
  metadata so the contexts, units and dimension names match what a real Hardware information collected
  from kernel ring. node reports. Signals are independent and plausible rather than causally coupled -
  see scripts/sync-integrations.py.
signals:
  hardware_information_collected_from_kernel_ring_temperature_a_dimension_per_core:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: cpu.temperature
  title: Core temperature
  units: Celcius
  family: temperature
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: a dimension per core
    signal: hardware_information_collected_from_kernel_ring_temperature_a_dimension_per_core
