version: 1
name: dovecot
description: Dovecot metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Dovecot node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  dovecot_session_active:
    base: 64.0
    min: 0.0
    max: 100000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_logins_logins:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_auth_ok:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_auth_failed:
    base: 0.0
    min: 0.0
    max: 1000000.0
  dovecot_commands_commands:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_context_switches_voluntary:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_io_read:
    base: 480000.0
    min: 0.0
    max: 900000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_io_write:
    base: 480000.0
    min: 0.0
    max: 900000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_net_read:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_net_write:
    base: 18000.0
    min: 0.0
    max: 10000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_syscalls_read:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_syscalls_write:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_lookup_path:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_lookup_attr:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_cache_hits:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_auth_cache_hits:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  dovecot_auth_cache_misses:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: dovecot.session
  title: Dovecot Active Sessions
  units: sessions
  family: session
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: dovecot_session_active
- id: dovecot.logins
  title: Dovecot Logins
  units: logins
  family: logins
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: logins
    signal: dovecot_logins_logins
- id: dovecot.auth
  title: Dovecot Authentications
  units: attempts/s
  family: auth
  chart_type: stacked
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: ok
    rate_signal: dovecot_auth_ok
  - id: failed
    rate_signal: dovecot_auth_failed
- id: dovecot.commands
  title: Dovecot Commands
  units: commands
  family: commands
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: commands
    signal: dovecot_commands_commands
- id: dovecot.context_switches
  title: Dovecot Context Switches
  units: switches/s
  family: context
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: voluntary
    rate_signal: dovecot_context_switches_voluntary
- id: dovecot.io
  title: Dovecot Disk I/O
  units: KiB/s
  family: io
  chart_type: area
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: read
    signal: dovecot_io_read
  - id: write
    signal: dovecot_io_write
- id: dovecot.net
  title: Dovecot Network Bandwidth
  units: kilobits/s
  family: net
  chart_type: area
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: read
    rate_signal: dovecot_net_read
  - id: write
    rate_signal: dovecot_net_write
- id: dovecot.syscalls
  title: Dovecot Number of SysCalls
  units: syscalls/s
  family: syscalls
  chart_type: line
  priority: 60008
  shape: counters
  labels: {}
  dimensions:
  - id: read
    rate_signal: dovecot_syscalls_read
  - id: write
    rate_signal: dovecot_syscalls_write
- id: dovecot.lookup
  title: Dovecot Lookups
  units: lookups/s
  family: lookup
  chart_type: stacked
  priority: 60009
  shape: counters
  labels: {}
  dimensions:
  - id: path
    rate_signal: dovecot_lookup_path
  - id: attr
    rate_signal: dovecot_lookup_attr
- id: dovecot.cache
  title: Dovecot Cache Hits
  units: hits/s
  family: cache
  chart_type: line
  priority: 60010
  shape: counters
  labels: {}
  dimensions:
  - id: hits
    rate_signal: dovecot_cache_hits
- id: dovecot.auth_cache
  title: Dovecot Authentication Cache
  units: requests/s
  family: auth
  chart_type: stacked
  priority: 60011
  shape: counters
  labels: {}
  dimensions:
  - id: hits
    rate_signal: dovecot_auth_cache_hits
  - id: misses
    rate_signal: dovecot_auth_cache_misses
