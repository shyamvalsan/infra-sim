version: 1
name: oracle-db
description: Oracle DB metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Oracle DB node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
