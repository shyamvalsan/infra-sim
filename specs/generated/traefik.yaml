contexts:
- id: traefik.entrypoint_requests
  title: Processed HTTP requests
  units: requests/s
  family: entrypoint
  chart_type: stacked
  priority: 60001
  shape: counters
  labels: {}
  dimensions:
  - id: 1xx
    rate_signal: traefik_entrypoint_requests_1xx
  - id: 2xx
    rate_signal: traefik_entrypoint_requests_2xx
  - id: 3xx
    rate_signal: traefik_entrypoint_requests_3xx
  - id: 4xx
    rate_signal: traefik_entrypoint_requests_4xx
  - id: 5xx
    rate_signal: traefik_entrypoint_requests_5xx
- id: traefik.entrypoint_request_duration_average
  title: Average HTTP request processing time
  units: milliseconds
  family: entrypoint
  chart_type: stacked
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: 1xx
    signal: traefik_entrypoint_request_duration_average_1xx
  - id: 2xx
    signal: traefik_entrypoint_request_duration_average_2xx
  - id: 3xx
    signal: traefik_entrypoint_request_duration_average_3xx
  - id: 4xx
    signal: traefik_entrypoint_request_duration_average_4xx
  - id: 5xx
    signal: traefik_entrypoint_request_duration_average_5xx
- id: traefik.entrypoint_open_connections
  title: Open connections
  units: connections
  family: entrypoint
  chart_type: stacked
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: a dimension per HTTP method
    signal: traefik_entrypoint_open_connections_a_dimension_per_http_method
