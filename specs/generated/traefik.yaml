version: 1
name: traefik
description: Traefik metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Traefik node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  traefik_entrypoint_requests_1xx:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
