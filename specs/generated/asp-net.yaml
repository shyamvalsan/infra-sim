contexts:
- id: aspnet.application_restarts
  title: Number of times the application has been restarted.
  units: restarts
  family: application
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: restarts
    signal: asp_net_application_restarts_restarts
- id: aspnet.worker_process_restarts
