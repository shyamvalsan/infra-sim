version: 1
name: asp-net
description: ASP.NET metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real ASP.NET node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
