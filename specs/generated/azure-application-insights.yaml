version: 1
name: azure-application-insights
description: 'Azure Application Insights as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.Insights/components) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
signals:
  application_insights_availability_percentage_average:
    base: 34.0
    min: 0.0
    max: 100.0
    max_is_ceiling: true
    noise:
      kind: gauss
      sigma: 0.18
  application_insights_availability_tests_tests:
