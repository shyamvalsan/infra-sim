version: 1
name: ebpf-mdflush
description: eBPF MDflush metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real eBPF MDflush node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  ebpf_mdflush_mdstat_flush_disk:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: mdstat.mdstat_flush
  title: MD flushes
  units: flushes
  family: mdstat
  chart_type: stacked
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: disk
    signal: ebpf_mdflush_mdstat_flush_disk
