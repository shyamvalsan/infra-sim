version: 1
name: power-capping
description: Power Capping metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Power Capping node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  power_capping_powercap_intel_rapl_zone_power:
    base: 145.0
    min: 0.0
    max: 2000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  power_capping_powercap_intel_rapl_subzones_dram:
    base: 145.0
    min: 0.0
    max: 2000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  power_capping_powercap_intel_rapl_subzones_core:
    base: 145.0
    min: 0.0
    max: 2000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  power_capping_powercap_intel_rapl_subzones_uncore:
    base: 145.0
    min: 0.0
    max: 2000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: cpu.powercap_intel_rapl_zone
  title: Intel RAPL Zone Power Consumption
  units: Watts
  family: powercap
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: Power
    signal: power_capping_powercap_intel_rapl_zone_power
- id: cpu.powercap_intel_rapl_subzones
  title: Intel RAPL Subzones Power Consumption
  units: Watts
  family: powercap
  chart_type: line
  priority: 60002
  shape: independent
  labels: {}
  dimensions:
  - id: dram
    signal: power_capping_powercap_intel_rapl_subzones_dram
  - id: core
    signal: power_capping_powercap_intel_rapl_subzones_core
  - id: uncore
    signal: power_capping_powercap_intel_rapl_subzones_uncore
