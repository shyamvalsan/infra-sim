version: 1
name: web-server-log-files
description: Web server log files metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real Web server log files node reports. Signals are independent
  and plausible rather than causally coupled - see scripts/sync-integrations.py.
