version: 1
name: azure-stream-analytics-job
description: Azure Stream Analytics Job metrics, generated from Netdata's own collector metadata so the
  contexts, units and dimension names match what a real Azure Stream Analytics Job node reports. Signals
  are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  azure_stream_analytics_job_stream_analytics_event_flow_in:
    base: 260.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  azure_stream_analytics_job_stream_analytics_event_flow_out:
    base: 260.0
    min: 0.0
