contexts:
- id: clickhouse.connections
  title: Connections
  units: connections
  family: connections
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: tcp
    signal: clickhouse_connections_tcp
  - id: http
    signal: clickhouse_connections_http
  - id: mysql
    signal: clickhouse_connections_mysql
  - id: postgresql
    signal: clickhouse_connections_postgresql
  - id: interserver
    signal: clickhouse_connections_interserver
- id: clickhouse.slow_reads
  title: Slow reads from a file
  units: reads/s
  family: slow
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: slow
    rate_signal: clickhouse_slow_reads_slow
- id: clickhouse.read_backoff
  title: Read backoff events
  units: events/s
  family: read
  chart_type: line
