  - id: watch
    rate_signal: beanstalk_commands_rate_watch
  - id: ignore
    rate_signal: beanstalk_commands_rate_ignore
  - id: delete
    rate_signal: beanstalk_commands_rate_delete
  - id: bury
    rate_signal: beanstalk_commands_rate_bury
  - id: kick
    rate_signal: beanstalk_commands_rate_kick
  - id: stats
