contexts:
- id: beanstalk.current_jobs
  title: Current Jobs
  units: jobs
  family: current
  chart_type: stacked
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: ready
    signal: beanstalk_current_jobs_ready
  - id: buried
    signal: beanstalk_current_jobs_buried
  - id: urgent
    signal: beanstalk_current_jobs_urgent
  - id: delayed
    signal: beanstalk_current_jobs_delayed
  - id: reserved
    signal: beanstalk_current_jobs_reserved
- id: beanstalk.jobs_rate
  title: Jobs Rate
  units: jobs/s
  family: jobs
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: created
    rate_signal: beanstalk_jobs_rate_created
- id: beanstalk.jobs_timeouts
  title: Timed Out Jobs
  units: jobs/s
  family: jobs
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: timeouts
    rate_signal: beanstalk_jobs_timeouts_timeouts
- id: beanstalk.current_tubes
  title: Current Tubes
  units: tubes
  family: current
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: tubes
    signal: beanstalk_current_tubes_tubes
- id: beanstalk.commands_rate
  title: Commands Rate
  units: commands/s
  family: commands
  chart_type: stacked
  priority: 60005
  shape: counters
  labels: {}
