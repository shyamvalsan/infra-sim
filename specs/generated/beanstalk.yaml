  - id: stats-job
    rate_signal: beanstalk_commands_rate_stats_job
  - id: stats-tube
    rate_signal: beanstalk_commands_rate_stats_tube
  - id: list-tubes
    rate_signal: beanstalk_commands_rate_list_tubes
  - id: list-tube-used
    rate_signal: beanstalk_commands_rate_list_tube_used
  - id: list-tubes-watched
    rate_signal: beanstalk_commands_rate_list_tubes_watched
  - id: pause-tube
    rate_signal: beanstalk_commands_rate_pause_tube
- id: beanstalk.current_connections
  title: Current Connections
  units: connections
  family: current
  chart_type: line
  priority: 60006
  shape: independent
  labels: {}
  dimensions:
  - id: open
    signal: beanstalk_current_connections_open
  - id: producers
    signal: beanstalk_current_connections_producers
  - id: workers
    signal: beanstalk_current_connections_workers
  - id: waiting
    signal: beanstalk_current_connections_waiting
- id: beanstalk.connections_rate
  title: Connections Rate
  units: connections/s
  family: connections
  chart_type: area
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
