version: 1
name: beanstalk
description: Beanstalk metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Beanstalk node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
