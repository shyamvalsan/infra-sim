version: 1
name: openldap
description: OpenLDAP metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real OpenLDAP node reports. Signals are independent and plausible rather
  than causally coupled - see scripts/sync-integrations.py.
signals:
  openldap_current_connections_active:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_connections_connections:
    base: 45.0
    min: 0.0
    max: 500000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_traffic_sent:
    base: 2400000.0
    min: 0.0
    max: 5000000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_entries_sent:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_referrals_sent:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_completed:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_initiated:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_bind:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_search:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_unbind:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_add:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_delete:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_modify:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_operations_by_type_compare:
    base: 1450.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_waiters_write:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  openldap_waiters_read:
    base: 130.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: openldap.current_connections
  title: Current Connections
  units: connections
  family: current
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: openldap_current_connections_active
- id: openldap.connections
  title: Connections
  units: connections/s
  family: connections
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: connections
    rate_signal: openldap_connections_connections
- id: openldap.traffic
  title: Traffic
  units: bytes/s
  family: traffic
  chart_type: area
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: sent
    rate_signal: openldap_traffic_sent
- id: openldap.entries
  title: Entries
  units: entries/s
  family: entries
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: sent
    rate_signal: openldap_entries_sent
- id: openldap.referrals
  title: Referrals
  units: referrals/s
  family: referrals
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: sent
    rate_signal: openldap_referrals_sent
- id: openldap.operations
  title: Operations
  units: operations/s
  family: operations
  chart_type: line
  priority: 60006
  shape: counters
  labels: {}
  dimensions:
  - id: completed
    rate_signal: openldap_operations_completed
  - id: initiated
    rate_signal: openldap_operations_initiated
- id: openldap.operations_by_type
  title: Operations by Typ
  units: operations/s
  family: operations
  chart_type: stacked
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: bind
    rate_signal: openldap_operations_by_type_bind
  - id: search
    rate_signal: openldap_operations_by_type_search
  - id: unbind
    rate_signal: openldap_operations_by_type_unbind
  - id: add
    rate_signal: openldap_operations_by_type_add
  - id: delete
    rate_signal: openldap_operations_by_type_delete
  - id: modify
    rate_signal: openldap_operations_by_type_modify
  - id: compare
    rate_signal: openldap_operations_by_type_compare
- id: openldap.waiters
  title: Waiters
  units: waiters/s
  family: waiters
  chart_type: line
  priority: 60008
  shape: counters
  labels: {}
  dimensions:
  - id: write
    rate_signal: openldap_waiters_write
  - id: read
    rate_signal: openldap_waiters_read
