contexts:
- id: exchange.transport_queues_active_mail_box_delivery
  title: Active Mailbox Delivery Queue length.
  units: messages
  family: transport
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: active
    signal: ms_exchange_transport_queues_active_mail_box_delivery_active
- id: exchange.transport_queues_external_active_remote_delivery
