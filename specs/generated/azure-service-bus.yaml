    noise:
      kind: gauss
      sigma: 0.18
  service_bus_replication_lag_duration_duration:
    base: 0.9
    min: 0.0
    max: 86400.0
    noise:
      kind: gauss
      sigma: 0.18
  service_bus_checkpoint_operations_pending:
    base: 120.0
    min: 0.0
    max: 1000000.0
    noise:
      kind: gauss
      sigma: 0.18
contexts:
- id: azure_monitor.service_bus.message_flow
  title: Azure Service Bus Message Flow
  units: messages/s
  family: Messages
  chart_type: line
  priority: 90010
  instances:
    group: azure_service_bus
    chart_prefix: service_bus_message_flow
    family: Messages
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: in
    signal: service_bus_message_flow_in
  - id: out
    signal: service_bus_message_flow_out
- id: azure_monitor.service_bus.message_operations
  title: Azure Service Bus Message Operations
