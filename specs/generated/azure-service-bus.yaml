version: 1
name: azure-service-bus
description: 'Azure Service Bus Namespace as reported through Netdata''s azure_monitor collector, generated
  from its service profile (Microsoft.ServiceBus/Namespaces) so the contexts, units, families and dimension
  names match a real deployment. Charts are per-resource instances, as the collector emits them: resources
  are labels on one node, never separate nodes. Signals move independently rather than being causally
  coupled - see scripts/sync-profile-collectors.py.'
signals:
  service_bus_message_flow_in:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  service_bus_message_flow_out:
    base: 340.0
    min: 0.0
    max: 2000000.0
    noise:
      kind: gauss
      sigma: 0.18
  service_bus_message_operations_completed:
