version: 1
name: envoy
description: Envoy metrics, generated from Netdata's own collector metadata so the contexts, units and
  dimension names match what a real Envoy node reports. Signals are independent and plausible rather than
  causally coupled - see scripts/sync-integrations.py.
signals:
  envoy_server_state_live:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  envoy_server_state_draining:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  envoy_server_state_pre_initializing:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
