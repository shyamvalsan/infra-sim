    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  envoy_server_connections_count_connections:
    base: 180.0
    min: 0.0
    max: 200000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
