contexts:
- id: pgbouncer.client_connections_utilization
  title: Client connections utilization
  units: percentage
  family: client
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: used
    signal: pgbouncer_client_connections_utilization_used
- id: pgbouncer.db_client_connections
  title: Database client connections
  units: connections
  family: db
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    database: sim-database-1
    postgres_database: sim-postgres_database-1
  dimensions:
  - id: active
    signal: pgbouncer_db_client_connections_active
  - id: waiting
    signal: pgbouncer_db_client_connections_waiting
  - id: cancel_req
    signal: pgbouncer_db_client_connections_cancel_req
- id: pgbouncer.db_server_connections
  title: Database server connections
  units: connections
  family: db
  chart_type: line
