contexts:
- id: azure_monitor.sql_elastic_pool.cpu
  title: Azure SQL Elastic Pool CPU Utilization
  units: percentage
  family: Utilization
  chart_type: line
  priority: 90010
  instances:
    group: azure_sql_elastic_pool
    chart_prefix: sql_elastic_pool_cpu
    family: Utilization
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: sql_elastic_pool_cpu_average
  - id: maximum
    signal: sql_elastic_pool_cpu_maximum
- id: azure_monitor.sql_elastic_pool.instance_cpu
