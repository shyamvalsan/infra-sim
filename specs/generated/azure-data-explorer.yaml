- id: azure_monitor.data_explorer.cpu_utilization
  title: Azure Data Explorer CPU Utilization
  units: percentage
  family: Compute
  chart_type: line
  priority: 90010
  instances:
    group: azure_data_explorer
    chart_prefix: data_explorer_cpu_utilization
    family: Compute
    labels:
      resource_uid: '{instance}'
  shape: independent
  dimensions:
  - id: average
    signal: data_explorer_cpu_utilization_average
