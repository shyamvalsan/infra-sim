  - id: error
    rate_signal: hadoop_distributed_file_system_hdfs_logs_total_error
  - id: warn
    rate_signal: hadoop_distributed_file_system_hdfs_logs_total_warn
  - id: fatal
    rate_signal: hadoop_distributed_file_system_hdfs_logs_total_fatal
- id: hdfs.rpc_bandwidth
  title: RPC Bandwidth
  units: kilobits/s
  family: rpc
  chart_type: area
  priority: 60007
  shape: counters
  labels: {}
  dimensions:
  - id: received
    rate_signal: hadoop_distributed_file_system_hdfs_rpc_bandwidth_received
  - id: sent
    rate_signal: hadoop_distributed_file_system_hdfs_rpc_bandwidth_sent
- id: hdfs.rpc_calls
  title: RPC Calls
  units: calls/s
  family: rpc
