version: 1
name: hadoop-distributed-file-system-hdfs
description: Hadoop Distributed File System (HDFS) metrics, generated from Netdata's own collector metadata
  so the contexts, units and dimension names match what a real Hadoop Distributed File System (HDFS) node
  reports. Signals are independent and plausible rather than causally coupled - see scripts/sync-integrations.py.
