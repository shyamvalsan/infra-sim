contexts:
- id: hdfs.heap_memory
  title: Heap Memory
  units: MiB
  family: heap
  chart_type: area
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: committed
    signal: hadoop_distributed_file_system_hdfs_heap_memory_committed
  - id: used
    signal: hadoop_distributed_file_system_hdfs_heap_memory_used
- id: hdfs.gc_count_total
  title: GC Events
  units: events/s
  family: gc
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: gc
    rate_signal: hadoop_distributed_file_system_hdfs_gc_count_total_gc
- id: hdfs.gc_time_total
  title: GC Time
  units: ms
  family: gc
  chart_type: line
  priority: 60003
  shape: independent
  labels: {}
  dimensions:
  - id: ms
    signal: hadoop_distributed_file_system_hdfs_gc_time_total_ms
- id: hdfs.gc_threshold
  title: Number of Times That the GC Threshold is Exceeded
  units: events/s
  family: gc
  chart_type: line
  priority: 60004
  shape: counters
  labels: {}
  dimensions:
  - id: info
    rate_signal: hadoop_distributed_file_system_hdfs_gc_threshold_info
  - id: warn
    rate_signal: hadoop_distributed_file_system_hdfs_gc_threshold_warn
- id: hdfs.threads
  title: Number of Threads
  units: num
  family: threads
  chart_type: stacked
  priority: 60005
  shape: independent
  labels: {}
  dimensions:
  - id: new
    signal: hadoop_distributed_file_system_hdfs_threads_new
  - id: runnable
    signal: hadoop_distributed_file_system_hdfs_threads_runnable
  - id: blocked
    signal: hadoop_distributed_file_system_hdfs_threads_blocked
  - id: waiting
    signal: hadoop_distributed_file_system_hdfs_threads_waiting
  - id: timed_waiting
    signal: hadoop_distributed_file_system_hdfs_threads_timed_waiting
  - id: terminated
