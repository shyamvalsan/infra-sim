version: 1
name: http-endpoints
description: HTTP Endpoints metrics, generated from Netdata's own collector metadata so the contexts,
  units and dimension names match what a real HTTP Endpoints node reports. Signals are independent and
  plausible rather than causally coupled - see scripts/sync-integrations.py.
signals:
  http_endpoints_response_time_time:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  http_endpoints_response_length_length:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  http_endpoints_status_success:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_timeout:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_redirect:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_no_connection:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_bad_content:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_bad_header:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_status_bad_status:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  http_endpoints_in_state_time:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
contexts:
- id: httpcheck.response_time
  title: HTTP Response Time
  units: ms
  family: response
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    url: sim-url-1
  dimensions:
  - id: time
    signal: http_endpoints_response_time_time
- id: httpcheck.response_length
  title: HTTP Response Body Length
  units: characters
  family: response
  chart_type: line
  priority: 60002
  shape: independent
  labels:
    url: sim-url-1
  dimensions:
  - id: length
    signal: http_endpoints_response_length_length
- id: httpcheck.status
  title: HTTP Check Status
  units: boolean
  family: status
  chart_type: line
  priority: 60003
  shape: independent
  labels:
    url: sim-url-1
  dimensions:
  - id: success
    signal: http_endpoints_status_success
  - id: timeout
    signal: http_endpoints_status_timeout
  - id: redirect
    signal: http_endpoints_status_redirect
  - id: no_connection
    signal: http_endpoints_status_no_connection
  - id: bad_content
    signal: http_endpoints_status_bad_content
  - id: bad_header
    signal: http_endpoints_status_bad_header
  - id: bad_status
    signal: http_endpoints_status_bad_status
- id: httpcheck.in_state
  title: HTTP Current State Duration
  units: boolean
  family: in
  chart_type: line
  priority: 60004
  shape: independent
  labels:
    url: sim-url-1
  dimensions:
  - id: time
    signal: http_endpoints_in_state_time
