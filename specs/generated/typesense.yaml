version: 1
name: typesense
description: Typesense metrics, generated from Netdata's own collector metadata so the contexts, units
  and dimension names match what a real Typesense node reports. Signals are independent and plausible
  rather than causally coupled - see scripts/sync-integrations.py.
signals:
  typesense_health_status_ok:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  typesense_health_status_out_of_disk:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  typesense_health_status_out_of_memory:
    base: 1.0
    min: 1.0
    max: 1.0
    min_is_floor: true
    max_is_ceiling: true
  typesense_total_requests_requests:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_requests_by_operation_search:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_requests_by_operation_write:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_requests_by_operation_import:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_requests_by_operation_delete:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_latency_by_operation_search:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_latency_by_operation_write:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_latency_by_operation_import:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_latency_by_operation_delete:
    base: 24.0
    min: 0.0
    max: 600000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  typesense_overloaded_requests_overloaded:
    base: 1100.0
    min: 0.0
    max: 5000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
contexts:
- id: typesense.health_status
  title: Health Status
  units: status
  family: health
  chart_type: line
  priority: 60001
  shape: independent
  labels: {}
  dimensions:
  - id: ok
    signal: typesense_health_status_ok
  - id: out_of_disk
    signal: typesense_health_status_out_of_disk
  - id: out_of_memory
    signal: typesense_health_status_out_of_memory
- id: typesense.total_requests
  title: Total Requests
  units: requests/s
  family: total
  chart_type: line
  priority: 60002
  shape: counters
  labels: {}
  dimensions:
  - id: requests
    rate_signal: typesense_total_requests_requests
- id: typesense.requests_by_operation
  title: Requests by Operation
  units: requests/s
  family: requests
  chart_type: line
  priority: 60003
  shape: counters
  labels: {}
  dimensions:
  - id: search
    rate_signal: typesense_requests_by_operation_search
  - id: write
    rate_signal: typesense_requests_by_operation_write
  - id: import
    rate_signal: typesense_requests_by_operation_import
  - id: delete
    rate_signal: typesense_requests_by_operation_delete
- id: typesense.latency_by_operation
  title: Latency by Operation
  units: milliseconds
  family: latency
  chart_type: line
  priority: 60004
  shape: independent
  labels: {}
  dimensions:
  - id: search
    signal: typesense_latency_by_operation_search
  - id: write
    signal: typesense_latency_by_operation_write
  - id: import
    signal: typesense_latency_by_operation_import
  - id: delete
    signal: typesense_latency_by_operation_delete
- id: typesense.overloaded_requests
  title: Overloaded Requests
  units: requests/s
  family: overloaded
  chart_type: line
  priority: 60005
  shape: counters
  labels: {}
  dimensions:
  - id: overloaded
    rate_signal: typesense_overloaded_requests_overloaded
