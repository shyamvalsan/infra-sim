contexts:
- id: mq.channel.status
  title: Channel Status
  units: status
  family: channel.status
  chart_type: stacked
  priority: 60001
  shape: independent
  labels:
    channel: sim-channel-1
    type: sim-type-1
  dimensions:
  - id: inactive
    signal: ibm_mq_channel_status_inactive
  - id: binding
    signal: ibm_mq_channel_status_binding
  - id: starting
    signal: ibm_mq_channel_status_starting
  - id: running
    signal: ibm_mq_channel_status_running
  - id: stopping
    signal: ibm_mq_channel_status_stopping
  - id: retrying
    signal: ibm_mq_channel_status_retrying
  - id: stopped
    signal: ibm_mq_channel_status_stopped
  - id: requesting
    signal: ibm_mq_channel_status_requesting
  - id: paused
    signal: ibm_mq_channel_status_paused
  - id: disconnected
    signal: ibm_mq_channel_status_disconnected
  - id: initializing
    signal: ibm_mq_channel_status_initializing
  - id: switching
    signal: ibm_mq_channel_status_switching
