contexts:
- id: ceph.cluster_status
  title: Ceph Cluster Status
  units: status
  family: cluster
  chart_type: line
  priority: 60001
  shape: independent
  labels:
    fsid: sim-fsid-1
  dimensions:
  - id: ok
    signal: ceph_cluster_status_ok
  - id: err
    signal: ceph_cluster_status_err
  - id: warn
    signal: ceph_cluster_status_warn
- id: ceph.cluster_hosts_count
