    max_is_ceiling: true
  ceph_cluster_hosts_count_hosts:
    base: 120.0
    min: 0.0
    max: 1000000.0
    seasonality:
      daily_amplitude: 0.45
      peak_hour: 14.0
      weekend_factor: 0.55
    noise:
      kind: gauss
      sigma: 0.16
  ceph_cluster_monitors_count_monitors:
