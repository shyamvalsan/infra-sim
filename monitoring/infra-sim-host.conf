# Infra-Sim host alerts - installed by scripts/host-monitoring.sh.
#
# Scope, deliberately: Netdata's STOCK alarms already cover the generic host
# (disk space on every mount, memory pressure, CPU). This pack adds only what
# is specific to running a simulation host and nothing else - duplicating the
# stock alarms here would mean two sources of truth for the same threshold.
#
# Console-side signals (simulations vs cap, sweep health, docker reachability,
# disk used by the state dir) are NOT alarm material: they live on the
# console's unauthenticated GET /api/health, which any uptime monitor polls.
# Point your monitor at it; see docs/hosting.md.

# Containers reporting unhealthy: simulations run with health checks and
# --restart unless-stopped, so an unhealthy container is one that keeps
# failing despite restarts - a real fault worth a human.
 template: infra_sim_unhealthy_containers
       on: docker.containers_health_status
   os: linux
  hosts: *
 families: *
   lookup: max -2m unlinked of unhealthy
     calc: $this
    every: 1m
     warn: $this > 0
    delay: up 0 down 10m
  summary: Infra-Sim docker containers unhealthy ({$this})
     info: Docker reports unhealthy container(s) for over 2 minutes - inspect with `docker ps` and the container logs.
       to: sysadmin
